    this.holder = null;
    this.holdTimer = 0;
    this.fleeDir = 0;
  }

  /** A civilian/victim sitting in a building window, revealed by a punch. */
  static spawnInWindow(typeId, building, col, row) {
    const r = building.cellRect(col, row);
    const human = new Human(typeId, r.x + r.w / 2, r.y + r.h);
    human.location = 'WINDOW';
    human.state = HumanState.WINDOW_IDLE;
    human.building = building;
    human.col = col;
    human.row = row;
    return human;
  }

  /** A civilian already fleeing across the street. */
  static spawnOnStreet(typeId, x, fleeDir) {
    const human = new Human(typeId, x, CONFIG.world.groundY);
    human.location = 'STREET';
    human.state = HumanState.FLEEING;
    human.fleeDir = fleeDir;
    return human;
  }

  update(dt) {
    if (!this.alive) return;
    if (this.state === HumanState.HELD) { this.updateHeld(dt); return; }
    if (this.location === 'WINDOW') {
      // A building collapsing under a civilian who was never eaten — same
      // rule as Pickup (13-inferred-items.md #26): it doesn't survive into
      // rubble.
      if (this.building && !this.building.standing) this.despawn();
      return;
    }
    this.updateFleeing(dt);
  }

  /** §2.3 — track the holding monster until the random hold time runs out. */
  updateHeld(dt) {
    const H = CONFIG.humans;
    const m = this.holder;
    this.x = m.x + (m.facing > 0 ? H.holdOffsetX : -H.holdOffsetX);
    this.y = m.y - H.holdOffsetY;
    this.holdTimer -= dt;
    if (this.holdTimer <= 0) this.struggleFree();
  }

  /**
   * §2.3 "the victim struggles free ... and can then be eaten." Drops onto
   * the street at the monster's position and flees like any other civilian;
   * `grabbable` is now false so a further punch only ever eats it.
   * [INFERRED — 13-inferred-items.md #29: the GDD doesn't say where a freed
   * victim ends up or what it does next.]
   */
  struggleFree() {
    const m = this.holder;
    if (m) m.holding = null;
    this.holder = null;
    this.grabbable = false;
    this.location = 'STREET';
    this.state = HumanState.FLEEING;
    this.y = CONFIG.world.groundY;
    this.fleeDir = this.x < CONFIG.view.width / 2 ? -1 : 1;
  }

  updateFleeing(dt) {
    const H = CONFIG.humans;
    this.vx = this.fleeDir * H.street.fleeSpeed;
    this.x += this.vx * dt;
    const margin = this.w * 2;
    if (this.x < -margin || this.x > CONFIG.view.width + margin) this.alive = false;
  }

  /** §4.2 — eaten (the only outcome for a civilian, or for the wrong
   * monster's designated victim; see Monster.interactWithHuman). §6: "eat a
   * civilian" scores flat regardless of which Human type this is — the GDD
   * gives no separate row for eating the wrong monster's designated victim
   * or a struggled-free former one, both of which read as "just another
   * civilian to eat" per Session 5's own framing. [INFERRED.] */
  consume(monster, game) {
    if (!this.alive) return;
    monster.eatTimer = CONFIG.art.eatDuration;   // 09-art-audio §10 — art-only
    SFX.play('eat');
    monster.heal(CONFIG.humans.civilianHeal, this.typeId);
    game.scoreSystem.award(monster, CONFIG.scoring.eatCivilian, this.typeId);
    this.despawn();
  }

  despawn() {
    this.alive = false;
    if (this.location === 'WINDOW' && this.building) this.building.clearHumanCell(this.col, this.row);
  }

  /* ---- 09-art-audio: placeholder rectangle art ------------------------- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    const w = this.w, h = this.h;

    // Flash just before a held victim struggles free — same convention as
    // Pickup's fuse warning.
    const warn = this.state === HumanState.HELD && this.holdTimer < 1.0 &&
      Math.floor(this.holdTimer * 10) % 2 === 0;
    ctx.fillStyle = warn ? '#ffffff' : this.type.color;
    ctx.fillRect(cx - w / 2, feet - h, w, h);

    // Designated victims get an accent outline so a player can tell their
    // own target at a glance, even before there's real art.
    if (this.role === HumanRole.DESIGNATED_VICTIM) {
      ctx.strokeStyle = CONFIG.ui.accentColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - w / 2 + 0.5, feet - h + 0.5, w - 1, h - 1);
    }
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — Enemy (base class)

   "The military attacks continuously. Present every day: National
   Guardsmen and helicopters." One thin base class per 10-architecture.md
   §11.3 ("Enemy — Guardsman, Helicopter, Tank, Police, Paratrooper via a
   `behavior` field/strategy"). `behavior` is a subclass-defined string
   naming whatever sub-state that particular enemy is currently in (idle,
   diving, planting, ...) — there's no shared state machine here, just a
   documented place to put one, the same shape `Monster.stance` uses for
   traversal.

   STATUS.md's Session 6 hook left this decision open: the Session 5
   `WINDOW_SOLDIER` placeholder on `Human` is superseded by this — a window
   Guardsman is an `Enemy`, not a `Human`, per the architecture doc's
   explicit suggestion. `HumanRole.WINDOW_SOLDIER` and its CONFIG entry are
   removed below since nothing ever spawns one.
   ========================================================================== */
class Enemy extends Entity {
  constructor(x, y, w, h, kind) {
    super(x, y, w, h);
    this.kind = kind;        // 'GUARDSMAN_WINDOW' | 'GUARDSMAN_STREET' | 'HELICOPTER' | ...
    this.behavior = null;    // subclass-defined current behavior/sub-state
    // §5.1 — new in Session 7: LightningCloud is "a hazard rather than a
    // unit" and overrides this to false so Game.enemyTargetFor can't ever
    // find it. Every other Enemy so far is destroyable, hence the default.
    this.punchable = true;
  }

  /** §6 — points awarded for destroying/eating this enemy. Overridden per
   * subclass; the base 0 is a safe default for anything (LightningCloud)
   * that's never actually reachable through the punch-resolution path. */
  get scorePoints() { return 0; }
}


/* ==========================================================================
   04-military-hazards §5.1 — Guardsman

   "Pops out of building windows to shoot and throw dynamite ... some run in
   from the screen edge to plant demolition charges at a building's base.
   Can be eaten out of windows (removes threat + heals)."

   One class, two spawn shapes (`variant`), same pattern Session 5 used for
   Human's window/street split:

   - WINDOW — anchored to a building cell like Human.spawnInWindow, chosen
     by SpawnDirector (not revealed by punching — this one climbs out on its
     own initiative). Fires on an interval: a straight bullet, or a lobbed
     dynamite toward whichever monster is in range. Eating it (a connecting
     punch, same single grab/eat action as Pickup/Human — 13-inferred-items
     #24/#27) heals the monster and removes the threat.
   - STREET — spawns at a screen edge like Human.spawnOnStreet and runs for
     the nearest standing building's base; once there it plants a
     Projectile('CHARGE') and is done. [INFERRED — the GDD doesn't say
     whether the street runner can be stopped before it plants; a
     connecting punch destroys it either way, but only the WINDOW variant
     heals on eating — 13-inferred-items.md #34.]

   §2.3's hook, now observed: a window Guardsman skips firing at a monster
   currently holding its designated victim (`Monster.isHoldingVictim`).
   [INFERRED — 13-inferred-items.md #7 left the scope undecided; this
   implements it per-target (the Guardsman's actual target monster), not as
   a global "nobody fires" switch, since a Guardsman shooting at a monster
   two buildings over has no reason to care what a different monster is
   holding.]
   ========================================================================== */
class Guardsman extends Enemy {
  constructor(variant, x, y) {
    const G = CONFIG.enemies.guardsman;
    super(x, y, G.width, G.height, variant === 'WINDOW' ? 'GUARDSMAN_WINDOW' : 'GUARDSMAN_STREET');
    this.variant = variant;
    if (variant === 'WINDOW') {
      this.behavior = 'ACTIVE';
      this.building = null;
      this.col = -1;
      this.row = -1;
      this.fireTimer = G.window.fireInterval;
    } else {
      this.behavior = 'RUNNING';
      this.targetBuilding = null;
      this.runDir = 0;
      this.plantTimer = 0;
    }
  }

  static spawnInWindow(building, col, row) {
    const r = building.cellRect(col, row);
    const g = new Guardsman('WINDOW', r.x + r.w / 2, r.y + r.h);
    g.building = building;
    g.col = col;
    g.row = row;
    return g;
  }

  static spawnOnStreet(x, runDir, targetBuilding) {
    const g = new Guardsman('STREET', x, CONFIG.world.groundY);
    g.runDir = runDir;
    g.targetBuilding = targetBuilding;
    return g;
  }

  update(dt, game) {
    if (!this.alive) return;
    if (this.variant === 'WINDOW') this.updateWindow(dt, game);
    else this.updateStreet(dt, game);
  }

  updateWindow(dt, game) {
    // The building it's popping out of came down under it — safety net,
    // same shape as Pickup.update / Human.update's building-collapse check.
    if (!this.building.standing || this.building.cellAt(this.col, this.row).state === CellState.GONE) {
      this.despawn();
      return;
    }
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      const W = CONFIG.enemies.guardsman.window;
      this.fireTimer = W.fireInterval + (game.nextSpawnFrac() - 0.5) * 2 * W.fireIntervalJitter;
      this.tryFire(game);
    }
  }

  tryFire(game) {
    const W = CONFIG.enemies.guardsman.window;
    const target = game.nearestMonster(this.x, this.y, W.targetRange);
    if (!target) return;
    if (target.isHoldingVictim) return;   // §2.3 hook, observed at last
    if (game.nextSpawnFrac() < W.dynamiteChance) {
      game.entities.add(Projectile.spawnDynamite(this.x, this.y, target));
    } else {
      const dir = target.x < this.x ? -1 : 1;
      game.entities.add(Projectile.spawnBullet(this.x, this.y, dir));
    }
  }

  updateStreet(dt, game) {
    const S = CONFIG.enemies.guardsman.street;
    if (this.behavior === 'RUNNING') {
      if (!this.targetBuilding || !this.targetBuilding.standing) { this.despawn(); return; }
      this.vx = this.runDir * S.speed;
      this.x += this.vx * dt;
      const baseX = this.targetBuilding.x;
      const reached = this.runDir > 0 ? this.x >= baseX : this.x <= baseX;
      if (reached) {
        this.x = baseX;
        this.vx = 0;
        this.behavior = 'PLANTING';
        this.plantTimer = S.plantTime;
      }
      return;
    }
    if (this.behavior === 'PLANTING') {
      if (!this.targetBuilding.standing) { this.despawn(); return; } // punched down mid-plant
      this.plantTimer -= dt;
      if (this.plantTimer <= 0) {
        game.entities.add(Projectile.spawnCharge(this.targetBuilding));
        this.despawn();
      }
    }
  }

  /** §6 — "National Guardsman: 50", no distinction by variant. */
  get scorePoints() { return CONFIG.scoring.nationalGuardsman; }

  /** A connecting punch — window or street. Only the window variant heals;
   * §5.1 only documents eating from a window. */
  consume(monster) {
    if (!this.alive) return;
    // 09-art-audio §10 — [INFERRED, 13-inferred-items.md #51]: the window
    // variant heals, so it reads as 'eat'; the street variant is destroyed,
    // not eaten, so it reuses the 'punch' impact sound instead.
    if (this.variant === 'WINDOW') {
      monster.eatTimer = CONFIG.art.eatDuration;
      SFX.play('eat');
      monster.heal(CONFIG.enemies.guardsman.eatHeal, 'GUARDSMAN');
    } else {
      SFX.play('punch');
    }
    this.despawn();
  }

  despawn() {
    this.alive = false;
    if (this.variant === 'WINDOW' && this.building) this.building.clearEnemyCell(this.col, this.row);
  }

  /* ---- 09-art-audio §10 — soldier icon: helmet + a rifle line ---------- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const G = CONFIG.enemies.guardsman;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    ctx.fillStyle = G.color;
    ctx.fillRect(cx - this.w / 2, feet - this.h, this.w, this.h);
    ctx.fillStyle = G.helmetColor;
    ctx.fillRect(cx - this.w / 2, feet - this.h, this.w, Math.round(this.h * 0.3));
    // A rifle held at the ready — window variant aims toward whichever way
    // its building cell sits, street variant carries it while it runs.
    const dir = this.variant === 'WINDOW' ? (this.col === 0 ? -1 : 1) : (this.runDir || 1);
    const armY = feet - Math.round(this.h * 0.55);
    ctx.fillStyle = G.helmetColor;
    ctx.fillRect(dir > 0 ? cx + this.w / 2 - 1 : cx - this.w / 2 - 5, armY, 6, 2);
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — Helicopter

   "Air support, every day. Early: flies over, turns, and dives to strafe
   (rapid burst). Later: drops bombs from altitude. Can be destroyed on its
   approach."

   Both behaviors are implemented; `mode` is captured at spawn time from
   `CONFIG.enemies.helicopter.behaviorMode` — the difficulty flag
   SpawnDirector reads. Flip that CONFIG value and the next helicopter
   spawned uses the other behavior; Session 9's day/level system is what
   will eventually drive it automatically per §5.2.

   STRAFE: APPROACH (cruise altitude, flies to mid-screen) → DIVE_DOWN (drops
   to just above the tallest roofline) → STRAFING (a rapid burst while
   drifting further across) → DIVE_UP (climbs back to cruise) → EXIT (flies
   off and despawns).
   BOMB: APPROACH the whole way across at cruise altitude, releasing a bomb
   on a fixed interval, then EXIT.

   Destruction is a single connecting punch — same `consume(monster)` shape
   every other punch target in this file uses — via `Game.enemyTargetFor`,
   which only ever finds it geometrically reachable during STRAFING, when it
   dips to `diveAltitudeY` (picked to sit just above the tallest building in
   the day layout — see the CONFIG comment). [INFERRED throughout —
   13-inferred-items.md #35.]
   ========================================================================== */
class Helicopter extends Enemy {
  constructor(x, y, dir, mode) {
    const H = CONFIG.enemies.helicopter;
    super(x, y, H.width, H.height, 'HELICOPTER');
    this.dir = dir;              // 1 = left→right, -1 = right→left
    this.mode = mode;            // 'STRAFE' | 'BOMB', fixed for this instance's life
    this.behavior = 'APPROACH';
    this.dropTimer = H.bomb.dropInterval;
    this.burstsFired = 0;
    this.burstTimer = 0;
    this.rotorPhase = 0;   // 09-art-audio §10 — cosmetic rotor-spin clock
  }

  static spawn(fromLeft, mode) {
    const H = CONFIG.enemies.helicopter;
    const x = fromLeft ? CONFIG.world.leftBound - 20 : CONFIG.world.rightBound + 20;
    return new Helicopter(x, H.cruiseAltitudeY, fromLeft ? 1 : -1, mode);
  }

  update(dt, game) {
    if (!this.alive) return;
    this.rotorPhase = (this.rotorPhase + dt * CONFIG.enemies.helicopter.rotorSpinSpeed) % 1;
    if (this.mode === 'BOMB') this.updateBomb(dt, game);
    else this.updateStrafe(dt, game);
  }

  /** Later behavior (§5.2): straight across at altitude, dropping bombs. */
  updateBomb(dt, game) {
    const H = CONFIG.enemies.helicopter;
    this.x += this.dir * H.cruiseSpeed * dt;
    this.dropTimer -= dt;
    if (this.dropTimer <= 0 && this.x > CONFIG.world.leftBound && this.x < CONFIG.world.rightBound) {
      this.dropTimer = H.bomb.dropInterval;
      game.entities.add(Projectile.spawnBomb(this.x, this.y));
    }
    if ((this.dir > 0 && this.x > CONFIG.world.rightBound + 20) ||
        (this.dir < 0 && this.x < CONFIG.world.leftBound - 20)) this.alive = false;
  }

  /** Early behavior (§5.2): flies over, turns (dives), strafes, climbs out. */
  updateStrafe(dt, game) {
    const H = CONFIG.enemies.helicopter;
    const S = H.strafe;
    const mid = CONFIG.view.width / 2;
    switch (this.behavior) {
      case 'APPROACH':
        this.x += this.dir * H.cruiseSpeed * dt;
        if ((this.dir > 0 && this.x >= mid) || (this.dir < 0 && this.x <= mid)) this.behavior = 'DIVE_DOWN';
        break;
      case 'DIVE_DOWN':
        this.y += S.diveSpeed * dt;
        if (this.y >= S.diveAltitudeY) {
          this.y = S.diveAltitudeY;
          this.behavior = 'STRAFING';
          this.burstsFired = 0;
          this.burstTimer = 0;
        }
        break;
      case 'STRAFING':
        this.x += this.dir * H.cruiseSpeed * 0.5 * dt;   // slower during the pass
        this.burstTimer -= dt;
        if (this.burstTimer <= 0 && this.burstsFired < S.burstCount) {
          game.entities.add(Projectile.spawnBullet(this.x, this.y, this.dir));
          this.burstsFired++;
          this.burstTimer = S.burstInterval;
        }
        if (this.burstsFired >= S.burstCount) this.behavior = 'DIVE_UP';
        break;
      case 'DIVE_UP':
        this.y -= S.diveSpeed * dt;
        this.x += this.dir * H.cruiseSpeed * dt;
        if (this.y <= H.cruiseAltitudeY) { this.y = H.cruiseAltitudeY; this.behavior = 'EXIT'; }
        break;
      case 'EXIT':
        this.x += this.dir * H.cruiseSpeed * dt;
        if ((this.dir > 0 && this.x > CONFIG.world.rightBound + 20) ||
            (this.dir < 0 && this.x < CONFIG.world.leftBound - 20)) this.alive = false;
        break;
    }
  }

  /** §6 — "Helicopter: 750". */
  get scorePoints() { return CONFIG.scoring.helicopter; }

  /** "Can be destroyed on its approach" — a connecting punch is all it
   * takes. No heal; a helicopter isn't food. */
  consume() {
    SFX.play('explosion');   // 09-art-audio §10 — [INFERRED, #51]
    this.alive = false;
  }

  /* ---- 09-art-audio §10 — body + tail boom + cockpit + a spinning-blur
     main rotor and a small tail rotor -------------------------------------- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const H = CONFIG.enemies.helicopter;
    const cx = Math.round(this.renderX(alpha));
    const cy = Math.round(this.renderY(alpha));
    const tailDir = -this.dir;   // tail boom trails behind the direction of travel

    ctx.fillStyle = H.bodyColor;
    ctx.fillRect(cx - this.w / 2, cy - this.h / 2, this.w, this.h);
    // Tail boom + fin.
    ctx.fillRect(cx + tailDir * this.w / 2, cy - 1, tailDir * 8, 2);
    ctx.fillRect(cx + tailDir * (this.w / 2 + 6), cy - 3, 1, 5);
    // Cockpit bubble, on the nose (direction of travel).
    ctx.fillStyle = H.rotorColor;
    ctx.beginPath();
    ctx.arc(cx - tailDir * this.w * 0.3, cy, this.h * 0.35, 0, Math.PI * 2);
    ctx.fill();
    // Main rotor — a spinning blur (two crossed lines rotating faster than
    // the eye can track individual blades).
    const ang = this.rotorPhase * Math.PI * 2;
    const span = this.w * 0.7;
    ctx.strokeStyle = H.rotorColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(ang) * span, cy - this.h / 2 - 2 - Math.sin(ang) * 2);
    ctx.lineTo(cx + Math.cos(ang) * span, cy - this.h / 2 - 2 + Math.sin(ang) * 2);
    ctx.stroke();
    // Tail rotor, spinning in the same phase.
    ctx.beginPath();
    ctx.moveTo(cx + tailDir * (this.w / 2 + 6), cy - 3 - Math.cos(ang) * 3);
    ctx.lineTo(cx + tailDir * (this.w / 2 + 6), cy - 3 + Math.cos(ang) * 3);
    ctx.stroke();
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — Vehicle (Tank / Police)

   "Tank: slow, heavily armored; fires heavy shells that do big damage and
   large knockback (can knock a monster off a building or across the screen).
   Punish between shots or drop objects on it. Police car: like a tank but
   moves and fires faster."

   One class, `variant` picks TANK or POLICE — same one-class-two-flavors
   shape Guardsman/Helicopter already use. Drives straight across the street
   from one edge to the other (same one-pass shape as Guardsman's street
   variant and Helicopter), firing a shell at the nearest monster on an
   interval, then despawns off the far edge. A connecting punch destroys it
   outright — "armored" isn't modeled as extra hit points; see the CONFIG
   comment. Neither variant heals on destruction, and neither checks
   Monster.isHoldingVictim — 13-inferred-items.md #7 scopes the "holding
   stops fire" courtesy to the Guardsmen specifically, and #38 covers the
   rest of what's guessed at here.
   ========================================================================== */
class Vehicle extends Enemy {
  constructor(variant, x, dir) {
    const V = CONFIG.enemies.vehicle;
    const spec = variant === 'TANK' ? V.tank : V.police;
    super(x, CONFIG.world.groundY, V.width, V.height, variant === 'TANK' ? 'TANK' : 'POLICE');
    this.variant = variant;
    this.spec = spec;
    this.dir = dir;
    this.behavior = 'PATROL';
    this.fireTimer = spec.fireInterval;
    this.lightPhase = 0;   // 09-art-audio §10 — police lightbar flash clock
  }

  static spawn(variant, fromLeft) {
    const x = fromLeft ? CONFIG.world.leftBound - 20 : CONFIG.world.rightBound + 20;
    return new Vehicle(variant, x, fromLeft ? 1 : -1);
  }

  update(dt, game) {
    if (!this.alive) return;
    const V = CONFIG.enemies.vehicle;
    this.lightPhase = (this.lightPhase + dt * V.lightbarFlashSpeed) % 1;
    this.x += this.dir * this.spec.speed * dt;

    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = this.spec.fireInterval +
        (game.nextSpawnFrac() - 0.5) * 2 * this.spec.fireIntervalJitter;
      const target = game.nearestMonster(this.x, this.y, V.targetRange);
      if (target) {
        const dir = target.x < this.x ? -1 : 1;
        game.entities.add(Projectile.spawnShell(this.x, this.y, dir, this.spec.damageKey));
      }
    }

    if ((this.dir > 0 && this.x > CONFIG.world.rightBound + 20) ||
        (this.dir < 0 && this.x < CONFIG.world.leftBound - 20)) this.alive = false;
  }

  /** §6 — "Police car: 750" / "Tank: 200". */
  get scorePoints() { return this.variant === 'POLICE' ? CONFIG.scoring.policeCar : CONFIG.scoring.tank; }

  /** A connecting punch — no heal, a vehicle isn't food. */
  consume() {
    SFX.play('explosion');   // 09-art-audio §10 — [INFERRED, #51]
    this.alive = false;
  }

  /* ---- 09-art-audio §10 — treads, a barrel pointing the direction of
     travel, and (police only) a flashing lightbar ------------------------ */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    ctx.fillStyle = this.spec.bodyColor;
    ctx.fillRect(cx - this.w / 2, feet - this.h, this.w, this.h);

    // Tread notches along the bottom edge.
    ctx.fillStyle = CONFIG.art.outlineColor;
    for (let x = -this.w / 2 + 2; x < this.w / 2; x += 5) {
      ctx.fillRect(cx + x, feet - 2, 2, 2);
    }

    ctx.fillStyle = this.spec.turretColor;
    ctx.fillRect(cx - this.w / 4, feet - this.h - 4, this.w / 2, 4);
    // Barrel — points the way the vehicle is driving.
    const barrelLen = this.variant === 'TANK' ? 10 : 7;
    ctx.fillRect(this.dir > 0 ? cx : cx - barrelLen, feet - this.h - 3, barrelLen, 2);

    if (this.variant === 'POLICE') {
      const on = this.lightPhase < 0.5;
      ctx.fillStyle = on ? '#e04a3a' : '#3a6fe0';
      ctx.fillRect(cx - 4, feet - this.h - 6, 3, 2);
      ctx.fillStyle = on ? '#3a6fe0' : '#e04a3a';
      ctx.fillRect(cx + 1, feet - this.h - 6, 3, 2);
    }
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — Paratrooper

   "Lands on a rooftop and defends that building; rapid-fires when the
   monster is on it."

   Descends from cruise altitude straight down onto one specific standing
   building (picked by Game.trySpawnParatrooper, which also keeps two
   paratroopers from ever being assigned the same building), lands on its
   roof, and stays there defending it for the rest of its life. Only fires
   while a monster is actually attached to that building (Game.
   monsterOnBuilding) — a monster on a different roof entirely gets no
   attention from it, which is the whole point of "defends that building."
   [INFERRED — 13-inferred-items.md #39: drop speed and the rapid-fire
   interval aren't documented; the fire mechanism itself reuses Guardsman's
   bullet, since §5.1 gives no separate paratrooper weapon.]
   ========================================================================== */
class Paratrooper extends Enemy {
  constructor(building) {
    const P = CONFIG.enemies.paratrooper;
    super(building.x, CONFIG.enemies.helicopter.cruiseAltitudeY, P.width, P.height, 'PARATROOPER');
    this.building = building;
    this.behavior = 'DROPPING';
    this.fireTimer = P.fireInterval;
  }

  static spawn(building) { return new Paratrooper(building); }

  update(dt, game) {
    if (!this.alive) return;
    if (!this.building.standing) { this.alive = false; return; }
    const P = CONFIG.enemies.paratrooper;

    if (this.behavior === 'DROPPING') {
      this.y += P.dropSpeed * dt;
      if (this.y >= this.building.top) {
        this.y = this.building.top;
        this.behavior = 'DEFENDING';
      }
      return;
    }

    // DEFENDING (§5.1: "rapid-fires when the monster is on it").
    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = P.fireInterval + (game.nextSpawnFrac() - 0.5) * 2 * P.fireIntervalJitter;
      const target = game.monsterOnBuilding(this.building);
      if (target) {
        const dir = target.x < this.x ? -1 : 1;
        game.entities.add(Projectile.spawnBullet(this.x, this.y, dir));
      }
    }
  }

  /** §6 — "Paratrooper: 50". */
  get scorePoints() { return CONFIG.scoring.paratrooper; }

  /** A connecting punch — no heal, same reasoning as the street Guardsman. */
  consume() {
    SFX.play('punch');   // 09-art-audio §10 — [INFERRED, #51]
    this.alive = false;
  }

  /* ---- 09-art-audio §10 — a parachute dome + shroud lines while dropping,
     a rifle once it's DEFENDING ------------------------------------------ */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const P = CONFIG.enemies.paratrooper;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    if (this.behavior === 'DROPPING') {
      ctx.fillStyle = P.chuteColor;
      ctx.beginPath();
      ctx.arc(cx, feet - this.h - 8, this.w, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = P.chuteColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - this.w, feet - this.h - 8); ctx.lineTo(cx - 2, feet - this.h);
      ctx.moveTo(cx + this.w, feet - this.h - 8); ctx.lineTo(cx + 2, feet - this.h);
      ctx.stroke();
    }
    ctx.fillStyle = P.color;
    ctx.fillRect(cx - this.w / 2, feet - this.h, this.w, this.h);
    ctx.fillStyle = P.helmetColor;
    ctx.fillRect(cx - this.w / 2, feet - this.h, this.w, Math.round(this.h * 0.3));
    if (this.behavior === 'DEFENDING') {
      ctx.fillRect(cx + this.w / 2 - 1, feet - Math.round(this.h * 0.55), 6, 2);
    }
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — LightningCloud

   "Drifts over the city and fires lightning bolts; heavy damage on hit. A
   hazard rather than a unit; scheduled per day."

   Unlike every other Enemy so far, `punchable = false` — it cannot be
   destroyed, only avoided, per the GDD's own "hazard rather than a unit"
   framing. Drifts across at a fixed altitude (above the helicopter's own
   cruise line) firing a bolt straight down from its current position on an
   interval — no target homing, since a drifting hazard's schedule is a
   different thing from a unit's fire-control. [INFERRED throughout —
   13-inferred-items.md #39.]
   ========================================================================== */
class LightningCloud extends Enemy {
  constructor(x, dir) {
    const L = CONFIG.enemies.lightningCloud;
    super(x, L.altitudeY, L.width, L.height, 'LIGHTNING_CLOUD');
    this.dir = dir;
    this.behavior = 'DRIFT';
    this.boltTimer = L.boltInterval;
    this.punchable = false;   // "a hazard rather than a unit" — §5.1
  }

  static spawn(fromLeft) {
    const x = fromLeft ? CONFIG.world.leftBound - 20 : CONFIG.world.rightBound + 20;
    return new LightningCloud(x, fromLeft ? 1 : -1);
  }

  update(dt, game) {
    if (!this.alive) return;
    const L = CONFIG.enemies.lightningCloud;
    this.x += this.dir * L.driftSpeed * dt;

    this.boltTimer -= dt;
    if (this.boltTimer <= 0) {
      this.boltTimer = L.boltInterval + (game.nextSpawnFrac() - 0.5) * 2 * L.boltIntervalJitter;
      game.entities.add(Projectile.spawnLightningBolt(this.x, this.y));
    }

    if ((this.dir > 0 && this.x > CONFIG.world.rightBound + 20) ||
        (this.dir < 0 && this.x < CONFIG.world.leftBound - 20)) this.alive = false;
  }

  /* ---- 09-art-audio §10 — a fluffy cloud silhouette (overlapping circles)
     rather than a flat rectangle, still flashing just before it fires ----- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const L = CONFIG.enemies.lightningCloud;
    const cx = Math.round(this.renderX(alpha));
    const cy = Math.round(this.renderY(alpha));
    const flashing = this.boltTimer < 0.3;
    ctx.fillStyle = flashing ? L.flashColor : L.color;
    const r = this.h / 2;
    const lobes = [-0.32, 0, 0.32];
    for (const t of lobes) {
      ctx.beginPath();
      ctx.arc(cx + t * this.w, cy, r * (t === 0 ? 1.15 : 0.9), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillRect(cx - this.w / 2 + r * 0.3, cy, this.w - r * 0.6, r * 0.6);
  }
}


/* ==========================================================================
   04-military-hazards §5.1 — Projectile

   Bullets (Guardsman rifle + helicopter strafe burst), thrown dynamite
   (Guardsman), bombs (helicopter bombing run) and demolition charges
   (street Guardsman) — one class, `kind` picks the flavor of motion and
   what it does on impact. All damage against a monster routes through the
   same `Monster.applyDamage` funnel Session 4 built (`CONFIG.health.damage`
   already had named slots for `bullet`/`dynamiteThrown` waiting for this
   session, and `bomb` is new).

   Building damage (`kind === 'BOMB'` hitting a roof, `kind === 'CHARGE'`
   detonating) always calls `Building.damageCell` with `byMonster` null —
   that's what keeps `Building.causedBy` null and pays the 2,500-point
   building bonus to nobody (§6), per Session 3's `causedBy: null` seam and
   this session's explicit requirement that military-caused collapses never
   credit a player.
   ========================================================================== */
class Projectile extends Entity {
  constructor(kind, x, y, w, h) {
    super(x, y, w, h);
    this.kind = kind;         // 'BULLET' | 'DYNAMITE' | 'BOMB' | 'CHARGE' | 'SHELL' |
                              // 'LIGHTNING_BOLT' | 'DROPPED_OBJECT'
    this.building = null;     // CHARGE only — the building it's anchored to
    this.fuseTimer = 0;
    this.damageKey = null;    // SHELL only — 'tankShell' | 'shell'
    this.color = null;        // DROPPED_OBJECT only — copied from its Pickup def
    this.weaponId = null;     // DROPPED_OBJECT only — Pickup def id, for §6 scoring
    this.byMonster = null;    // DROPPED_OBJECT only — who punched it loose (§6 credit)
  }

  static spawnBullet(x, y, dir) {
    const P = CONFIG.enemies.projectiles.bullet;
    const p = new Projectile('BULLET', x, y, P.width, P.height);
    p.vx = dir * P.speed;
    return p;
  }

  /** Tank/police heavy shell (§5.1) — new in Session 7. Straight line, same
   * shape as a bullet; `damageKey` picks which CONFIG.health.damage entry
   * pays out and Monster.applyKnockback does the rest on a direct hit. */
  static spawnShell(x, y, dir, damageKey) {
    const P = CONFIG.enemies.projectiles.shell;
    const p = new Projectile('SHELL', x, y, P.width, P.height);
    p.vx = dir * P.speed;
    p.damageKey = damageKey;
    return p;
  }

  /** Lightning bolt (§5.1) — new in Session 7. Straight down from wherever
   * the cloud currently is; no horizontal motion, no homing. */
  static spawnLightningBolt(x, y) {
    const P = CONFIG.enemies.projectiles.bolt;
    const p = new Projectile('LIGHTNING_BOLT', x, y, P.width, P.height);
    p.vy = P.speed;
    return p;
  }

  /** Environmental weapon knocked loose from a building cell (§4.3/§5.1) —
   * new in Session 7. Straight down; destroys the first Tank/Police/
   * Helicopter it reaches (Game.groundOrAirUnitHitBy), otherwise vanishes
   * harmlessly at street level. [INFERRED — 13-inferred-items.md #40.]
   * `byMonster` is who punched it loose — new in Session 8, so a hit it
   * eventually lands can credit the right player's score (§6). */
  static spawnDroppedObject(x, y, def, byMonster) {
    const P = CONFIG.enemies.projectiles.dropped;
    const p = new Projectile('DROPPED_OBJECT', x, y, P.width, P.height);
    p.vy = P.fallSpeed;
    p.color = def.color;
    p.weaponId = def.id;
    p.byMonster = byMonster;
    return p;
  }

  /** Lobbed toward wherever `target` is standing at throw time — no homing
   * once airborne. [INFERRED — §5.1 gives no thrown-weapon kinematics.] */
  static spawnDynamite(x, y, target) {
    const P = CONFIG.enemies.projectiles.dynamite;
    const p = new Projectile('DYNAMITE', x, y, P.width, P.height);
    const dir = target.x < x ? -1 : 1;
    p.vx = dir * P.speed;
    p.vy = P.upSpeed;
    p.fuseTimer = P.fuse;
    return p;
  }

  /** Straight down from the helicopter's current position. */
  static spawnBomb(x, y) {
    const P = CONFIG.enemies.projectiles.bomb;
    const p = new Projectile('BOMB', x, y, P.width, P.height);
    p.vy = P.fallSpeed;
    return p;
  }

  /** Planted, not thrown — no motion, just a fuse. */
  static spawnCharge(building) {
    const C = CONFIG.enemies.demolitionCharge;
    const p = new Projectile('CHARGE', building.x, CONFIG.world.groundY, 8, 8);
    p.building = building;
    p.fuseTimer = C.fuse;
    return p;
  }

  update(dt, game) {
    if (!this.alive) return;
    if (this.kind === 'CHARGE') { this.updateCharge(dt, game); return; }

    if (this.kind === 'DYNAMITE') this.vy += CONFIG.enemies.projectiles.dynamite.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this.fuseTimer > 0) {
      this.fuseTimer -= dt;
      if (this.fuseTimer <= 0) { this.explode(game, null); return; }
    }

    if (this.kind === 'BULLET' || this.kind === 'SHELL') {
      if (this.x < -20 || this.x > CONFIG.view.width + 20) { this.alive = false; return; }
    } else if (this.kind === 'BOMB') {
      const b = game.buildingAt(this.x);
      if (b && this.y >= b.top) { this.hitBuilding(b, game); return; }
      if (this.y >= CONFIG.world.groundY) { this.explode(game, null); return; }
    } else if (this.kind === 'DYNAMITE') {
      if (this.y >= CONFIG.world.groundY) { this.explode(game, null); return; }
    } else if (this.kind === 'LIGHTNING_BOLT') {
      if (this.y >= CONFIG.world.groundY) { this.alive = false; return; }
    } else if (this.kind === 'DROPPED_OBJECT') {
      // Only reaches Tank/Police/Helicopter, never a monster — see the
      // CONFIG comment on CONFIG.enemies.projectiles.dropped.
      const target = game.groundOrAirUnitHitBy(this);
      if (target) {
        target.alive = false;
        this.alive = false;
        SFX.play('explosion');   // 09-art-audio §10 — a vehicle/aircraft going down
        game.scoreSystem.award(this.byMonster, this.weaponScore(game), this.weaponId);
      }
      else if (this.y >= CONFIG.world.groundY) { this.alive = false; }
      return;
    }

    const hit = game.monsterHitBy(this);
    if (hit) {
      // 09-art-audio §10 — [INFERRED trigger mapping, 13-inferred-items.md
      // #51]: a bullet is a 'punch'-weight impact, a shell is heavy enough to
      // read as an 'explosion', lightning is a 'zap'; dynamite/bombs fall
      // through to explode(), which plays its own.
      if (this.kind === 'BULLET') {
        hit.applyDamage(CONFIG.health.damage.bullet, 'BULLET');
        SFX.play('punch');
        this.alive = false;
      } else if (this.kind === 'SHELL') {
        hit.applyDamage(CONFIG.health.damage[this.damageKey], this.damageKey);
        hit.applyKnockback(this.x, CONFIG.health.knockback.shellSpeedX, CONFIG.health.knockback.shellSpeedY);
        SFX.play('explosion');
        this.alive = false;
      } else if (this.kind === 'LIGHTNING_BOLT') {
        hit.applyDamage(CONFIG.health.damage.lightning, 'lightning');
        SFX.play('zap');
        this.alive = false;
      } else {
        this.explode(game, hit);
      }
    }
  }

  /** §6 — manhole cover and flower pot score flat; safe is the table's one
   * ranged dropped-weapon row, resolved the same deterministic way as the
   * designated-victim hold bonus (ScoreSystem.pickInRange). */
  weaponScore(game) {
    const S = CONFIG.scoring;
    if (this.weaponId === 'MANHOLE_COVER') return S.manholeCover;
    if (this.weaponId === 'FLOWER_POT') return S.flowerPot;
    if (this.weaponId === 'SAFE') return game.scoreSystem.pickInRange(S.safe);
    return 0;
  }

  /** BOMB reaching a still-standing building's roof line (§5.1: "bombs can
   * be baited onto buildings to collapse them"). Damages whatever cell it
   * lands on; a building already open at the top just lets it fall through
   * to GONE-on-GONE, a harmless no-op. */
  hitBuilding(building, game) {
    const idx = building.cellIndexAt(this.x, building.top + 1);
    if (idx) {
      building.damageCell(idx.col, idx.row, CONFIG.buildings.cellHp, null, 'bombHit', game);
    }
    this.explode(game, null);
  }

  /** DYNAMITE / BOMB area detonation against monsters. A direct hit always
   * counts even outside the blast radius; otherwise anyone within it takes
   * the hit too. */
  explode(game, directHit) {
    SFX.play('explosion');   // 09-art-audio §10
    const P = this.kind === 'DYNAMITE' ? CONFIG.enemies.projectiles.dynamite : CONFIG.enemies.projectiles.bomb;
    const source = this.kind === 'DYNAMITE' ? 'dynamiteThrown' : 'bomb';
    const monsters = game.entities.ofType(Monster);
    for (let i = 0; i < monsters.length; i++) {
      const m = monsters[i];
      if (m.defeated) continue;
      if (m === directHit || Math.hypot(m.x - this.x, m.y - this.y) <= P.blastRadius) {
        m.applyDamage(CONFIG.health.damage[source], source);
      }
    }
    this.alive = false;
  }

  /** Street Guardsman's planted charge (§3.2/§5.1). Clears the whole bottom
   * row outright the instant the fuse ends — see the CONFIG comment for why
   * that route was chosen over a partial-damage one. `byMonster` is null the
   * entire way, which is what keeps this collapse unattributed. */
  updateCharge(dt, game) {
    if (!this.building.standing) { this.alive = false; return; }   // punched down first
    this.fuseTimer -= dt;
    if (this.fuseTimer > 0) return;
    SFX.play('explosion');   // 09-art-audio §10
    const C = CONFIG.enemies.demolitionCharge;
    const row = this.building.rows - 1;
    for (let c = 0; c < this.building.cols; c++) {
      this.building.damageCell(c, row, C.cellDamage, null, 'demolitionCharge', game);
    }
    this.alive = false;
  }

  /* ---- 09-art-audio §10 — one shape per munition, in place of the flat
     rect every kind drew through Session 7. [INFERRED shapes — #50.] ----- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const cx = Math.round(this.renderX(alpha));
    const cy = Math.round(this.renderY(alpha));
    const P = CONFIG.enemies.projectiles;
    const warn = this.fuseTimer > 0 && this.fuseTimer < 0.4 && Math.floor(this.fuseTimer * 10) % 2 === 0;

    if (this.kind === 'DROPPED_OBJECT') {
      // Reuses the Pickup icon it was knocked loose from — same identity in
      // flight as it had sitting in the window.
      drawPickupIcon(ctx, { id: this.weaponId, category: 'weapon', color: this.color },
        cx, cy, Math.max(this.w, this.h), 0);
      return;
    }

    if (this.kind === 'LIGHTNING_BOLT') {
      ctx.strokeStyle = warn ? '#ffffff' : P.bolt.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - this.h / 2);
      ctx.lineTo(cx - this.w / 2, cy);
      ctx.lineTo(cx + this.w / 4, cy);
      ctx.lineTo(cx - this.w / 4, cy + this.h / 2);
      ctx.stroke();
      return;
    }

    const color = this.kind === 'BULLET' ? P.bullet.color
      : this.kind === 'DYNAMITE' ? P.dynamite.color
      : this.kind === 'BOMB' ? P.bomb.color
      : this.kind === 'SHELL' ? P.shell.color
      : CONFIG.enemies.demolitionCharge.color;
    ctx.fillStyle = warn ? '#ffffff' : color;

    if (this.kind === 'BOMB') {
      // Teardrop — a rounded body with a small tail fin.
      ctx.beginPath();
      ctx.arc(cx, cy - this.h * 0.15, this.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(cx - 1, cy + this.h * 0.2, 2, this.h * 0.3);
    } else if (this.kind === 'SHELL') {
      // A stretched diamond reads as "moving fast" better than a rectangle.
      ctx.beginPath();
      ctx.moveTo(cx - this.w / 2, cy);
      ctx.lineTo(cx, cy - this.h / 2);
      ctx.lineTo(cx + this.w / 2, cy);
      ctx.lineTo(cx, cy + this.h / 2);
      ctx.closePath();
      ctx.fill();
    } else if (this.kind === 'DYNAMITE') {
      ctx.fillRect(cx - this.w / 2, cy - this.h / 2, this.w, this.h);
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(cx - 1, cy - this.h / 2 - 3, 2, 3);   // fuse stub
    } else {
      // BULLET, CHARGE — the plain rect every kind started as.
      ctx.fillRect(cx - this.w / 2, cy - this.h / 2, this.w, this.h);
    }
  }
}


/* ==========================================================================
   01-monsters — Monster
   02-movement-destruction §3.1 — movement & traversal

   ONE class for all three monsters (01-monsters.md §2.1). `monsterType` picks
   art, punch-animation flavour and designated-victim id — nothing else. Every
   number below comes from CONFIG.monster, which has no per-type variants.

   Stances (§3.1): GROUND (street), AIR (jumping/falling), CLING (attached to
   a building face) and ROOF (standing on a building top). One state machine —
   `update` dispatches to exactly one per-stance handler per tick, and every
   handler is responsible for leaving the monster at a legal position.

   The transition graph, and why none of it can strand the monster:

     GROUND --up (in front of a face)--> CLING      same y (groundY) on both sides
     GROUND --jump-------------------->  AIR
     CLING  --down at the street------>  GROUND     same y (groundY) on both sides
     CLING  --up at the roof line----->  ROOF       same y (building.top) on both
     CLING  --jump-------------------->  AIR        + short re-grab lockout
     ROOF   --down-------------------->  CLING      same y (building.top)
     ROOF   --walk past the edge------>  AIR
     ROOF   --jump-------------------->  AIR
     AIR    --up + face overlap------->  CLING      (jump-to-grab)
     AIR    --falling across a roof--->  ROOF       swept test, no tunnelling
     AIR    --reach the street-------->  GROUND

   Every paired transition happens at an identical y on both sides, so no
   transition ever moves the monster — nothing to clip through and nothing to
   pop out of. The "same y" pairs are also why each one needs a directional
   guard (vdir) to stop the two states flip-flopping on the boundary; see the
   comments in updateCling / updateRoof.
   ========================================================================== */
/* DEFEATED (03-eating-health §4.1) isn't part of the traversal graph above —
   nothing transitions out of it. Energy hitting zero forces it from any of
   the other four stances (see Monster.beginDefeat), and it only ever ends in
   despawn (walked fully offscreen). Session 9's continue flow is what will
   eventually give it an exit. */
const Stance = { GROUND: 'GROUND', AIR: 'AIR', CLING: 'CLING', ROOF: 'ROOF', DEFEATED: 'DEFEATED' };

class Monster extends Entity {
  constructor(monsterTypeId, playerIndex, x) {
    super(x, CONFIG.world.groundY, CONFIG.monster.width, CONFIG.monster.height);
    this.monsterTypeId = monsterTypeId;
    this.type = CONFIG.monsterTypes[monsterTypeId];
    this.playerIndex = playerIndex;

    this.facing = 1;                 // 1 = right, -1 = left
    this.stance = Stance.GROUND;
    this.punchTimer = 0;             // counts down through the punch animation
    this.punchCooldown = 0;
    this.punchHasHit = false;        // one connection per punch, at full reach
    this.walkPhase = 0;              // 0..1 through the walk cycle
    this.climbPhase = 0;             // 0..1 through the climb cycle
    this.animState = 'idle';

    // Traversal (§3.1). `attached` is the Building this monster is on or
    // clinging to; null in GROUND and AIR. grabIgnore/grabLockTimer stop a
    // jump off a face from instantly re-grabbing that same face.
    this.attached = null;
    this.grabIgnore = null;
    this.grabLockTimer = 0;

    /* 03-eating-health §4.1 — the energy bar. `defeated` latches true the
       moment it hits zero so beginDefeat() (and therefore the revert/walk-off)
       can only ever fire once; see applyDamage. */
    this.energy = CONFIG.health.maxEnergy;
    this.lastDamageSource = null;
    this.lastHealSource = null;
    this.defeated = false;
    this.walkOffDir = 0;      // set once, in beginDefeat()

    /* 01-monsters §2.3 — the Human this monster currently has grabbed and
       is holding, or null. This is also Session 6's hook: "while a monster
       holds its designated victim, only the National Guardsmen stop
       firing" — see isHoldingVictim. */
    this.holding = null;

    /* 04-military-hazards §5.1 — new in Session 7. Counts down after
       knockOff/applyKnockback (see launchAir); while positive, updateAir
       leaves the forced knockback vx alone instead of recomputing it from
       input every tick. */
    this.knockbackTimer = 0;

    /* 09-art-audio §10 — new in Session 11, art-only. `eatTimer` drives the
       mouth-open overlay after a connecting eat/grab/cannibalize (see
       resolvePunch); `hitReactTimer` drives the damage flash/flinch after
       applyDamage. Neither affects movement or timing — both are read only
       by draw(). */
    this.eatTimer = 0;
    this.hitReactTimer = 0;

    // 09-art-audio §10 — "monster roars" [INFERRED trigger — 13-inferred-
    // items.md #51]: read as a roar on spawn/continue, characterful rather
    // than a documented arcade moment.
    SFX.play('roar');
  }

  /** 0..1, for the debug bar and (Session 8) the real HUD. */
  get energyFraction() {
    return CONFIG.health.maxEnergy > 0 ? this.energy / CONFIG.health.maxEnergy : 0;
  }

  /**
   * §2.3 — "while a monster holds its designated victim, only the National
   * Guardsmen stop firing." Read by `Guardsman.tryFire` (04-military-hazards
   * §5.1) against whichever specific monster it's about to fire at.
   * [INFERRED — 13-inferred-items.md #7: single-source claim; Session 6
   * scoped it per-target rather than as a global "nobody fires" switch.]
   */
  get isHoldingVictim() { return !!this.holding; }

  get isPunching() { return this.punchTimer > 0; }

  /** 0..1 through the punch animation, 0 when not punching. */
  get punchProgress() {
    if (!this.isPunching) return 0;
    return 1 - (this.punchTimer / CONFIG.monster.punchDuration);
  }

  /** How far the fist is extended, 0..1. Out fast, back slower. */
  get punchExtension() {
    if (!this.isPunching) return 0;
    const p = this.punchProgress;
    const e = CONFIG.monster.punchExtendFraction;
    return p < e ? (p / e) : (1 - (p - e) / (1 - e));
  }

  /**
   * The area a punch covers. Session 1 computes it and draws it in debug —
   * it hits nothing yet. Buildings (Session 3), humans (Session 5), enemies
   * (Session 6) and other monsters (Session 10) all test against this box.
   */
  getPunchBox() {
    if (!this.isPunching) return null;
    const M = CONFIG.monster;
    const reach = M.punchReach * this.punchExtension;
    return {
      x: this.facing > 0 ? this.right : this.left - reach,
      y: this.top + M.punchBoxOffsetY,
      w: reach,
      h: M.punchBoxHeight,
    };
  }

  /**
   * 02-movement-destruction §3.2 — the area a punch can rip a wall section
   * out of. Same vertical band as getPunchBox, but it starts at the monster's
   * own centre rather than at its leading edge.
   *
   * [INFERRED — 13-inferred-items.md #17] The GDD doesn't say which cell a
   * punch lands on. Reaching back to the centre is what makes the outermost
   * column of a building breakable from a face: a clinging monster is pinned
   * flush inside the frontage (Session 2), so at the right-hand edge a purely
   * forward reach would punch past the building entirely and the edge column
   * could never be destroyed by climbing. Facing still decides which way the
   * punch chews.
   */
  punchTargetRect() {
    const M = CONFIG.monster;
    const front = this.w / 2 + M.punchReach * this.punchExtension;
    return {
      x: this.facing > 0 ? this.x : this.x - front,
      y: this.top + M.punchBoxOffsetY,
      w: front,
      h: M.punchBoxHeight,
    };
  }

  /**
   * §3.2/§4.2/§4.3/§2.3 — land one punch on one wall section, or on whatever
   * is occupying it. Works from the street and from a face; from a roof the
   * band sits entirely above the roof line and hits nothing, which needs no
   * special case.
   *
   * A free-roaming (street) human standing in the punch's way is checked
   * FIRST, against the narrower `getPunchBox()` — the fist the art draws —
   * rather than the wall-reaching `punchTargetRect()`. [INFERRED — someone
   * standing between the monster and a building takes the hit meant for
   * them, not the wall behind them; 13-inferred-items.md #32.] This also
   * matters mechanically: the street's buildings and the gaps LevelData
   * computes between them leave no gap wider than a full punch's reach on a
   * typical board, so without this priority a street civilian would almost
   * never be reachable — the wider wall-reaching rect would always find some
   * building cell first.
   *
   * A free-roaming Enemy (a street Guardsman mid-run, or a helicopter dipped
   * low enough to reach) is checked next, same box, same reasoning — see
   * Game.enemyTargetFor. [INFERRED — new this session, 13-inferred-items.md
   * #34/#35.]
   *
   * Failing both of those, a human occupying the targeted building cell
   * takes priority over a window Guardsman, which takes priority over a
   * Pickup, which takes priority over wall damage — see interactWithHuman
   * for what a human does with the punch. If the targeted cell is open and
   * has an item sitting in it instead, the punch eats/grabs the item —
   * §4.3's "because punching is fast, a greedy player will sometimes grab
   * the wrong thing" only makes sense if punching an open cell is the eat
   * action.
   */
  resolvePunch(game) {
    const streetHuman = game.humanTargetFor(this);
    if (streetHuman) return this.interactWithHuman(streetHuman, game);

    /* 07-multiplayer §8.2 — a rival monster in the fist's way, checked in
       the same street-first band as everything else, immediately *after*
       humans rather than before them.
       [INFERRED — 13-inferred-items.md #8.] The order is load-bearing, and
       testing is what showed it: two monsters racing for the same civilian
       end up within a punch's reach of each other, which is exactly the
       moment §8.2's "whoever grabs it gets it" is supposed to be decided.
       Checking monsters first made the rival absorb every punch and left
       the contested food unreachable for both players — the competition
       mechanic cancelling itself out. Food first also costs the puncher
       nothing: it heals either way, and the rival is still there to hit on
       the next swing. */
    const rival = game.monsterTargetFor(this);
    if (rival) return this.interactWithMonster(rival, game);

    const streetEnemy = game.enemyTargetFor(this);
    if (streetEnemy) {
      const pts = streetEnemy.scorePoints;
      streetEnemy.consume(this);
      game.scoreSystem.award(this, pts, streetEnemy.kind);
      return 'destroyEnemy';
    }

    /* 06 §7.3 / §6 — a level feature in the punch's way: the train (scored
       "per hit", so it pays every time and takes several to wreck) or a
       boater on the river. Checked in the same street-first band as humans
       and enemies, and before the wall, for the same reason (#32). */
    const feature = game.featureTargetFor(this);
    if (feature) {
      const kind = feature instanceof Train ? 'train' : 'boater';
      game.scoreSystem.award(this, feature.punch(), kind);
      return kind;
    }

    const target = game.cellTargetFor(this.punchTargetRect(), this.facing);
    if (!target) return null;
    const human = target.building.humanAt(target.col, target.row);
    if (human) return this.interactWithHuman(human, game);
    const enemy = target.building.enemyAt(target.col, target.row);
    if (enemy) {
      const pts = enemy.scorePoints;
      enemy.consume(this);
      game.scoreSystem.award(this, pts, enemy.kind);
      return 'eatEnemy';
    }
    const pickup = target.building.pickupAt(target.col, target.row);
    if (pickup) { pickup.consume(this, game); return 'eat'; }
    // §6: 25 for a partial break, 225 for a full one; damageCell's return
    // value is exactly the break kind ScoreSystem needs, no translation.
    const breakKind = target.building.damageCell(
      target.col, target.row, CONFIG.monster.punchDamage, this, 'punch', game);
    if (breakKind === 'partial') game.scoreSystem.award(this, CONFIG.scoring.punchPartial, 'punchPartial');
    else if (breakKind === 'full') game.scoreSystem.award(this, CONFIG.scoring.punchFull, 'punchFull');
    return breakKind;
  }

  /**
   * 01-monsters §2.3 — a punch connected with a human. This monster's own
   * designated victim, while still grabbable and while this monster isn't
   * already holding someone, is grabbed and held instead of eaten outright;
   * anyone else — a plain civilian, or the *wrong* monster's designated
   * victim — is just eaten, same as a food Pickup. "Each monster can grab
   * only its own designated victim; the wrong victim is eaten ... instead
   * of held" (SESSION-PLAN Session 5).
   */
  interactWithHuman(human, game) {
    if (!human.alive || human.state === HumanState.HELD) return null;
    if (human.grabbable && !this.holding &&
        human.role === HumanRole.DESIGNATED_VICTIM &&
        human.typeId === this.type.designatedVictim) {
      this.grabHuman(human, game);
      return 'grab';
    }
    human.consume(this, game);
    return 'eat';
  }

  /* ---- 07-multiplayer §8.2 — monster vs. monster ----------------------
     Three documented interactions between two players' monsters, all of
     them resolved from one connecting punch:

       - a live rival takes **real damage** to its energy bar [FAITHFUL],
       - and **drops whatever it is holding** [INFERRED — see below],
       - a *defeated* rival's human form is **eaten** for points and health
         before it finishes walking off [FAITHFUL].

     Which of the two branches a punch takes is decided by nothing more
     than whether the target is already defeated, so there is no separate
     "cannibalize" input, stance or targeting rule to get out of sync with
     the punch that damages.                                                */

  /**
   * §8.2 — a punch connected with another player's monster.
   *
   * [INFERRED — 13-inferred-items.md #8] §8.2 says "punching a monster can
   * make it drop what it's holding / interrupt a grab" and flags it as
   * unconfirmed; the design doc's own instruction is to implement
   * drop-on-hit as the faithful-feeling default. The drop reuses
   * Human.struggleFree outright rather than inventing a second release
   * path, which means a punched-out victim behaves exactly like one that
   * ran out its own hold timer: it lands on the street, flees, and latches
   * `grabbable = false`, so it can only ever be eaten from then on — by
   * either player. Nothing is taken back from the holder's score; §6's
   * hold bonus is paid at the moment of the grab (#41) and a rival's punch
   * arriving afterwards can't retroactively unearn it.
   *
   * Also inferred, by omission: a monster punch deals damage only — no
   * knockback. §5.1 gives knockback to the tank/police shell specifically
   * and §8.2 asks only for "real damage", so borrowing the shell's shove
   * would be inventing a mechanic rather than implementing one.
   */
  interactWithMonster(other, game) {
    if (!other.alive) return null;

    if (other.defeated) {
      // §8.2 cannibalism. The human form despawns the moment it is eaten,
      // which also ends that player's continue window early — see
      // Game.updateContinueWindows. That consequence is the point of the
      // mechanic, not a side effect of it.
      other.alive = false;
      this.eatTimer = CONFIG.art.eatDuration;    // 09-art-audio §10 — art-only
      SFX.play('eat');
      this.heal(CONFIG.health.cannibalHeal, 'CANNIBALISM');
      game.scoreSystem.award(this, CONFIG.scoring.eatDefeatedMonster, 'eatDefeatedMonster');
      return 'cannibalize';
    }

    other.applyDamage(CONFIG.health.damage.monsterPunch, 'MONSTER_PUNCH');
    other.releaseHolding();          // §8.2's inferred drop-on-hit
    return 'monsterPunch';
  }

  /**
   * §8.2 — the box a cannibalism punch has to overlap: the human figure
   * Monster.drawHuman actually draws, not the monster-sized entity box it
   * inherited from before it was defeated. Without this a walk-off would
   * be a much fatter target than it looks.
   */
  humanFormRect() {
    const A = CONFIG.art;
    const w = this.w * A.humanFormWidthFrac;
    const h = this.h * A.humanFormHeightFrac;
    return { x: this.x - w / 2, y: this.y - h, w: w, h: h };
  }

  /**
   * §2.3 grab: pull it out of its window (if any) and start the hold timer.
   * §6's "hold your designated victim" bonus (4,000-6,000) is awarded here,
   * on a successful grab, rather than on release — the GDD doesn't say
   * which, and awarding at grab time means a monster punched off the
   * building (or defeated) mid-hold still keeps credit for having caught
   * its victim. [INFERRED — 13-inferred-items.md #41.]
   */
  grabHuman(human, game) {
    if (human.location === 'WINDOW' && human.building) {
      human.building.clearHumanCell(human.col, human.row);
    }
    human.holder = this;
    human.holdTimer = game.nextHoldTime();
    human.state = HumanState.HELD;
    this.holding = human;
    game.scoreSystem.award(this, game.scoreSystem.pickInRange(CONFIG.scoring.designatedVictimHold), 'designatedVictimHold');
    // 09-art-audio §10 — a triumphant roar on the catch [INFERRED trigger —
    // 13-inferred-items.md #51].
    SFX.play('roar');
  }

  /** Drop whatever this monster is currently holding — defeat and knock-off
   * both need to release a held victim rather than leave it stranded. */
  releaseHolding() {
    if (this.holding) this.holding.struggleFree();
  }

  /**
   * 03-eating-health §4.1 — the single funnel every damage source routes
   * through: falling, bad items, live electrical, dynamite, and (once their
   * own sessions wire them up) bullets, shells, lightning, underwater,
   * monster-vs-monster punches. Once `defeated` the monster is walking off
   * and inert — further hits are dropped rather than pushing energy negative.
   */
  applyDamage(amount, source) {
    if (this.defeated) return;
    this.energy = clamp(this.energy - amount, 0, CONFIG.health.maxEnergy);
    this.lastDamageSource = source;
    // 09-art-audio §10 — the hit-react flash/flinch (draw()), art-only.
    if (amount > 0) this.hitReactTimer = CONFIG.art.hitReactDuration;
    if (this.energy <= 0) this.beginDefeat();
  }

  /** 03-eating-health §4.2 — the food half of the same funnel. */
  heal(amount, source) {
    if (this.defeated) return;
    this.energy = clamp(this.energy + amount, 0, CONFIG.health.maxEnergy);
    this.lastHealSource = source;
  }

  /**
   * §4.1: "the bar empties, the monster reverts to its (naked) human form
   * and walks off the side of the screen." The `defeated` guard is what
   * makes this fire exactly once, however many damage calls land at or
   * below zero energy in the same tick or afterward.
   *
   * [INFERRED — 13-inferred-items.md #23] The GDD doesn't say what happens
   * to a monster defeated mid-air or mid-building. Phase 1's simplest
   * reading: snap straight to the street, then walk off — not a measured
   * fact. The continue flow itself is Session 9; here the state just exists
   * and runs to a clean despawn.
   */
  beginDefeat() {
    if (this.defeated) return;
    this.defeated = true;
    this.attached = null;
    this.stance = Stance.DEFEATED;
    this.vx = 0;
    this.vy = 0;
    this.y = CONFIG.world.groundY;
    this.punchTimer = 0;
    this.walkOffDir = this.x < CONFIG.view.width / 2 ? -1 : 1;
    this.releaseHolding();
  }

  /** §4.1 walk-off. No input is read at all — nothing can stop this short of
   * despawning once it's fully offscreen. */
  updateDefeated(dt) {
    const speed = CONFIG.health.walkOffSpeed;
    this.facing = this.walkOffDir;
    this.vx = this.walkOffDir * speed;
    this.x += this.vx * dt;
    this.animState = 'walk';
    this.walkPhase = (this.walkPhase + dt / CONFIG.monster.walkCycleTime) % 1;
    if (this.x < -this.w || this.x > CONFIG.view.width + this.w) this.alive = false;
  }

  /**
   * 03-eating-health §4.3 — the wall dynamite's blast, the photographer's
   * flash and the bather's splash all "knock the monster off the building"
   * the same way: pop it into AIR with an outward shove. Purely kinematic;
   * callers apply their own damage separately via applyDamage (see
   * Pickup.trigger). [INFERRED] speeds — 13-inferred-items.md #2.
   */
  /**
   * Shared by knockOff and applyKnockback (04-military-hazards §5.1) — new
   * in Session 7, though it now also carries the pre-existing dynamite/
   * photographer/bather pop. Detaches to AIR with a forced velocity and
   * arms `knockbackTimer` so updateAir doesn't overwrite `vx` from input on
   * the very next tick — without it, a shove's horizontal component never
   * actually moved the monster anywhere (13-inferred-items.md #37).
   */
  launchAir(vx, vy, duration) {
    this.detach(null, false);
    this.vx = vx;
    this.vy = vy;
    this.knockbackTimer = duration;
    this.releaseHolding();
  }

  knockOff() {
    if (this.defeated) return;
    const H = CONFIG.health;
    const b = this.attached;
    const outward = b ? (this.x < b.x ? -1 : 1) : this.facing;
    this.launchAir(outward * H.knockOffSpeedX, H.knockOffSpeedY, H.knockback.duration);
  }

  /**
   * 04-military-hazards §5.1 — a tank/police shell's "large knockback ...
   * can knock a monster off a building or across the screen." Same
   * detach-to-AIR shape as knockOff, but the push direction is away from
   * wherever the shell was fired from rather than away from the building —
   * a shell fired from the far side of a building should still be able to
   * blow the monster clear of it, not just off the near edge. [INFERRED —
   * no speed/arc is documented; 13-inferred-items.md #37.]
   */
  applyKnockback(fromX, speedX, speedY) {
    if (this.defeated) return;
    const dirX = this.x < fromX ? -1 : 1;
    this.launchAir(dirX * speedX, speedY, CONFIG.health.knockback.duration);
  }

  update(dt, game) {
    // §4.1 defeat: no input, no stance handlers, no punching — just the walk
    // off screen. Checked before anything else reads input.
    if (this.defeated) { this.updateDefeated(dt); return; }

    const M = CONFIG.monster;
    const input = game.input.getPlayer(this.playerIndex);

    /* --- punch timers ------------------------------------------------- */
    if (this.punchCooldown > 0) this.punchCooldown = Math.max(0, this.punchCooldown - dt);
    if (this.punchTimer > 0) {
      this.punchTimer -= dt;
      if (this.punchTimer <= 0) {
        this.punchTimer = 0;
        this.punchCooldown = M.punchCooldown;
      }
    }
    if (this.grabLockTimer > 0) {
      this.grabLockTimer = Math.max(0, this.grabLockTimer - dt);
      if (this.grabLockTimer === 0) this.grabIgnore = null;
    }
    // 09-art-audio §10 — art-only overlay timers, decremented alongside the
    // punch timers above.
    if (this.eatTimer > 0) this.eatTimer = Math.max(0, this.eatTimer - dt);
    if (this.hitReactTimer > 0) this.hitReactTimer = Math.max(0, this.hitReactTimer - dt);

    /* --- direction (§3: 8-way stick; punch goes the way you're holding,
           straight ahead if neutral) --------------------------------------- */
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const vdir = (input.down ? 1 : 0) - (input.up ? 1 : 0);   // +1 down, -1 up

    /* --- start a punch ------------------------------------------------- */
    if (input.punchPressed && !this.isPunching && this.punchCooldown <= 0) {
      if (dir !== 0) this.facing = dir;
      this.punchTimer = M.punchDuration;
      this.punchHasHit = false;
      SFX.play('punch');   // 09-art-audio §10 — every swing, connecting or not
    }

    /* [INFERRED] Punching roots the monster on any surface — street, face or
       roof; airborne momentum is kept. Session 1 set this rule for the ground
       and Session 2 extends it to cling/roof. 13-inferred-items.md #11.      */
    const rooted = this.isPunching && this.stance !== Stance.AIR;

    /* --- one handler per stance; each leaves a legal position ----------- */
    switch (this.stance) {
      case Stance.GROUND: this.updateGround(dt, game, input, dir, rooted); break;
      case Stance.AIR:    this.updateAir(dt, game, input, dir); break;
      case Stance.CLING:  this.updateCling(dt, game, input, dir, vdir, rooted); break;
      case Stance.ROOF:   this.updateRoof(dt, game, input, dir, rooted); break;
    }

    /* --- 06 §7.3 riverway: "going under drains health" ------------------
       Only from the street. A monster clinging to a face or on a roof can't
       be in the water (a riverway shortens the span buildings are laid out
       across — LevelData.spanFor), and one in mid-air over the river is over
       it, not in it. Standing on the bridge deck is dry: Game.inWaterAt
       excludes the bridge's span. This is the call site
       CONFIG.health.damage.underwaterPerSecond has been waiting for since
       Session 4. [INFERRED — 13-inferred-items.md #44: §7.3 confirms water
       drains health and says nothing about the rate or the stance rule.] */
    if (this.stance === Stance.GROUND && game.inWaterAt(this.x)) {
      this.applyDamage(CONFIG.health.damage.underwaterPerSecond * dt, 'UNDERWATER');
    }

    /* --- §3.2 the fist connects ----------------------------------------
       Resolved after the stance handler so the punch lands from the position
       the monster actually ends the tick at. Contact is the moment the fist is
       fully out (punchExtendFraction), and punchHasHit makes it exactly once
       per punch however many ticks the animation spans.                    */
    if (this.isPunching && !this.punchHasHit &&
        this.punchProgress >= M.punchExtendFraction) {
      this.punchHasHit = true;
      this.resolvePunch(game);
    }

    /* --- animation ------------------------------------------------------ */
    if (this.stance === Stance.AIR) this.animState = 'jump';
    else if (this.isPunching) this.animState = 'punch';
    else if (this.stance === Stance.CLING) this.animState = 'climb';
    else if (this.vx !== 0) this.animState = 'walk';
    else this.animState = 'idle';

    if (this.animState === 'walk') {
      this.walkPhase = (this.walkPhase + dt / M.walkCycleTime) % 1;
    } else if (this.animState !== 'jump') {
      this.walkPhase = 0;
    }
    if (this.stance === Stance.CLING && (this.vx !== 0 || this.vy !== 0)) {
      this.climbPhase = (this.climbPhase + dt / M.climbCycleTime) % 1;
    }
  }

  /** Keep the monster inside the playfield. Buildings never block the street. */
  clampToStreet() {
    const W = CONFIG.world;
    this.x = clamp(this.x, W.leftBound + this.w / 2, W.rightBound - this.w / 2);
  }

  /** Leave the current surface for a jump/fall. */
  detach(building, lockout) {
    this.stance = Stance.AIR;
    this.attached = null;
    if (lockout) {
      this.grabIgnore = building;
      this.grabLockTimer = CONFIG.monster.grabLockout;
    }
  }

  /**
   * Attach to a building face (§3.1 "the monster clings to the wall").
   * Pins the body flush inside the frontage and between the roof line and the
   * street, so a cling position is always legal however it was entered.
   */
  attachToFace(building, feetY) {
    this.attached = building;
    this.stance = Stance.CLING;
    this.vx = 0;
    this.vy = 0;
    this.x = clamp(this.x, building.left + this.w / 2, building.right - this.w / 2);
    this.y = clamp(feetY, building.top, CONFIG.world.groundY);
    this.grabIgnore = null;
    this.grabLockTimer = 0;
  }

  /* ---- GROUND: walk the street, jump, or start a climb ----------------- */
  updateGround(dt, game, input, dir, rooted) {
    const M = CONFIG.monster;
    this.y = CONFIG.world.groundY;
    this.vy = 0;

    if (dir !== 0 && !rooted) this.facing = dir;
    this.vx = rooted ? 0 : dir * M.walkSpeed;
    this.x += this.vx * dt;
    this.clampToStreet();

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.detach(null, false);
      return;
    }

    // §3.1: "when adjacent to a building face, up/down climbs it".
    if (input.up && !this.isPunching) {
      const target = game.faceTargetFor(this);
      if (target) this.attachToFace(target, CONFIG.world.groundY);
    }
  }

  /* ---- AIR: ballistic, with jump-to-grab and roof landing --------------
     Air control is normally recomputed from input every tick (no momentum
     carries from the surface just left — see 13-inferred-items.md #12), but
     that would zero out a knockback's horizontal component on the very next
     tick, before it ever moved the monster anywhere. `knockbackTimer` (set by
     Monster.launchAir — new in Session 7) suppresses input-driven vx for a
     short window so a shove actually carries the monster somewhere instead
     of evaporating instantly; see 13-inferred-items.md #37. */
  updateAir(dt, game, input, dir) {
    const M = CONFIG.monster;
    const W = CONFIG.world;

    if (this.knockbackTimer > 0) {
      this.knockbackTimer = Math.max(0, this.knockbackTimer - dt);
    } else {
      if (dir !== 0) this.facing = dir;
      this.vx = dir * M.walkSpeed * M.airControl;
    }
    this.vy += M.gravity * dt;

    const prevFeet = this.y;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.clampToStreet();

    /* §3.1 jump-to-grab: "Jump toward a building and hold up to grab it."
       Checked before the landing test so holding up near a roof edge grabs
       the face rather than sliding past it.                                 */
    if (input.up) {
      const target = game.faceTargetFor(this, this.grabIgnore);
      if (target) { this.attachToFace(target, this.y); return; }
    }

    /* Roof landing. Swept (prev→now crossed the roof line) so a fast fall
       can never tunnel through a roof, and only while descending so a jump
       from a roof passes back up through its own roof line cleanly.

       A monster on the street can't land on a roof by jumping: every building
       is taller than the jump apex (see CONFIG.buildings), so the feet never
       get above a roof line to begin with. That's what keeps the street a
       lane in front of the buildings instead of a set of ramps.             */
    if (this.vy > 0) {
      const roof = game.roofLandingAt(this.x, prevFeet, this.y);
      if (roof) {
        this.y = roof.top;
        this.vy = 0;
        this.stance = Stance.ROOF;
        this.attached = roof;

        /* §3.2 roof-drop collapse: "weaken a building, then jump onto its
           roof — the monster's weight finishes it off and it collapses."
           Only a *landing* does it, so walking onto a roof off a face is
           safe; and it leaves the monster standing on a shaking building,
           which is the intended skill check — jump again or eat the fall.
           [INFERRED] threshold — CONFIG.buildings.roofDropStructureFraction. */
        if (roof.structureFraction <= CONFIG.buildings.roofDropStructureFraction) {
          roof.beginShaking(this, 'roofDrop');
        }
        return;
      }
    }

    if (this.y >= W.groundY) {
      this.y = W.groundY;
      this.vy = 0;
      this.stance = Stance.GROUND;
      this.attached = null;
    }
  }

  /* ---- CLING: on a building face -------------------------------------- */
  updateCling(dt, game, input, dir, vdir, rooted) {
    const M = CONFIG.monster;
    const W = CONFIG.world;
    const b = this.attached;

    // A building that has come down drops whoever was on it. Building.collapse
    // already detaches and applies fall damage (§3.3); this is the safety net
    // for any other path that could turn a building to rubble mid-tick.
    if (!b || !b.standing) { this.detach(null, false); return; }

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.vx = dir * M.walkSpeed * M.airControl;
      this.detach(b, true);
      return;
    }

    if (rooted) {
      this.vx = 0;
      this.vy = 0;
    } else {
      if (dir !== 0) this.facing = dir;
      this.vx = dir * M.climbSideSpeed;
      this.vy = vdir * M.climbSpeed;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }

    // Pinned to the frontage: you can traverse the face sideways but never
    // slide off its edge into thin air.
    this.x = clamp(this.x, b.left + this.w / 2, b.right - this.w / 2);
    this.clampToStreet();

    /* Roof line. Same y as ROOF, so the guard is what separates them: only an
       explicit "up" pulls you over the parapet. Coming the other way (ROOF +
       down) hands over at this exact y with down held, so vdir > 0 and this
       branch declines to hand it straight back. */
    if (this.y <= b.top) {
      this.y = b.top;
      this.vy = 0;
      if (vdir <= 0) { this.stance = Stance.ROOF; return; }
    }

    /* Street line. Mirror image: the same y as GROUND, and anything other
       than actively climbing up drops you onto the street — so a stray tap of
       up while walking past a building can't leave you stuck to its base. */
    if (this.y >= W.groundY) {
      this.y = W.groundY;
      this.vy = 0;
      if (vdir >= 0) {
        this.stance = Stance.GROUND;
        this.attached = null;
      }
    }
  }

  /* ---- ROOF: walking the top of a building (§3.1) ---------------------- */
  updateRoof(dt, game, input, dir, rooted) {
    const M = CONFIG.monster;
    const b = this.attached;

    if (!b || !b.standing) { this.detach(null, false); return; }

    this.y = b.top;
    this.vy = 0;

    if (dir !== 0 && !rooted) this.facing = dir;
    this.vx = rooted ? 0 : dir * M.walkSpeed;
    this.x += this.vx * dt;
    this.clampToStreet();

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.detach(null, false);
      return;
    }

    /* Down at the roof line starts the climb back down the face, at the same
       y — the CLING handler's vdir > 0 keeps it from bouncing straight back.
       Goes through attachToFace because a roof lets the centre reach the very
       edge, which is half a body further out than a face allows; without the
       re-clamp the monster would hang off the side of the wall for a tick. */
    if (input.down && !this.isPunching) {
      this.attachToFace(b, this.y);
      return;
    }

    // Walked off the edge. The centre leaving the frontage is the trigger, so
    // the monster can stand half over the edge before it steps off.
    if (this.x < b.left || this.x > b.right) this.detach(null, false);
  }

  /* ---- 09-art-audio §10 — the Session 11 sprite/animation pass ---------
     Still 100% procedural canvas (no image assets, per the session brief),
     but now a real rig rather than a bare rectangle: idle/walk/climb/jump/
     punch (the animState machine Session 1-10 already drove), plus four
     more states this session adds — grab/hold (an arm reaching toward the
     victim it's holding), eat (a brief open-mouth overlay after a
     connecting eat/grab/cannibalize), hit-react (a flash + jolt after
     applyDamage), and revert-to-human (drawHuman, below). George and Ralph
     share one rig with a head/palette swap (`type.rig === 'SHARED'`,
     `type.earStyle` picks the swap); Lizzie draws her own distinct
     silhouette (`'LIZARD'` — snout, back spikes, a swaying tail) per
     §2.1's "George and Ralph share a body rig ... Lizzie is the distinct
     one" [FAITHFUL]. Every silhouette/timing choice is otherwise
     [INFERRED — 13-inferred-items.md #50/#51]: no source describes the
     arcade's actual sprites beyond that one reuse fact.                   */
  draw(ctx, alpha) {
    if (this.defeated) { this.drawHuman(ctx, alpha); return; }

    const A = CONFIG.art;
    const rig = this.type.rig;
    let cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    const w = this.w, h = this.h;

    // Hit-react: a brief flash + a small jolt opposite the facing direction,
    // so a connecting hit reads even without a glance at the energy bar.
    const flashing = this.hitReactTimer > 0 &&
      Math.floor(this.hitReactTimer * 40) % 2 === 0;
    if (this.hitReactTimer > 0) cx -= this.facing * A.hitReactShiftPx;
    const bodyColor = flashing ? A.hitReactFlashColor : this.type.bodyColor;
    const headColor = flashing ? A.hitReactFlashColor : this.type.headColor;
    const left = cx - w / 2;

    const legH = Math.round(h * A.legHeightFrac);
    const legW = Math.round(w * A.legWidthFrac);
    const headH = Math.round(h * A.headHeightFrac);
    const headW = Math.round(w * A.headWidthFrac);
    const bodyTop = feet - h + headH;
    const bodyH = h - headH - legH;

    // Ground shadow, only while on the street.
    if (this.stance === Stance.GROUND) {
      ctx.fillStyle = A.shadowColor;
      ctx.fillRect(left, feet - A.shadowHeight / 2, w, A.shadowHeight);
    }

    // Tail (Lizzie only) — drawn first, behind everything, swaying opposite
    // the walk cycle so it reads as counterbalancing the stride.
    if (rig === 'LIZARD') this.drawTail(ctx, left, feet, w, headColor);

    // Legs — swing while walking, tuck while airborne, alternate while climbing.
    let legOffsetA = 0, legOffsetB = 0, legLift = 0;
    if (this.animState === 'walk') {
      const swing = Math.sin(this.walkPhase * Math.PI * 2) * A.legSwingPx;
      legOffsetA = swing;
      legOffsetB = -swing;
    } else if (this.animState === 'jump') {
      legLift = A.legTuckPx;
    } else if (this.animState === 'climb') {
      legLift = Math.abs(Math.sin(this.climbPhase * Math.PI * 2)) * A.legTuckPx;
    }
    ctx.fillStyle = this.type.trimColor;
    ctx.fillRect(left + 1 + legOffsetA, feet - legH - legLift, legW, legH);
    ctx.fillRect(left + w - 1 - legW + legOffsetB, feet - legH - legLift, legW, legH);

    // Body.
    ctx.fillStyle = bodyColor;
    ctx.fillRect(left, bodyTop, w, bodyH);

    // Back spikes (Lizzie only), along the spine.
    if (rig === 'LIZARD') this.drawSpikes(ctx, left, bodyTop, w, headColor);
