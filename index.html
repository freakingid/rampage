    // One arm pose at a time, in priority order: punching beats climbing
    // beats holding — the same "rooted" priority Monster.update already
    // gives a punch over every other action.
    const armH = Math.max(2, Math.round(h * A.armThicknessFrac));
    const armY = feet - h + CONFIG.monster.punchBoxOffsetY;
    if (this.isPunching) {
      // Punching arm — reaches out in the facing direction.
      const reach = CONFIG.monster.punchReach * this.punchExtension;
      const armX = this.facing > 0 ? cx + w / 2 : cx - w / 2 - reach;
      ctx.fillStyle = headColor;
      ctx.fillRect(armX, armY, reach, armH);
    } else if (this.stance === Stance.CLING) {
      // Climbing grip — both arms out on the wall, offset out of phase so
      // the cling reads as a climb and not as a monster stuck to a poster.
      const reach = Math.round(CONFIG.monster.punchReach * 0.45);
      const grip = Math.sin(this.climbPhase * Math.PI * 2) * A.legSwingPx;
      ctx.fillStyle = headColor;
      ctx.fillRect(left - reach, armY + grip, reach, armH);
      ctx.fillRect(left + w, armY - grip, reach, armH);
    } else if (this.holding) {
      // §2.3 grab/hold — one arm reaching toward the victim it's carrying
      // (Human.updateHeld positions the victim itself at this same offset).
      const H = CONFIG.humans;
      const holdArmH = Math.max(2, Math.round(h * A.holdArmThicknessFrac));
      const armX = this.facing > 0 ? cx + w / 2 - 2 : cx - w / 2 - H.holdOffsetX + 2;
      ctx.fillStyle = headColor;
      ctx.fillRect(armX, armY + 3, H.holdOffsetX, holdArmH);
    }

    // Head — rig-specific silhouette.
    if (rig === 'LIZARD') this.drawLizardHead(ctx, cx, feet, h, headW, headH, headColor);
    else this.drawSharedHead(ctx, cx, feet, h, headW, headH, headColor);

    // Eyes — Lizzie gets slit pupils instead of square ones.
    ctx.fillStyle = A.outlineColor;
    const eyeY = feet - h + Math.round(headH / 2) - A.eyeSize / 2;
    const eyeX = this.facing > 0
      ? cx - headW / 2 + headW - A.eyeInset - A.eyeSize * 2 - 1
      : cx - headW / 2 + A.eyeInset;
    if (rig === 'LIZARD') {
      ctx.fillRect(eyeX + A.eyeSize / 2, eyeY - 1, 1, A.eyeSize + 2);
      ctx.fillRect(eyeX + A.eyeSize * 1.5 + 1, eyeY - 1, 1, A.eyeSize + 2);
    } else {
      ctx.fillRect(eyeX, eyeY, A.eyeSize, A.eyeSize);
      ctx.fillRect(eyeX + A.eyeSize + 1, eyeY, A.eyeSize, A.eyeSize);
    }

    // Eat overlay — an open mouth for a beat after a connecting eat/grab/
    // cannibalize (Monster.resolvePunch/interactWithHuman/Human.consume/
    // Pickup.consume all set eatTimer; see those for the exact triggers).
    if (this.eatTimer > 0) {
      const mouthW = Math.max(3, Math.round(headW * 0.4));
      const mouthH = Math.max(2, Math.round(headH * 0.3));
      ctx.fillStyle = A.outlineColor;
      ctx.fillRect(cx - mouthW / 2, feet - h + headH - mouthH - 1, mouthW, mouthH);
    }

    // Initial, so the three types are identifiable at a glance.
    ctx.fillStyle = A.outlineColor;
    ctx.font = CONFIG.ui.smallFontSize + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type.initial, cx, bodyTop + bodyH / 2);
  }

  /** George/Ralph's shared body rig, head half of the head/palette swap
   * (§2.1) — `type.earStyle` is the only thing that differs between them. */
  drawSharedHead(ctx, cx, feet, h, headW, headH, headColor) {
    const A = CONFIG.art, type = this.type;
    const headTop = feet - h;
    ctx.fillStyle = headColor;
    ctx.fillRect(cx - headW / 2, headTop, headW, headH);

    if (type.earStyle === 'POINTED') {
      // Ralph — wolf ears (pointed) + a small forward snout.
      ctx.fillStyle = type.trimColor;
      fillTriangle(ctx, cx - headW / 2 + A.earSize / 2, headTop + 1, A.earSize, A.earSize, 'up');
      fillTriangle(ctx, cx + headW / 2 - A.earSize / 2, headTop + 1, A.earSize, A.earSize, 'up');
      const snoutW = Math.max(3, Math.round(headW * A.snoutWidthFrac));
      const snoutH = Math.max(2, Math.round(headH * A.snoutHeightFrac));
      const snoutX = this.facing > 0 ? cx + headW / 2 - 2 : cx - headW / 2 - snoutW + 2;
      ctx.fillStyle = headColor;
      ctx.fillRect(snoutX, feet - h + headH - snoutH, snoutW, snoutH);
    } else {
      // George — rounded ape ears + a brow ridge.
      ctx.fillStyle = type.trimColor;
      const earR = A.earSize / 2;
      ctx.beginPath(); ctx.arc(cx - headW / 2, headTop + earR, earR, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + headW / 2, headTop + earR, earR, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(cx - headW / 2, headTop, headW, A.browHeight);
    }
  }

  /** Lizzie's own silhouette — an elongated, forward-projecting jaw instead
   * of a flat head-front. */
  drawLizardHead(ctx, cx, feet, h, headW, headH, headColor) {
    const A = CONFIG.art;
    const headTop = feet - h;
    ctx.fillStyle = headColor;
    ctx.fillRect(cx - headW / 2, headTop, headW, headH);
    const snoutLen = Math.round(headW * A.lizardSnoutLengthFrac);
    const snoutY = headTop + Math.round(headH * 0.3);
    const snoutH = Math.round(headH * 0.55);
    const snoutX = this.facing > 0 ? cx + headW / 2 : cx - headW / 2 - snoutLen;
    ctx.fillRect(snoutX, snoutY, snoutLen, snoutH);
  }

  /** Three small triangles along the spine — Lizzie only. */
  drawSpikes(ctx, left, bodyTop, w, color) {
    const A = CONFIG.art;
    ctx.fillStyle = color;
    for (let i = 0; i < A.lizardSpikeCount; i++) {
      const t = (i + 0.5) / A.lizardSpikeCount;
      fillTriangle(ctx, left + w * t, bodyTop + 2, 5, A.lizardSpikeHeight, 'up');
    }
  }

  /** A tail extending opposite the facing direction, swaying opposite the
   * walk cycle (counterbalancing the stride) — Lizzie only. */
  drawTail(ctx, left, feet, w, color) {
    const A = CONFIG.art;
    const len = Math.round(w * A.lizardTailLengthFrac);
    const sway = this.animState === 'walk'
      ? Math.sin(this.walkPhase * Math.PI * 2 + Math.PI) * A.lizardTailSwayPx
      : 0;
    const baseX = this.facing > 0 ? left : left + w;
    const tipX = baseX + (this.facing > 0 ? -len : len) + sway;
    const baseY = feet - 3;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(baseX, baseY - 5);
    ctx.lineTo(baseX, baseY + 2);
    ctx.lineTo(tipX, baseY - 4);
    ctx.closePath();
    ctx.fill();
  }

  /**
   * §4.1 "reverts to its (naked) human form and walks off the side of the
   * screen." A smaller, plain figure — with the same walk-cycle convention
   * the monster itself uses, at a smaller scale, so the walk-off reads as
   * an actual walk rather than a slide. Session 10's humanFormRect (the
   * punch target for cannibalism) is unaffected — legs/body still fill
   * exactly the same w×h box this always drew.
   */
  drawHuman(ctx, alpha) {
    const A = CONFIG.art;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    const w = Math.round(this.w * A.humanFormWidthFrac);
    const h = Math.round(this.h * A.humanFormHeightFrac);
    const headH = Math.round(h * 0.35);
    const legH = Math.round(h * 0.3);
    const bodyH = h - headH - legH;
    const legW = Math.max(1, Math.round(w * 0.22));

    ctx.fillStyle = A.shadowColor;
    ctx.fillRect(cx - w / 2, feet - A.shadowHeight / 2, w, A.shadowHeight);

    const swing = Math.sin(this.walkPhase * Math.PI * 2) * (A.legSwingPx * 0.4);
    ctx.fillStyle = A.outlineColor;
    ctx.fillRect(cx - w / 2 + swing, feet - legH, legW, legH);
    ctx.fillRect(cx + w / 2 - legW - swing, feet - legH, legW, legH);

    ctx.fillStyle = A.humanColor;
    ctx.fillRect(cx - w / 2, feet - h + headH, w, bodyH);
    ctx.fillRect(cx - Math.round(w * 0.35), feet - h, Math.round(w * 0.7), headH);
  }
}


/* ==========================================================================
   05-scoring §6 — ScoreSystem

   "Points come from destruction, eating, and grabbing valuables." One
   funnel every point award routes through — `award()` — mirroring the shape
   Monster.applyDamage/heal already established for the health bar: nothing
   else ever touches `player.score` directly.

   CONFIG.scoring is the source of truth for every value; this class only
   decides *when* a row fires and, for the table's two ranged rows, *which*
   value inside the range (`pickInRange`, via Game.nextScoreFrac — no RNG,
   same convention as every other random-ish choice in this file).

   Collapse attribution (§6's headline rule — "the 2,500 building bonus is
   only credited to the monster that actually caused the collapse") isn't
   decided here at all: Building.collapse already refuses to set `causedBy`
   for a third-party collapse (Session 6's demolition charges/bombs), so
   ScoreSystem.award simply never gets called for those — see
   Building.collapse below.
   ========================================================================== */
class ScoreSystem {
  constructor(game) {
    this.game = game;
  }

  /** Every point award in the game passes through here. No-ops harmlessly if
   * `monster` or `points` is falsy, so call sites never need their own guard
   * (a null `causedBy`, an unpicked-up weapon's expired flight, etc.). */
  award(monster, points, source) {
    if (!monster) return;
    this.awardPlayer(this.game.players[monster.playerIndex], points, source);
  }

  /** The same funnel keyed on the player record rather than a live monster —
   * §7.2's mega-vitamin milestone pays a player who is still in the run but
   * whose monster has already walked off screen, so it has no entity to
   * award through. Everything else goes via `award`. */
  awardPlayer(player, points, source) {
    if (!player || !points) return;
    player.score += points;
    player.lastScoreEvent = { points: points, source: source, simTime: this.game.simTime };
  }

  /** §6 rows given as a range (`designatedVictimHold`, `safe`) rather than a
   * single number — picked deterministically via Game.nextScoreFrac.
   * [INFERRED — 13-inferred-items.md #41.] */
  pickInRange(range) {
    const frac = this.game.nextScoreFrac();
    return Math.round(range.min + (range.max - range.min) * frac);
  }
}


/* ==========================================================================
   06-levels-progression §7 — LevelData

   "Each day = one city screen with a fixed number of buildings to level
   (2-6)." This is the resolver, not the content: every city, building count,
   feature and enemy set lives in CONFIG.levels.days, and all this does is
   turn a day *index* into a playable day definition.

   The index is absolute across the whole run: 0-based, 0 .. (128×6 − 1), and
   Game.advanceDay wraps it back to 0 at the end of the sixth pass (§7.2's
   "768 days, then resets to day 1"). Within that:
       dayNumber  1..128 — the day's slot in the current pass, and the key
                  a CONFIG.levels.days row is matched on.
       pass       0..5 — how many complete 128-day passes have gone by. Feeds
                  Game.difficultyScalar, which is what makes "later passes
                  escalate (more lightning/police)" true.

   The zero-code-change rule (SESSION-PLAN Session 9) is the reason nothing
   here is a switch on a city: an unmatched day resolves through `defaults` +
   a procedural layout, an authored row overrides field by field, and the
   only thing a new city ever needs is one more row in the array.
   ========================================================================== */
const LevelData = {

  /** §7.2 — 128 days × 6 passes = 768, then back to day 1. [FAITHFUL] */
  totalDays() {
    return CONFIG.levels.daysPerPass * CONFIG.levels.passes;
  },

  /** Wrap any integer into a legal absolute day index. */
  normalize(index) {
    const total = LevelData.totalDays();
    return ((Math.floor(index) % total) + total) % total;
  },

  /** 1..128 — the day's slot inside its pass. */
  dayNumber(index) {
    return (LevelData.normalize(index) % CONFIG.levels.daysPerPass) + 1;
  },

  /** 0..5 — completed passes so far. */
  passNumber(index) {
    return Math.floor(LevelData.normalize(index) / CONFIG.levels.daysPerPass);
  },

  /** §7.2 — the mega-vitamin milestone: the last day of any pass. */
  isMilestone(index) {
    return LevelData.dayNumber(index) === CONFIG.levels.daysPerPass;
  },

  /** The authored row for a day slot, or null. A linear scan on purpose —
   * ~10 rows, resolved once per day, and no cache to go stale when a row is
   * added (or edited live from the console). */
  rowFor(dayNumber) {
    const rows = CONFIG.levels.days;
    for (let i = 0; i < rows.length; i++) if (rows[i].day === dayNumber) return rows[i];
    return null;
  },

  /** Un-authored days still need a name on the interstitial. */
  placeholderCity(dayNumber) {
    return 'CITY No. ' + String(dayNumber).padStart(3, '0');
  },

  /**
   * §7.3 — the stretch of street the day's buildings are laid out across. A
   * riverway eats the far end of it (buildings don't stand in the water),
   * which is what makes a river day's board visibly narrower without any
   * per-day x arithmetic being authored by hand.
   */
  spanFor(features) {
    const W = CONFIG.world;
    let right = W.rightBound;
    if (features && features.riverway) {
      right = Math.min(right, features.riverway.x - CONFIG.levels.riverMargin);
    }
    return { left: W.leftBound, right: right };
  },

  /**
   * Turn a row's `buildings` list into placed buildings: { x (left edge),
   * cols, rows, palette }. Gaps are the leftover street divided evenly and
   * capped at CONFIG.levels.maxGap, and the whole row is centred in its span
   * — so a 2-building day (Plano) reads as a small town rather than two
   * towers pinned to opposite screen edges.
   *
   * `rows` is clamped up to CONFIG.buildings.minRows here rather than trusted
   * from data: a building shorter than the monster's jump apex would let a
   * street jump land straight on a roof and break traversal
   * (13-inferred-items.md #15). A data row can't cause that.
   */
  layoutRow(specs, span) {
    const B = CONFIG.buildings;
    const n = specs.length;
    if (!n) return [];

    let frontage = 0;
    for (let i = 0; i < n; i++) frontage += specs[i].cols * B.cellWidth;

    const width = span.right - span.left;
    const slack = Math.max(0, width - frontage);
    const gap = n > 1 ? Math.min(Math.floor(slack / (n - 1)), CONFIG.levels.maxGap) : 0;
    const rowWidth = frontage + gap * (n - 1);

    let x = span.left + Math.max(0, Math.floor((width - rowWidth) / 2));
    const out = [];
    for (let i = 0; i < n; i++) {
      const spec = specs[i];
      out.push({
        x: x,
        cols: spec.cols,
        rows: Math.max(spec.rows, B.minRows),
        palette: spec.palette === undefined ? i % B.palettes.length : spec.palette,
      });
      x += spec.cols * B.cellWidth + gap;
    }
    return out;
  },

  /**
   * A deterministic board for a day nobody has authored yet — 3 to 6
   * buildings (never 2: §7.2 makes Plano "the only day with just 2"),
   * sized to always fit the span. Same no-RNG hash convention as
   * Building.windowLit and CONFIG.pickups.spawnCycle, so day 47 looks the
   * same on every run and in the headless tests.
   * [INFERRED — 13-inferred-items.md #9: the arcade's real per-city layouts
   * aren't documented anywhere; this is a stand-in until a row is authored.]
   */
  proceduralBuildings(dayNumber, span) {
    const B = CONFIG.buildings;
    const hash = function (salt) {
      return ((dayNumber * 2654435761 + salt * 40503) % 1000) / 1000;
    };
    const count = 3 + Math.floor(hash(1) * 4);                 // 3..6
    // Leave at least one cell of gap per building so the row never overflows.
    const maxCols = Math.floor((span.right - span.left) / B.cellWidth) - count;
    const cols = [];
    for (let i = 0; i < count; i++) cols.push(3);
    let extra = Math.max(0, maxCols - count * 3);
    for (let i = 0; i < count && extra > 0; i++) {
      const add = Math.min(extra, Math.floor(hash(i + 2) * 3));  // 0..2 more
      cols[i] += add;
      extra -= add;
    }
    const out = [];
    for (let i = 0; i < count; i++) {
      out.push({
        cols: cols[i],
        rows: 5 + Math.floor(hash(i + 20) * 5),                // 5..9
        palette: (dayNumber + i) % B.palettes.length,
      });
    }
    return out;
  },

  /**
   * The whole day, resolved: authored row over defaults, layout placed,
   * headline picked, difficulty decided. Game.startDay calls this once per
   * day and everything else reads `game.day`.
   */
  resolve(index) {
    const L = CONFIG.levels;
    const dayIndex = LevelData.normalize(index);
    const dayNumber = LevelData.dayNumber(dayIndex);
    const row = LevelData.rowFor(dayNumber) || {};

    const features = Object.assign({}, L.defaults.features, row.features || {});
    const enemies = Object.assign({}, L.defaults.enemies, row.enemies || {});
    const span = LevelData.spanFor(features);
    const specs = row.buildings || L.defaults.buildings ||
      LevelData.proceduralBuildings(dayNumber, span);

    const authoredDifficulty = row.difficulty !== undefined && row.difficulty !== null
      ? row.difficulty : L.defaults.difficulty;

    return {
      index: dayIndex,
      dayNumber: dayNumber,
      pass: LevelData.passNumber(dayIndex),
      city: row.city || LevelData.placeholderCity(dayNumber),
      headline: L.headlines[dayIndex % L.headlines.length],
      authored: !!LevelData.rowFor(dayNumber),
      buildings: specs,
      layout: LevelData.layoutRow(specs, span),
      span: span,
      features: features,
      enemies: enemies,
      // §5.2 — the per-day half of Game.difficultyScalar. An explicit row
      // value wins; otherwise it ramps with the day number.
      difficulty: authoredDifficulty === null || authoredDifficulty === undefined
        ? (dayNumber - 1) * CONFIG.difficulty.dayScalarStep
        : authoredDifficulty,
      milestone: LevelData.isMilestone(dayIndex),
    };
  },

  /** The names of the features a day actually has, for the intro card. */
  featureLabels(day) {
    const f = day.features;
    const out = [];
    if (f.riverway) out.push('RIVERWAY');
    if (f.bridge) out.push('BRIDGE');
    if (f.pier) out.push('PIER');
    if (f.boater) out.push('BOATER');
    if (f.train) out.push('TRAIN');
    return out;
  },
};


/* ==========================================================================
   06-levels-progression §7.3 — Train and Boater (level-feature entities)

   The two §7.3 features that are actors rather than scenery, and the two
   §6 scoring rows that were left unreachable in Session 8 waiting on them
   ("Train (per hit) 500", "Boater 750"). Both extend the same Entity base
   as everything else and are punched through the same resolvePunch chain a
   street Guardsman is (Game.featureTargetFor) — they're just neither Enemy
   (they don't attack) nor Human (they aren't food).

   [INFERRED — 13-inferred-items.md #44] §7.3 names both and §6 prices them;
   nothing else about either is documented. Speeds, spawn cadence, the
   "how many hits does a train take" number, and the decision that neither
   damages a monster on contact are all first-pass choices.
   ========================================================================== */
class Train extends Entity {
  constructor(x, dir) {
    const T = CONFIG.features.train;
    super(x, CONFIG.world.groundY, T.width, T.height);
    this.dir = dir;
    this.hits = 0;
  }

  static spawn(fromLeft) {
    const T = CONFIG.features.train;
    const x = fromLeft ? CONFIG.world.leftBound - T.width : CONFIG.world.rightBound + T.width;
    return new Train(x, fromLeft ? 1 : -1);
  }

  update(dt) {
    if (!this.alive) return;
    this.x += this.dir * CONFIG.features.train.speed * dt;
    const margin = this.w + 4;
    if ((this.dir > 0 && this.x > CONFIG.world.rightBound + margin) ||
        (this.dir < 0 && this.x < CONFIG.world.leftBound - margin)) this.alive = false;
  }

  /**
   * §6 scores the train "per hit" — the only row in the table phrased that
   * way — so a punch always pays, and it takes `hitsToDestroy` of them to
   * wreck it. Returns the points for ScoreSystem; Monster.resolvePunch awards.
   */
  punch() {
    this.hits++;
    if (this.hits >= CONFIG.features.train.hitsToDestroy) this.alive = false;
    return CONFIG.scoring.train;
  }

  /* ---- 09-art-audio: placeholder rectangle art ------------------------- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const T = CONFIG.features.train;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    const x = cx - this.w / 2, top = feet - this.h;
    ctx.fillStyle = T.bodyColor;
    ctx.fillRect(x, top, this.w, this.h);
    ctx.fillStyle = T.trimColor;
    ctx.fillRect(x, top, this.w, 4);
    ctx.fillRect(x, feet - 5, this.w, 5);
    ctx.fillStyle = T.windowColor;
    for (let wx = x + 6; wx < x + this.w - 8; wx += 12) ctx.fillRect(wx, top + 7, 7, 6);
    ctx.fillStyle = T.wheelColor;
    for (let wx = x + 7; wx < x + this.w - 6; wx += 14) ctx.fillRect(wx, feet - 3, 6, 3);
    // Damage tell: the wreck darkens with each hit that hasn't finished it.
    if (this.hits > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.22 * this.hits) + ')';
      ctx.fillRect(x, top, this.w, this.h);
    }
  }
}

class Boater extends Entity {
  constructor(x, dir) {
    const B = CONFIG.features.boater;
    super(x, CONFIG.world.groundY, B.width, B.height);
    this.dir = dir;
  }

  /** Spawns at one end of the day's river and drifts along it. */
  static spawn(river, fromLeft) {
    const B = CONFIG.features.boater;
    const x = fromLeft ? river.x - B.width : river.x + river.w + B.width;
    return new Boater(x, fromLeft ? 1 : -1);
  }

  update(dt, game) {
    if (!this.alive) return;
    const river = game.day && game.day.features.riverway;
    if (!river) { this.alive = false; return; }
    this.x += this.dir * CONFIG.features.boater.speed * dt;
    const margin = this.w + 4;
    if ((this.dir > 0 && this.x > river.x + river.w + margin) ||
        (this.dir < 0 && this.x < river.x - margin)) this.alive = false;
  }

  /** §6 — "Boater: 750". One punch, unlike the train's per-hit row. */
  punch() {
    this.alive = false;
    return CONFIG.scoring.boater;
  }

  /* ---- 09-art-audio: placeholder rectangle art ------------------------- */
  draw(ctx, alpha) {
    if (!this.alive) return;
    const B = CONFIG.features.boater;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    ctx.fillStyle = B.hullColor;
    ctx.fillRect(cx - this.w / 2, feet - 6, this.w, 6);
    ctx.fillStyle = B.personColor;
    ctx.fillRect(cx - 3, feet - this.h, 6, this.h - 6);
    ctx.fillStyle = B.oarColor;
    ctx.fillRect(cx - this.w / 2 - 3, feet - 9, this.w + 6, 2);
  }
}


/* ==========================================================================
   09-art-audio — street backdrop (placeholder)
   AudioManager lands in Session 11; nothing makes noise yet.
   ========================================================================== */
function drawStreet(ctx) {
  const V = CONFIG.view;
  const W = CONFIG.world;

  ctx.fillStyle = V.skyColor;
  ctx.fillRect(0, 0, V.width, V.height);
  ctx.fillStyle = V.horizonColor;
  ctx.fillRect(0, V.horizonY, V.width, W.groundY - V.horizonY);

  ctx.fillStyle = V.streetColor;
  ctx.fillRect(0, W.groundY, V.width, V.height - W.groundY);
  ctx.fillStyle = V.curbColor;
  ctx.fillRect(0, W.groundY, V.width, V.curbHeight);

  ctx.fillStyle = V.laneColor;
  for (let x = 0; x < V.width; x += V.laneDashWidth + V.laneDashGap) {
    ctx.fillRect(x, V.laneY, V.laneDashWidth, V.laneDashHeight);
  }
}

/**
 * 06-levels-progression §7.3 — the day's static set-piece dressing: the
 * riverway band, the bridge deck across it, and the pier at the near bank.
 * Drawn straight after the street and before any entity, so a monster
 * wading through the river or standing on the bridge draws in front of it.
 * The moving features (train, boater) are entities and draw themselves.
 */
function drawLevelFeatures(ctx, day) {
  if (!day) return;
  const F = CONFIG.features, V = CONFIG.view, W = CONFIG.world;
  const river = day.features.riverway;

  if (river) {
    const R = F.riverway;
    ctx.fillStyle = R.waterColor;
    ctx.fillRect(river.x, W.groundY, river.w, V.height - W.groundY);
    ctx.fillStyle = R.surfaceColor;
    ctx.fillRect(river.x, W.groundY, river.w, V.curbHeight);
    ctx.fillStyle = R.foamColor;
    for (let x = river.x + 4; x < river.x + river.w - R.rippleWidth; x += R.rippleWidth + R.rippleGap) {
      ctx.fillRect(x, W.groundY + R.rippleY, R.rippleWidth, R.rippleHeight);
    }
  }

  const pier = day.features.pier;
  if (pier) {
    const P = F.pier;
    ctx.fillStyle = P.pileColor;
    for (let x = pier.x + 2; x < pier.x + pier.w; x += P.pileEvery) {
      ctx.fillRect(x, W.groundY, P.pileWidth, P.pileDepth);
    }
    ctx.fillStyle = P.deckColor;
    ctx.fillRect(pier.x, W.groundY, pier.w, P.deckHeight);
  }

  const bridge = day.features.bridge;
  if (bridge) {
    const Bg = F.bridge;
    ctx.fillStyle = Bg.pileColor;
    ctx.fillRect(bridge.x + 2, W.groundY, Bg.pileWidth, V.height - W.groundY);
    ctx.fillRect(bridge.x + bridge.w - 2 - Bg.pileWidth, W.groundY, Bg.pileWidth, V.height - W.groundY);
    ctx.fillStyle = Bg.deckColor;
    ctx.fillRect(bridge.x, W.groundY, bridge.w, Bg.deckHeight);
    // Decorative truss above the deck; the monster draws over it.
    ctx.fillStyle = Bg.trussColor;
    ctx.fillRect(bridge.x, W.groundY - Bg.trussHeight, 2, Bg.trussHeight);
    ctx.fillRect(bridge.x + bridge.w - 2, W.groundY - Bg.trussHeight, 2, Bg.trussHeight);
    ctx.fillRect(bridge.x, W.groundY - Bg.trussHeight, bridge.w, 2);
  }
}


/* ==========================================================================
   08-hud-ui — screens and HUD

   Laid out as CONFIG.ui.hudColumns (3) columns from the start; a slot with no
   player is reserved and drawn empty (name only, dim), never collapsed down
   to however many players actually joined. Each joined column shows the
   monster's name, its live score, and an energy bar — §9's three required
   pieces, per column, for up to 3 players from the start.
   ========================================================================== */
function textAt(ctx, str, x, y, size, color, align) {
  ctx.font = size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function blinkOn(time) {
  return (time % CONFIG.ui.blinkPeriod) < CONFIG.ui.blinkPeriod / 2;
}

/** 09-art-audio §10 — a chasing row of marquee bulbs across the title
 * screen, purely decorative arcade-cabinet dressing. Alternate bulbs are on
 * a beat apart, `time`-driven rather than per-bulb state so the pattern
 * needs no storage of its own. */
function drawMarqueeBulbs(ctx, time) {
  const U = CONFIG.ui, V = CONFIG.view;
  const n = U.marqueeBulbCount;
  const span = (n - 1) * U.marqueeBulbGap;
  const startX = V.width / 2 - span / 2;
  const beat = Math.floor(time * 4);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = (i + beat) % 3 === 0 ? U.marqueeOnColor : U.marqueeOffColor;
    ctx.fillRect(startX + i * U.marqueeBulbGap - U.marqueeBulbSize / 2,
      U.marqueeY - U.marqueeBulbSize / 2, U.marqueeBulbSize, U.marqueeBulbSize);
  }
}

/* A KeyboardEvent.code turned into something printable on the HUD. Not a
   tunable — purely how a key map (CONFIG.players.slots, which is the
   tunable) reads on screen. Anything not listed falls back to stripping the
   'Key'/'Digit' prefix, which covers every letter and number. Shared by the
   join hint and §7.4's continue prompt so the two never disagree about what
   a player's keys are called. */
const KEY_LABELS = {
  Period: '.', Slash: '/', Comma: ',', Semicolon: ';', Quote: "'",
  Space: 'SPACE', Enter: 'ENTER', ShiftLeft: 'LSHIFT', ShiftRight: 'RSHIFT',
  ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', ArrowUp: 'UP', ArrowDown: 'DOWN',
};
function keyLabel(code) {
  return KEY_LABELS[code] || code.replace(/^(Key|Digit)/, '');
}

function drawHudStrip(game) {
  const ctx = game.ctx;
  const U = CONFIG.ui;
  const colWidth = CONFIG.view.width / U.hudColumns;
  const monsters = game.entities.ofType(Monster);
  for (let i = 0; i < U.hudColumns; i++) {
    const x = i * colWidth + U.hudPadX;
    const player = game.players[i];
    if (player && player.joined) {
      const type = CONFIG.monsterTypes[player.monsterTypeId];
      // `alive` matters here now: a player who just continued (or whose
      // human form was just eaten) has a despawned monster still sitting in
      // the entity list until the end-of-tick sweep, and picking that one
      // would flash an empty bar over a perfectly healthy monster.
      const monster = monsters.find(function (m) { return m.alive && m.playerIndex === player.index; });

      // 09-art-audio §10 — an arcade-style panel behind the column, bordered
      // in that player's own monster color so three columns at a glance
      // read as three different fighters, not just three numbers.
      ctx.fillStyle = U.hudPanelColor;
      ctx.fillRect(x - 3, U.hudTop - 2, U.hudPanelWidth, U.hudPanelHeight);
      ctx.strokeStyle = type.headColor;
      ctx.lineWidth = U.hudPanelBorderWidth;
      ctx.strokeRect(x - 2.5, U.hudTop - 1.5, U.hudPanelWidth - 1, U.hudPanelHeight - 1);

      textAt(ctx, player.label + '  ' + type.name, x, U.hudTop, U.bodyFontSize, U.textColor);
      textAt(ctx, String(player.score).padStart(6, '0'), x, U.hudTop + U.hudLineHeight, U.bodyFontSize, U.accentColor);
      drawHudEnergyBar(ctx, x, U.hudTop + U.hudLineHeight * 2, monster, game.simTime);
    } else {
      /* 07-multiplayer §8.1 — the reserved column now also advertises how
         to buy into it, since "players can join at any time" is invisible
         otherwise. Still name-only and dim: no score, no bar, and the
         column keeps exactly the space it always did. */
      const slot = CONFIG.players.slots[i];
      textAt(ctx, slot.label + '  ----', x, U.hudTop, U.bodyFontSize, U.dimTextColor);
      textAt(ctx, 'JOIN: ' + keyLabel(slot.keys.start[0]), x, U.hudTop + U.hudLineHeight,
        U.smallFontSize, U.dimTextColor);
    }
  }
}

/** §9's per-monster energy bar. `monster` is null before PLAY spawns one
 * (e.g. CHARACTER_SELECT, which also calls drawHudStrip) — draws empty.
 * 09-art-audio §10 — now a segmented arcade-style bar (chunky dividers
 * rather than a smooth gradient) that flashes once critically low. */
function drawHudEnergyBar(ctx, x, y, monster, simTime) {
  const U = CONFIG.ui;
  const w = U.hudBarWidth, h = U.hudBarHeight;
  const frac = monster ? clamp(monster.energyFraction, 0, 1) : 0;
  const critical = frac > 0 && frac <= 0.3;
  const hidden = critical && Math.floor((simTime || 0) / U.hudBarLowFlashPeriod) % 2 === 0;

  ctx.fillStyle = U.hudBarBgColor;
  ctx.fillRect(x, y, w, h);
  if (!hidden) {
    ctx.fillStyle = critical ? U.hudBarLowColor : U.hudBarColor;
    ctx.fillRect(x, y, Math.round(w * frac), h);
  }
  // Segment dividers — an arcade energy bar reads as discrete chunks of
  // health, not a continuous gradient.
  ctx.fillStyle = U.hudBarSegColor;
  const segW = w / U.hudBarSegments;
  for (let s = 1; s < U.hudBarSegments; s++) {
    ctx.fillRect(x + Math.round(s * segW), y, 1, h);
  }
  ctx.strokeStyle = U.dimTextColor;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* ---- 08-hud-ui §9 / 06-levels-progression §7 — day screens ------------
   The three UI states §9 lists that Session 8 didn't build: the day
   interstitial (city + comedic newspaper headline), the continue prompt
   during a defeated monster's walk-off, and the mega-vitamin flourish at a
   128-day milestone. All three read the same 3-column, up-to-3-players
   assumption the HUD strip does — nothing here counts joined players.     */

/** §7.1 — the "next city" card, shown before every day including the first. */
function drawDayIntro(game) {
  const ctx = game.ctx;
  const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
  const day = game.day;
  drawStreet(ctx);
  drawLevelFeatures(ctx, day);

  textAt(ctx, 'DAY ' + day.dayNumber + ' OF ' + CONFIG.levels.daysPerPass,
    V.width / 2, L.introDayY, U.bodyFontSize, U.dimTextColor, 'center');
  textAt(ctx, day.city, V.width / 2, L.introCityY, U.titleFontSize, U.accentColor, 'center');

  const features = LevelData.featureLabels(day);
  if (features.length) {
    textAt(ctx, features.join('  ·  '), V.width / 2, L.introFeatureY,
      U.bodyFontSize, U.textColor, 'center');
  }
  // §7.2 — which time around the 128-day list this is.
  if (day.pass > 0) {
    textAt(ctx, 'PASS ' + (day.pass + 1) + ' OF ' + CONFIG.levels.passes,
      V.width / 2, L.introPassY, U.bodyFontSize, U.dimTextColor, 'center');
  }
  drawHudStrip(game);
}

/**
 * §7.1 — the newspaper-headline interstitial between days, and §7.2's
 * mega-vitamin flourish when the day just cleared was the 128th of a pass.
 * Headlines are short originals in the arcade's comedic spirit rather than
 * its own copy — CONFIG.levels.headlines, picked by day index.
 */
function drawDayClear(game) {
  const ctx = game.ctx;
  const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
  const cleared = game.clearedDay;
  drawStreet(ctx);

  const px = U.paperMargin, pw = V.width - U.paperMargin * 2;
  ctx.fillStyle = U.paperShadeColor;
  ctx.fillRect(px + 3, U.paperTop + 3, pw, U.paperHeight);
  ctx.fillStyle = U.paperColor;
  ctx.fillRect(px, U.paperTop, pw, U.paperHeight);

  const mid = V.width / 2;
  textAt(ctx, 'THE DAILY RUBBLE', mid, U.paperTop + L.paperMastheadOffsetY,
    U.bodyFontSize, U.paperInkColor, 'center');
  ctx.fillStyle = U.paperInkColor;
  ctx.fillRect(px + U.paperRuleInset, U.paperTop + L.paperRuleOffsetY,
    pw - U.paperRuleInset * 2, 1);

  textAt(ctx, cleared.headline, mid, U.paperTop + L.paperHeadlineOffsetY,
    U.bodyFontSize, U.paperInkColor, 'center');
  textAt(ctx, cleared.city + '  —  DAY ' + cleared.dayNumber + ' LEVELLED',
    mid, U.paperTop + L.paperDeckOffsetY, U.smallFontSize, U.paperMutedInkColor, 'center');

  // §7.2 mega-vitamin flourish — only on a 128-day milestone.
  if (game.megaVitamin) {
    textAt(ctx, 'MEGA-VITAMIN!  FULL HEAL  +' + game.megaVitamin.points +
      '  (' + game.megaVitamin.players.join(' ') + ')',
      mid, U.paperTop + L.paperBonusOffsetY, U.bodyFontSize, U.bonusColor, 'center');
  }

  const scores = game.activePlayers().map(function (p) {
    return p.label + ' ' + String(p.score).padStart(6, '0');
  }).join('    ');
  textAt(ctx, scores, mid, U.paperTop + L.paperScoreOffsetY,
    U.smallFontSize, U.paperMutedInkColor, 'center');

  textAt(ctx, 'NEXT — DAY ' + game.day.dayNumber + ': ' + game.day.city,
    mid, U.paperTop + L.paperNextOffsetY, U.bodyFontSize, U.paperInkColor, 'center');

  if (blinkOn(game.stateTime)) {
    textAt(ctx, 'PRESS START TO SKIP', mid, L.paperSkipY,
      U.smallFontSize, U.dimTextColor, 'center');
  }
}

/**
 * §7.4 — "if the player re-inserts a credit before the human figure finishes
 * walking off screen, that monster rejoins." Drawn over PLAY for exactly as
 * long as that walk-off lasts, one line per player in the window, with the
 * seconds left on it. Nothing here is a state change — the prompt is an
 * overlay so the other monsters keep playing underneath it (§7.4: "remaining
 * monsters continue").
 */
function drawContinuePrompt(game) {
  const ctx = game.ctx;
  const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
  const waiting = game.players.filter(function (p) { return p.awaitingContinue; });
  if (!waiting.length) return;

  let y = L.continuePromptY;
  for (const p of waiting) {
    const keys = CONFIG.players.slots[p.index].keys;
    const label = p.label + ' CONTINUE?  PRESS ' + keyLabel(keys.punch[0]) +
      '  —  ' + Math.ceil(p.continueTimer);
    if (blinkOn(game.simTime)) {
      textAt(ctx, label, V.width / 2, y, U.headingFontSize, U.continueColor, 'center');
    }
    y += L.continueLineHeight;
  }
}

/** §7.4 — every continue window closed. No extra lives are ever awarded
 * (§6), so this is simply the end of the run. */
function drawGameOver(game) {
  const ctx = game.ctx;
  const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
  drawStreet(ctx);
  textAt(ctx, 'GAME OVER', V.width / 2, L.overTitleY, U.titleFontSize, U.accentColor, 'center');

  let y = L.overScoreY;
  for (const p of game.activePlayers()) {
    const type = CONFIG.monsterTypes[p.monsterTypeId];
    textAt(ctx, p.label + '  ' + type.name + '  ' + String(p.score).padStart(6, '0') +
      '  ·  ' + p.continues + ' CONTINUE' + (p.continues === 1 ? '' : 'S'),
      V.width / 2, y, U.bodyFontSize, U.textColor, 'center');
    y += L.overScoreLineHeight;
  }
  const reached = game.clearedDay || game.day;
  if (reached) {
    textAt(ctx, 'REACHED DAY ' + reached.dayNumber + ' — ' + reached.city,
      V.width / 2, y + L.overScoreLineHeight, U.smallFontSize, U.dimTextColor, 'center');
  }
  if (blinkOn(game.stateTime)) {
    textAt(ctx, 'PRESS START', V.width / 2, L.overPromptY, U.headingFontSize, U.textColor, 'center');
  }
}


/* ---- Debug readout (temporary scaffolding predating the real HUD) ---- */
function drawDebug(game) {
  if (!CONFIG.debug.enabled) return;
  const D = CONFIG.debug;
  const ctx = game.ctx;
  const lines = [
    'STATE ' + game.state + '   FPS ' + game.fps.toFixed(0) +
      '   TICK ' + game.tickCount + '   SIM ' + game.simTime.toFixed(1) + 's' +
      '   AUDIO ' + (!SFX.ctx ? 'LOCKED' : SFX.muted ? 'MUTED' : 'ON') +
      ' (' + keyLabel(CONFIG.audio.muteKey) + ')',
  ];
  // Session 9 readout: where the run is in the 768-day sequence, what the
  // day system resolved for it, and the scalar that day is driving.
  if (game.day) {
    const d = game.day;
    lines.push('DAY ' + (game.dayIndex + 1) + '/' + LevelData.totalDays() +
      '  (No.' + d.dayNumber + ' PASS ' + (d.pass + 1) + ')  ' + d.city +
      (d.authored ? '' : ' [procedural]') +
      '  BLDG ' + d.layout.length +
      '  FEAT ' + (LevelData.featureLabels(d).join('/') || '—') +
      '  DIFF ' + game.difficultyScalar().toFixed(2) +
      (d.milestone ? '  ★MILESTONE' : ''));
  }
  /* One line per live monster, not just the first — Session 10's whole
     point is that there is more than one. Sorted by player slot so a given
     player's line doesn't move around as monsters spawn and despawn. */
  const monsters = game.entities.ofType(Monster).slice().sort(function (a, b) {
    return a.playerIndex - b.playerIndex;
  });
  for (const monster of monsters) {
    lines.push(
      game.players[monster.playerIndex].label + ' ' + monster.type.name +
      '  x ' + monster.x.toFixed(1) + '  y ' + monster.y.toFixed(1) +
      '  vx ' + monster.vx.toFixed(0) + '  vy ' + monster.vy.toFixed(0) +
      '  ' + monster.stance + '/' + monster.animState + '  face ' + (monster.facing > 0 ? 'R' : 'L') +
      '  ON ' + (monster.attached ? 'BLDG' + monster.attached.index : '—') +
      '  E ' + Math.round(monster.energy) + '/' + CONFIG.health.maxEnergy +
      (monster.lastDamageSource ? '  DMG:' + monster.lastDamageSource : '') +
      (monster.lastHealSource ? '  HEAL:' + monster.lastHealSource : '') +
      (monster.defeated ? '  DEFEATED' : '') +
      (monster.holding ? '  HOLDING ' + monster.holding.typeId +
        ' (' + monster.holding.holdTimer.toFixed(1) + 's)' : '')
    );
  }
  if (monsters.length) lines.push(game.crossing.readout);
  // Session 5 readout: how many civilians/victims are in play and where.
  const humans = game.entities.ofType(Human);
  if (humans.length) {
    const counts = { WINDOW_IDLE: 0, FLEEING: 0, HELD: 0 };
    for (const h of humans) counts[h.state] = (counts[h.state] || 0) + 1;
    lines.push('HUMANS ' + humans.length +
      '  window ' + counts.WINDOW_IDLE + '  fleeing ' + counts.FLEEING + '  held ' + counts.HELD);
  }
  // Session 6 readout: Guardsmen/helicopters in play and their behavior, plus
  // live projectiles. Goes away with the rest of the debug strip in Session 8.
  const enemies = game.entities.ofType(Enemy);
  if (enemies.length) {
    const windowG = enemies.filter(function (e) { return e instanceof Guardsman && e.variant === 'WINDOW'; }).length;
    const streetG = enemies.filter(function (e) { return e instanceof Guardsman && e.variant === 'STREET'; }).length;
    const heli = enemies.filter(function (e) { return e instanceof Helicopter; });
    lines.push('ENEMIES ' + enemies.length + '  guardWin ' + windowG + '  guardStreet ' + streetG +
      '  heli ' + heli.map(function (h) { return h.mode + '/' + h.behavior; }).join(',') +
      '  PROJECTILES ' + game.entities.ofType(Projectile).length);
  }
  // Session 7 readout: tanks/police, paratroopers, lightning clouds, and the
  // difficulty scalar driving every §5.2 axis this session can express.
  // Goes away with the rest of the debug strip in Session 8.
  const vehicles = game.entities.ofType(Vehicle);
  const paratroopers = game.entities.ofType(Paratrooper);
  const clouds = game.entities.ofType(LightningCloud);
  if (vehicles.length || paratroopers.length || clouds.length || CONFIG.difficulty.scalar > 0) {
    const tanks = vehicles.filter(function (v) { return v.variant === 'TANK'; }).length;
    const police = vehicles.filter(function (v) { return v.variant === 'POLICE'; }).length;
    lines.push('VEHICLES ' + vehicles.length + ' (tank ' + tanks + ' police ' + police + ')' +
      '  PARATROOPERS ' + paratroopers.length + '  LIGHTNING ' + clouds.length +
      '  DIFFICULTY ' + CONFIG.difficulty.scalar);
  }
  // Session 8 readout: live per-player score, mirroring the real HUD's
  // numbers — kept here (unlike the old debug health bars, now redundant
  // with drawHudEnergyBar) since it's the fastest way to confirm an
  // attribution result without eyeballing three separate HUD columns.
  const active = game.activePlayers();
  if (active.length) {
    lines.push('SCORE ' + active.map(function (p) { return p.label + ':' + p.score; }).join('  '));
  }
  // Session 10 readout: the roster itself — who is in the run, on which
  // monster, and how they got there (character select vs. joined mid-day).
  lines.push('ROSTER ' + game.players.map(function (p) {
    if (!p.joined) return p.label + ':—';
    return p.label + ':' + CONFIG.monsterTypes[p.monsterTypeId].initial +
      (p.outOfPlay ? '(OUT)' : '') +
      (p.joinedOnDay === null ? '' : '(JOINED D' + (p.joinedOnDay + 1) + ')');
  }).join('  '));
  // Session 3 readout: per-building structure %, state, and who owns the
  // collapse — still the quickest way to confirm §6's attribution rule.
  if (game.buildings.length) {
    const parts = [];
    for (const b of game.buildings) {
      const tag = b.isRubble ? 'RUB' : (b.isShaking ? 'SHK' : Math.round(b.structureFraction * 100) + '%');
      parts.push('B' + b.index + ' ' + tag);
    }
    const owned = game.collapseEvents.map(function (e) {
      return 'B' + e.buildingIndex + '←' + (e.causedBy ? e.causedBy.type.initial + '/' + e.causeKind : 'NONE');
    });
    lines.push(parts.join('  ') + (game.dayCleared() ? '   DAY CLEAR' : ''));
    if (owned.length) lines.push('COLLAPSE ' + owned.join('  '));
  }
  // Session 9: level-feature entities and any open continue windows.
  const trains = game.entities.ofType(Train).length;
  const boaters = game.entities.ofType(Boater).length;
  const waiting = game.players.filter(function (p) { return p.awaitingContinue; });
  const out = game.players.filter(function (p) { return p.joined && p.outOfPlay; });
  if (trains || boaters || waiting.length || out.length) {
    lines.push('TRAINS ' + trains + '  BOATERS ' + boaters +
      '  CONTINUE ' + (waiting.map(function (p) {
        return p.label + ':' + p.continueTimer.toFixed(1) + 's';
      }).join(' ') || '—') +
      '  OUT ' + (out.map(function (p) { return p.label; }).join(' ') || '—'));
  }
  lines.push('MOVE A/D  CLIMB W/S  JUMP G  PUNCH F   (P2 arrows + . /   P3 IJKL + O/P)   ' +
    'DAY [ ]  MILESTONE \\');
  for (let i = 0; i < lines.length; i++) {
    textAt(ctx, lines[i], D.x, D.y + i * D.lineHeight, D.fontSize, D.color);
  }
}

/**
 * Frame-rate-independence check (SESSION-PLAN Session 1 success criteria):
 * times how long P1 takes to walk from the left bound to the right bound.
 * The number must be identical at 60 Hz and 144 Hz.
 */
function updateCrossingTimer(game, dt) {
  const c = game.crossing;
  // Explicitly P1's monster. It used to be "the first monster in the entity
  // list", which was the same thing right up until Session 10 put a second
  // one on the street — and would then have silently switched to whichever
  // monster happened to be listed first.
  const monster = game.monsterFor(0);
  if (!monster) return;
  const W = CONFIG.world;
  const atLeft = monster.x <= W.leftBound + monster.w / 2 + 0.5;
  const atRight = monster.x >= W.rightBound - monster.w / 2 - 0.5;

  if (atLeft) { c.running = true; c.time = 0; }
  else if (c.running) {
    c.time += dt;
    if (atRight) {
      c.running = false;
      c.last = c.time;
    }
  }
  c.readout = 'CROSS ' + (c.running ? c.time.toFixed(3) + ' (running)'
    : (c.last === null ? '— hold A to the left wall, then D' : c.last.toFixed(3) + 's'));
}


/* ==========================================================================
   00-core-loop — game state machine (10-architecture §11.2)

   BOOT → TITLE → CHARACTER_SELECT → PLAY, with the later states stubbed.
   Every transition goes through Game.setState so there's exactly one place
   that knows the flow. Run-level data (players, scores, day index) lives on
   Game and survives state changes.
   ========================================================================== */
const GameState = {
  BOOT: 'BOOT',
  TITLE: 'TITLE',
  CHARACTER_SELECT: 'CHARACTER_SELECT',
  DAY_INTRO: 'DAY_INTRO',        // §7.1 — "next city" card, then PLAY
  PLAY: 'PLAY',
  DAY_CLEAR: 'DAY_CLEAR',        // §7.1 — newspaper headline, then the next day
  GAME_OVER: 'GAME_OVER',        // §7.4 — every continue window closed
};

const MONSTER_TYPE_IDS = Object.keys(CONFIG.monsterTypes);

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.input = new InputManager(CONFIG.players.slots);
    this.entities = new EntityManager();
    this.buildings = [];          // query list for traversal; see spawnBuildings

    /* 02 §3.3 / 05-scoring §6 — one record per collapse, in the order they
       happened, each carrying the monster that caused it (or null for a
       third-party collapse). Building.collapse reads causedBy off this same
       building to award (or not award) the 2,500-point bonus the instant it
       happens; this array itself is kept only for the debug readout. Reset
       per day. */
    this.collapseEvents = [];

    /* 01-monsters §2.3 — fleeing street-civilian spawn cadence and the
       deterministic pseudo-random source for hold times (no Math.random,
       same reasoning as every other "no RNG" trick in this file: reloads —
       and the headless test harness — stay reproducible). Reset per day. */
    this.humanSpawnTimer = 0;
    this.streetSpawnCounter = 0;
    this.holdSeed = 0;

    /* 04-military-hazards §5.1 — SpawnDirector cadence timers and its own
       deterministic pseudo-random counter (same no-RNG convention as
       `holdSeed` above). Reset per day. Vehicle/paratrooper/lightning
       timers are new in Session 7. */
    this.windowGuardsmanTimer = 0;
    this.streetGuardsmanTimer = 0;
    this.helicopterTimer = 0;
    this.vehicleTimer = 0;
    this.paratrooperTimer = 0;
    this.lightningTimer = 0;
    this.spawnSeed = 0;

    /* 05-scoring §6 — deterministic pseudo-random source for the table's two
       ranged rows (designated-victim hold, safe), same no-RNG convention and
       reset-per-day treatment as holdSeed/spawnSeed. See ScoreSystem. */
    this.scoreSeed = 0;
    this.scoreSystem = new ScoreSystem(this);

    /* 06-levels-progression §7.3 — level-feature spawn cadences (train,
       boater), alongside the military ones above. Reset per day, and only
       ticked at all when the day's feature flags call for them. */
    this.trainTimer = 0;
    this.boaterTimer = 0;

    // Run-level data, persisted across state transitions (§11.2).
    this.players = [];
    for (let i = 0; i < CONFIG.players.maxPlayers; i++) {
      this.players.push({
        index: i,
        label: CONFIG.players.slots[i].label,
        joined: i < CONFIG.players.activeAtStart,
        monsterTypeId: MONSTER_TYPE_IDS[i % MONSTER_TYPE_IDS.length],
        confirmed: false,
        score: 0,                 // the only thing that writes here is ScoreSystem.award
        lastScoreEvent: null,     // { points, source, simTime } — HUD/debug flourish, not read for logic
        /* 06-levels-progression §7.1/§7.4 — new in Session 9.
           `energy` is this player's health carried *between* days: a monster
           spawns on the new day with whatever it ended the last one on, not
           topped up for free. [INFERRED — 13-inferred-items.md #45: §7 never
           says health persists, but the mega-vitamin's "surviving to the end
           of a 128-day block fully restores health" reward is meaningless if
           every day already starts full, so persistence is the reading that
           makes the documented mechanic mean something.]
           `outOfPlay` is a defeat the continue window closed on — the player
           is out for the rest of the run (§7.4: remaining monsters carry on).
           `awaitingContinue`/`continueTimer` are that window while it's open. */
        energy: CONFIG.health.maxEnergy,
        outOfPlay: false,
        awaitingContinue: false,
        continueTimer: 0,
        continues: 0,
        /* 07-multiplayer §8.1 — the day index this slot bought in on, or
           null for one that was in the run from the character select.
           Readout only (the debug strip); nothing branches on it. */
        joinedOnDay: null,
      });
    }

    /* 06-levels-progression §7.2 — absolute day index across the whole run,
       0-based: 0 .. (128×6 − 1), wrapping back to 0. `day` is the resolved
       LevelData definition for it, refreshed by startDay and read by
       everything from the SpawnDirector to the HUD. */
    this.dayIndex = 0;
    this.day = null;
    this.megaVitamin = null;      // { points, players } flourish for the interstitial
    this.clearedDay = null;       // the day the DAY_CLEAR screen is reporting on

    this.state = null;
    this.stateTime = 0;
    this.simTime = 0;
    this.tickCount = 0;
    this.fps = 0;

    this.crossing = { running: false, time: 0, last: null, readout: '' };

    this.setState(GameState.BOOT);
  }

  setState(next) {
    this.state = next;
    this.stateTime = 0;
    const handler = this.handlers[next];
    if (handler && handler.enter) handler.enter(this);
  }

  update(dt) {
    this.input.poll();
    // 09-art-audio §10 — mute toggle. Global (not per-state, not a player
    // action) so it works from the title screen too, the same reasoning as
    // the debug day-jump keys' raw wasPressed edge.
    if (this.input.wasPressed(CONFIG.audio.muteKey)) SFX.toggleMute();
    this.stateTime += dt;
    this.simTime += dt;
    this.tickCount++;
    const handler = this.handlers[this.state];
    if (handler && handler.update) handler.update(this, dt);
  }

  render(alpha) {
    const handler = this.handlers[this.state];
    if (handler && handler.draw) handler.draw(this, alpha);
    drawDebug(this);
  }

  /** Players who are in the run right now. Never assumes 1, 2 or 3. */
  activePlayers() {
    return this.players.filter(function (p) { return p.joined; });
  }

  /**
   * 06-levels-progression §7.4 — the players a day actually spawns a monster
   * for: joined, and not knocked out of the run by a continue window that
   * closed. "In multiplayer, remaining monsters continue," so this is a
   * per-player filter, never a global game-over test.
   */
  playersInPlay() {
    return this.players.filter(function (p) { return p.joined && !p.outOfPlay; });
  }

  /** The live Monster belonging to a player slot, if it still has one. */
  monsterFor(playerIndex) {
    const monsters = this.entities.ofType(Monster);
    for (let i = 0; i < monsters.length; i++) {
      if (monsters[i].playerIndex === playerIndex && monsters[i].alive) return monsters[i];
    }
    return null;
  }

  /** Spawn one monster per in-play player (02 §3.1: they start on the street). */
  spawnMonsters() {
    for (const p of this.playersInPlay()) {
      const monster = new Monster(p.monsterTypeId, p.index, this.spawnXFor(p));
      // §7.1 — health carries between days; the mega-vitamin is what refills
      // it. See the `energy` note on the player record.
      monster.energy = clamp(p.energy, 1, CONFIG.health.maxEnergy);
      this.entities.add(monster);
    }
  }

  /**
   * Where a given player's monster comes onto the street — at day start, on
   * a continue, or on a mid-day join. Spaced by seat *among the players
   * actually in play*, so two monsters never spawn on top of each other and
   * the spacing doesn't leave a gap where a knocked-out player used to be.
   * One helper rather than the same arithmetic in three places, which is
   * what Session 10 found the single-player version of: nothing before this
   * session ever had a second monster to collide with.
   */
  spawnXFor(player) {
    const seat = Math.max(0, this.playersInPlay().indexOf(player));
    return CONFIG.monster.spawnX + seat * CONFIG.monster.spawnSpacing;
  }

  /* ---- 07-multiplayer §8.1 — join in progress -------------------------
     "Players can join at any time (the 'join the action' jump-button
     start)." Any slot that isn't in the run yet can buy in with its own
     start keys, at the character select or mid-day, up to
     CONFIG.players.maxPlayers. Nothing here counts to two.

     [INFERRED — 13-inferred-items.md #49] Deliberately *not* a way back in
     for a player who is `outOfPlay`: §7.4's continue window is the
     documented route back from a defeat, and Session 9 decided a window
     that closes puts that player out for the rest of the run. Letting the
     same start press bypass that would make the continue window mean
     nothing. So join-in-progress covers slots that never joined, and the
     continue window covers slots that did.                                */

  /** Called every tick in the states a player can buy into. */
  tryJoinPlayers() {
    for (const p of this.players) {
      if (p.joined) continue;
      if (this.input.getPlayer(p.index).startPressed) this.joinPlayer(p);
    }
  }

  /**
   * §8.1 — put a slot into the run. Mid-day (PLAY) that also means a
   * monster on the street immediately, at full energy, with a score of
   * zero — a joiner starts a run's worth of scoring from scratch rather
   * than inheriting anything from the players already out there. At the
   * character select there's no day yet, so the joiner just gets a cursor
   * and picks like everybody else.
   */
  joinPlayer(player) {
    if (player.joined) return null;
    player.joined = true;
    player.monsterTypeId = this.pickMonsterTypeFor(player);
    player.cursor = MONSTER_TYPE_IDS.indexOf(player.monsterTypeId);
    player.score = 0;
    player.lastScoreEvent = null;
    player.energy = CONFIG.health.maxEnergy;
    player.outOfPlay = false;
    player.awaitingContinue = false;
    player.continueTimer = 0;
    player.continues = 0;
    player.joinedOnDay = this.dayIndex;

    if (this.state === GameState.CHARACTER_SELECT) {
      player.confirmed = false;      // still has to pick, same as everyone else
      return null;
    }
    player.confirmed = true;
    if (this.state !== GameState.PLAY) return null;
    const monster = new Monster(player.monsterTypeId, player.index, this.spawnXFor(player));
    this.entities.add(monster);
    return monster;
  }

  /**
   * §8.1 — "any player may pick any of the three monsters at select," but a
   * mid-day joiner never sees the select screen, so something has to
   * choose. Takes this slot's default type if no one already in the run has
   * it, otherwise the first free one. [INFERRED — the arcade's cabinet had
   * one monster per control panel and no such collision to resolve. It
   * matters mechanically rather than cosmetically: 01-monsters §2.3 keys
   * each monster's designated victim off its type, so two players on the
   * same type would be hunting the same victim.]
   */
  pickMonsterTypeFor(player) {
    const taken = this.players
      .filter(function (p) { return p.joined && p !== player; })
      .map(function (p) { return p.monsterTypeId; });
    if (taken.indexOf(player.monsterTypeId) === -1) return player.monsterTypeId;
    for (const id of MONSTER_TYPE_IDS) if (taken.indexOf(id) === -1) return id;
    return player.monsterTypeId;   // more players than types — can't happen at maxPlayers 3
  }

  /**
   * 02 §3.2 / 06 §7 — lay the day's buildings across the street, from the
   * layout LevelData resolved for the current day. Nothing about which
   * buildings, how many, or where is decided here any more — that is all
   * CONFIG.levels data. `this.buildings` is the query list traversal reads
   * every tick — cheaper than filtering the whole entity list per monster
   * per stance check.
   */
  spawnBuildings() {
    this.buildings = [];
    const layout = this.day.layout;
    for (let i = 0; i < layout.length; i++) {
      const spec = layout[i];
      const building = new Building(spec.x, spec.cols, spec.rows, spec.palette, i);
      this.buildings.push(building);
      this.entities.add(building);
    }
  }

  /**
   * 06-levels-progression §7 — start (or restart) a whole run. Everything
   * that survives a day but not a run resets here: scores, carried health,
   * knocked-out players, and the day index itself (from CONFIG.debug.startDay,
   * so a debug run can begin one day short of a 128-day milestone).
   */
  startRun() {
    this.dayIndex = LevelData.normalize(CONFIG.debug.startDay - 1);
    this.day = null;
    this.megaVitamin = null;
    this.clearedDay = null;
    for (const p of this.players) {
      p.score = 0;
      p.lastScoreEvent = null;
      p.energy = CONFIG.health.maxEnergy;
      p.outOfPlay = false;
      p.awaitingContinue = false;
      p.continueTimer = 0;
      p.continues = 0;
    }
  }

  /** Buildings first so monsters draw in front of them (the street is a lane). */
  startDay() {
    this.day = LevelData.resolve(this.dayIndex);
    this.entities.clear();
    this.collapseEvents = [];
    this.humanSpawnTimer = 0;
    this.streetSpawnCounter = 0;
    this.holdSeed = 0;
    this.windowGuardsmanTimer = 0;
    this.streetGuardsmanTimer = 0;
    this.helicopterTimer = 0;
    this.vehicleTimer = 0;
    this.paratrooperTimer = 0;
    this.lightningTimer = 0;
    this.trainTimer = 0;
    this.boaterTimer = 0;
    this.spawnSeed = 0;
    this.scoreSeed = 0;            // §6 — only the range-pick sequence resets; player.score does not
    for (const p of this.players) { p.awaitingContinue = false; p.continueTimer = 0; }
    this.spawnBuildings();
    this.spawnMonsters();
  }

  /**
   * 06-levels-progression §7.1 — write each in-play monster's remaining
   * energy back onto its player record, so the next day starts where this
   * one ended. Called when a day ends, before the entities are cleared.
   */
  storeEnergies() {
    for (const p of this.playersInPlay()) {
      const monster = this.monsterFor(p.index);
      if (monster && !monster.defeated) p.energy = monster.energy;
    }
  }

  /**
   * §7.2 — "the 128-day sequence runs six times total ... then resets to day
   * 1." One place decides what the next day is, and it is pure index
   * arithmetic — LevelData.normalize handles the 768 → 0 wrap.
   */
  advanceDay() {
    this.dayIndex = LevelData.normalize(this.dayIndex + 1);
  }

  /**
   * §7.2 debug — jump to an arbitrary absolute day (1-based, matching
   * CONFIG.debug.startDay and the interstitial's own numbering). Restarts
   * the current day on the new index so the board, features, enemy set and
   * difficulty all reload the normal way; nothing about progression is
   * special-cased for the jump. Reachable three ways — CONFIG.debug.startDay,
   * the CONFIG.debug.dayKeys keys, and RAMPAGE.jumpToDay(n) — all of which
   * land here.
   */
  jumpToDay(absoluteDay) {
    this.dayIndex = LevelData.normalize(absoluteDay - 1);
    if (this.state === GameState.PLAY) this.startDay();
    else this.setState(GameState.DAY_INTRO);
    return this.dayIndex + 1;
  }

  /** Raw debug keys, read once per fixed step. Guarded on CONFIG.debug.enabled
   * so a shipped build has no hidden day-skip. */
  updateDebugDayKeys() {
    if (!CONFIG.debug.enabled) return;
    const K = CONFIG.debug.dayKeys;
    if (this.input.wasPressed(K.nextDay)) this.jumpToDay(this.dayIndex + 2);
    else if (this.input.wasPressed(K.prevDay)) this.jumpToDay(this.dayIndex);
    else if (this.input.wasPressed(K.milestone)) {
      // The next day whose slot-in-pass is 128 — i.e. the next mega-vitamin.
      const per = CONFIG.levels.daysPerPass;
      this.jumpToDay(Math.floor(this.dayIndex / per) * per + per);
    }
  }

  /**
   * 06-levels-progression §7.2 / 05-scoring §6 — the mega-vitamin milestone:
   * "surviving to the end of each 128-day block fully restores health and
   * awards 5,000 points." Fired by the DAY_CLEAR handler the moment day 128
   * of any pass is cleared, before the day advances.
   *
   * [INFERRED — 13-inferred-items.md #46] §7.2 doesn't say who gets it in a
   * multiplayer game. "Surviving to the end" is read literally: every player
   * still in play (joined, not knocked out) is healed and paid; a player
   * whose continue window closed earlier gets nothing.
   */
  awardMegaVitamin() {
    const players = this.playersInPlay();
    for (const p of players) {
      p.energy = CONFIG.health.maxEnergy;
      const monster = this.monsterFor(p.index);
      if (monster && !monster.defeated) monster.energy = CONFIG.health.maxEnergy;
      // Paid on the player record, not through a monster: a player mid-
      // continue-window has no live monster but is still in the run.
      this.scoreSystem.awardPlayer(p, CONFIG.scoring.megaVitaminBonus, 'megaVitaminBonus');
    }
    this.megaVitamin = {
      points: CONFIG.scoring.megaVitaminBonus,
      players: players.map(function (p) { return p.label; }),
    };
  }

  /**
   * 06-levels-progression §7.4 — the continue window. "If the player
   * re-inserts a credit before the human figure finishes walking off screen,
   * that monster rejoins." The walk-off IS the window: while a player's
   * defeated monster is still on screen, that player can press punch/jump/
   * start to buy back in. When the human clears the screen and despawns, the
   * window closes and the player is out for the rest of the run.
   *
   * [INFERRED — 13-inferred-items.md #47] The browser has no coin slot, so
   * "re-insert a credit" is any of that player's own action keys. Continues
   * are unlimited (the arcade's limit was the player's wallet), the rejoining
   * monster comes back at full energy, and the score carries over — an
   * arcade continue never wiped your score.
   */
  updateContinueWindows(dt) {                                // eslint-disable-line no-unused-vars
    for (const p of this.playersInPlay()) {
      const monster = this.monsterFor(p.index);

      /* No monster at all — the window is over however it ended. Session 9
         reached this state exactly one way (the walk-off finished and the
         human despawned) and wrote the test as "was awaiting, now gone".
         07-multiplayer §8.2 adds a second way in: a rival can *eat* the
         human form, possibly on the very tick it appeared, before a window
         was ever opened. Both are the same outcome — that player has
         nothing on the street and no way back into the day — so this is
         one branch on "is there a monster", not a walk-off test plus a
         cannibalism special case. */
      if (!monster) {
        p.awaitingContinue = false;
        p.continueTimer = 0;
        p.outOfPlay = true;
        continue;
      }

      if (monster.defeated) {
        p.awaitingContinue = true;
        // Time left before the human figure is fully off screen — exactly the
        // walk-off geometry Monster.updateDefeated despawns on.
        const edge = monster.walkOffDir < 0 ? -monster.w : CONFIG.view.width + monster.w;
        p.continueTimer = Math.max(0, Math.abs(edge - monster.x) / CONFIG.health.walkOffSpeed);
        const input = this.input.getPlayer(p.index);
        if (input.punchPressed || input.jumpPressed || input.startPressed) this.continuePlayer(p);
      }
    }
  }

  /**
   * §7.4 — end every open continue window at once, knocking those players
   * out. Called when the day itself ends: the window *is* the walk-off, and
   * a cleared day stops the walk-off, so there is no window left to buy into.
   * [INFERRED — 13-inferred-items.md #47: the arcade never had to answer what
   * happens when another player levels the last building mid-walk-off. Ending
   * the window with the day is the reading consistent with what the window is;
   * carrying it into the next day would make it something else.]
   */
  closeContinueWindows() {
    for (const p of this.players) {
      if (!p.awaitingContinue) continue;
      p.awaitingContinue = false;
      p.continueTimer = 0;
      p.outOfPlay = true;
    }
  }

  /** §7.4 — "that monster rejoins and play continues." */
  continuePlayer(player) {
    const old = this.monsterFor(player.index);
    if (old) old.alive = false;
    player.awaitingContinue = false;
    player.continueTimer = 0;
    player.energy = CONFIG.health.maxEnergy;
    player.continues++;
    const monster = new Monster(player.monsterTypeId, player.index, this.spawnXFor(player));
    this.entities.add(monster);
    return monster;
  }

  /** §7.4 — nobody left in play. Only true once every joined player's own
   * continue window has closed. */
  runOver() {
    return this.activePlayers().length > 0 && this.playersInPlay().length === 0;
  }

  /**
   * 01-monsters §2.3 — a deterministic stand-in for Math.random(), so a
   * held victim's struggle-free time varies across grabs but a reload (and
   * the headless test harness) reproduces the exact same sequence.
   */
  nextHoldTime() {
    this.holdSeed++;
    const H = CONFIG.humans;
    const frac = (this.holdSeed * 2654435761) % 1000 / 1000;
    return H.holdTimeMin + (H.holdTimeMax - H.holdTimeMin) * frac;
  }

  /**
   * 00-core-loop §1 "civilians ... flee on the street" — spawns a fresh
   * fleeing civilian at whichever screen edge alternates next, capped at
   * `CONFIG.humans.street.maxActive` concurrent. [INFERRED — 13-inferred-
   * items.md #28: spawns already in flight rather than reacting to a
   * nearby monster, since no proximity/AI rule is documented.]
   */
  updateHumanSpawning(dt) {
    const H = CONFIG.humans.street;
    this.humanSpawnTimer -= dt;
    if (this.humanSpawnTimer > 0) return;
    this.humanSpawnTimer = H.spawnInterval;

    const active = this.entities.ofType(Human).filter(function (h) {
      return h.alive && h.location === 'STREET' && h.state === HumanState.FLEEING;
    });
    if (active.length >= H.maxActive) return;

    this.streetSpawnCounter++;
    const fromLeft = this.streetSpawnCounter % 2 === 0;
    const x = fromLeft ? CONFIG.world.leftBound - 20 : CONFIG.world.rightBound + 20;
    this.entities.add(Human.spawnOnStreet('CIVILIAN', x, fromLeft ? 1 : -1));
  }

  /**
   * 04-military-hazards §5.1 — a deterministic stand-in for Math.random(),
   * same trick as `nextHoldTime`, kept on its own counter/seed so the two
   * systems' sequences don't interfere with each other.
   */
  nextSpawnFrac() {
    this.spawnSeed++;
    return (this.spawnSeed * 2654435761) % 1000 / 1000;
  }

  /**
   * 05-scoring §6 — a deterministic stand-in for Math.random(), same trick
   * as nextHoldTime/nextSpawnFrac, on its own counter so it can't perturb
   * either of those sequences. The only two rows in the scoring table given
   * as a range (designated-victim hold, safe) resolve a point value through
   * this — see ScoreSystem.pickInRange.
   */
  nextScoreFrac() {
    this.scoreSeed++;
    return (this.scoreSeed * 2654435761) % 1000 / 1000;
  }

  /**
   * 04-military-hazards §5.2 / 06-levels-progression §7.2 — the difficulty
   * scalar, now driven by the day index rather than typed into CONFIG by
   * hand (Session 7's manual knob survives as a debug offset on top).
   *
   *   day.difficulty        the per-day term — an authored row's explicit
   *                         value, or a ramp across the 128 days of a pass.
   *   pass × passScalarStep §7.2's "later passes escalate": every completed
   *                         128-day pass permanently raises it, which is
   *                         what puts more lightning and more police on the
   *                         board on the second and later passes (via
   *                         scaledMax and policeChance below).
   *   CONFIG.difficulty.scalar  a manual offset, 0 by default.
   *
   * Safe to call before a day is resolved (title/character select) — it
   * resolves the pending day rather than returning a wrong number.
   */
  difficultyScalar() {
    const day = this.day || LevelData.resolve(this.dayIndex);
    return day.difficulty +
      day.pass * CONFIG.difficulty.passScalarStep +
      CONFIG.difficulty.scalar;
  }

  /**
   * Every §5.2 axis routes through these four helpers, so `updateSpawnDirector`
   * and every trySpawn* method below read scaled numbers instead of raw
   * CONFIG.spawnDirector/CONFIG.enemies values. At scalar 0 (day 1, pass 1,
   * no offset) every one of them is the identity — scaledInterval/scaledMax
   * return their input unchanged and policeChance/bombChance return their
   * base fraction — so day 1 still plays exactly as Session 6 built it.
   * [INFERRED — 13-inferred-items.md #36/#43: the GDD confirms each axis's
   * direction, never a rate.]
   */
  scaledInterval(base) {
    return base / (1 + this.difficultyScalar() * CONFIG.difficulty.cadenceScale);
  }

  scaledMax(base) {
    return base + Math.floor(this.difficultyScalar() * CONFIG.difficulty.maxUnitGrowth);
  }

  /** §5.2 axis 2/5: "more and faster ground units ... more police [on later
   * loops]" — the fraction of new tank/police spawns that roll police. */
  policeChance() {
    const D = CONFIG.difficulty;
    return clamp(D.policeShareBase + this.difficultyScalar() * D.policeShareGrowth, 0, 1);
  }

  /** §5.2 axis 3: "helicopters shift from strafing to bombing." Only read
   * when CONFIG.enemies.helicopter.behaviorMode is left at 'AUTO'. */
  bombChance() {
    const D = CONFIG.difficulty;
    return clamp(this.difficultyScalar() * D.bombChanceGrowth, 0, 1);
  }

  /**
   * 10-architecture §11.3 SpawnDirector — "Present every day: National
   * Guardsmen and helicopters." Eight independent cadence timers, each
   * capped at its own scaled `CONFIG.spawnDirector.max*` concurrent count.
   *
   * Session 9 gates each one on the *day's* enemy set / feature flags
   * (`this.day.enemies`, `this.day.features` — CONFIG.levels data), which is
   * what lets day 1 be Guardsmen-and-helicopters only while a later city
   * fields the full roster, with no code change per city. A day with a flag
   * off doesn't just fail its spawn roll — its timer never ticks at all, so
   * turning the flag back on doesn't fire a backlog of spawns at once.
   */
  updateSpawnDirector(dt) {
    const S = CONFIG.spawnDirector;
    const set = this.day ? this.day.enemies : CONFIG.levels.defaults.enemies;
    const features = this.day ? this.day.features : CONFIG.levels.defaults.features;

    this.tickSpawn('windowGuardsmanTimer', set.guardsmen, dt,
      this.scaledInterval(S.guardsmanWindowInterval), this.trySpawnWindowGuardsman);
    this.tickSpawn('streetGuardsmanTimer', set.guardsmen, dt,
      this.scaledInterval(S.guardsmanStreetInterval), this.trySpawnStreetGuardsman);
    this.tickSpawn('helicopterTimer', set.helicopters, dt,
      this.scaledInterval(S.helicopterInterval), this.trySpawnHelicopter);
    this.tickSpawn('vehicleTimer', set.vehicles, dt,
      this.scaledInterval(S.vehicleInterval), this.trySpawnVehicle);
    this.tickSpawn('paratrooperTimer', set.paratroopers, dt,
      this.scaledInterval(S.paratrooperInterval), this.trySpawnParatrooper);
    this.tickSpawn('lightningTimer', set.lightning, dt,
      this.scaledInterval(S.lightningInterval), this.trySpawnLightning);

    /* 06-levels-progression §7.3 — level features. Deliberately NOT passed
       through scaledInterval: a trolley timetable and a boater on the river
       aren't escalation axes, they're dressing the day either has or hasn't. */
    this.tickSpawn('trainTimer', features.train, dt, S.trainInterval, this.trySpawnTrain);
    this.tickSpawn('boaterTimer', features.boater && !!features.riverway, dt,
      S.boaterInterval, this.trySpawnBoater);
  }

  /** One cadence timer: counts down only while its day flag is on, then
   * rearms and rolls. A flag that's off freezes the timer where it is rather
   * than letting it run negative, so switching a day's feature/enemy set can
   * never fire a backlog of spawns on the first tick. */
  tickSpawn(timerKey, enabled, dt, interval, spawnFn) {
    if (!enabled) return;
    this[timerKey] -= dt;
    if (this[timerKey] > 0) return;
    this[timerKey] = interval;
    spawnFn.call(this);
  }

  /** Picks a still-standing building and, within it, a free INTACT/CRACKED
   * cell — both deterministically (`nextSpawnFrac`) — for a new window
   * Guardsman. Skips the roll entirely if nothing qualifies right now. */
  trySpawnWindowGuardsman() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Guardsman).filter(function (g) { return g.alive && g.variant === 'WINDOW'; });
    if (active.length >= this.scaledMax(S.maxWindowGuardsmen)) return;

    const standing = this.buildings.filter(function (b) { return b.standing; });
    if (!standing.length) return;
    const building = standing[Math.floor(this.nextSpawnFrac() * standing.length) % standing.length];

    const candidates = [];
    for (let r = 0; r < building.rows; r++) {
      for (let c = 0; c < building.cols; c++) {
        const cell = building.cellAt(c, r);
        if ((cell.state === CellState.INTACT || cell.state === CellState.CRACKED) &&
            !cell.pickup && !cell.human && !cell.enemy) candidates.push({ col: c, row: r });
      }
    }
    if (!candidates.length) return;
    const pick = candidates[Math.floor(this.nextSpawnFrac() * candidates.length) % candidates.length];
    building.spawnEnemyWindow(pick.col, pick.row, this);
  }

  /** Spawns at a screen edge, targeting whichever standing building is
   * nearest that edge — same shape as `updateHumanSpawning`'s street
   * civilians, but a run destination instead of a cross-and-despawn. */
  trySpawnStreetGuardsman() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Guardsman).filter(function (g) { return g.alive && g.variant === 'STREET'; });
    if (active.length >= this.scaledMax(S.maxStreetGuardsmen)) return;

    const standing = this.buildings.filter(function (b) { return b.standing; });
    if (!standing.length) return;
    const fromLeft = this.nextSpawnFrac() < 0.5;
    const target = fromLeft ? standing[0] : standing[standing.length - 1];
    const x = fromLeft ? CONFIG.world.leftBound - 16 : CONFIG.world.rightBound + 16;
    this.entities.add(Guardsman.spawnOnStreet(x, fromLeft ? 1 : -1, target));
  }

  /** §5.2 axis 3: 'AUTO' (the Session 7 default) rolls STRAFE vs. BOMB off
   * `bombChance()`; an explicit 'STRAFE'/'BOMB' override still forces a
   * single mode, same as Session 6's original manual flag. */
  trySpawnHelicopter() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Helicopter).filter(function (h) { return h.alive; });
    if (active.length >= this.scaledMax(S.maxHelicopters)) return;
    const fromLeft = this.nextSpawnFrac() < 0.5;
    const configured = CONFIG.enemies.helicopter.behaviorMode;
    const mode = configured === 'AUTO'
      ? (this.nextSpawnFrac() < this.bombChance() ? 'BOMB' : 'STRAFE')
      : configured;
    this.entities.add(Helicopter.spawn(fromLeft, mode));
  }

  /** §5.1/§5.2 — new in Session 7. Tanks and police share one cadence and
   * one concurrent cap ("more and faster ground units ... tanks and police
   * stacked"); which one rolls is `policeChance()`, so a higher difficulty
   * scalar skews the mix toward police without touching cadence at all. */
  trySpawnVehicle() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Vehicle).filter(function (v) { return v.alive; });
    if (active.length >= this.scaledMax(S.maxVehicles)) return;
    const fromLeft = this.nextSpawnFrac() < 0.5;
    const variant = this.nextSpawnFrac() < this.policeChance() ? 'POLICE' : 'TANK';
    this.entities.add(Vehicle.spawn(variant, fromLeft));
  }

  /** §5.1 — new in Session 7. Picks a still-standing building not already
   * defended by a live paratrooper (dropping or landed) — see
   * Game.monsterOnBuilding for the "is a monster on it" half of §5.1's
   * "defends that building" rule. */
  trySpawnParatrooper() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Paratrooper).filter(function (p) { return p.alive; });
    if (active.length >= this.scaledMax(S.maxParatroopers)) return;

    const defended = active.map(function (p) { return p.building; });
    const standing = this.buildings.filter(function (b) { return b.standing && defended.indexOf(b) === -1; });
    if (!standing.length) return;
    const building = standing[Math.floor(this.nextSpawnFrac() * standing.length) % standing.length];
    this.entities.add(Paratrooper.spawn(building));
  }

  /** §5.1 — new in Session 7. */
  trySpawnLightning() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(LightningCloud).filter(function (l) { return l.alive; });
    if (active.length >= this.scaledMax(S.maxLightning)) return;
    const fromLeft = this.nextSpawnFrac() < 0.5;
    this.entities.add(LightningCloud.spawn(fromLeft));
  }

  /** 06 §7.3 — new in Session 9. The train/trolley crossing the street. */
  trySpawnTrain() {
    const S = CONFIG.spawnDirector;
    const active = this.entities.ofType(Train).filter(function (t) { return t.alive; });
    if (active.length >= S.maxTrains) return;
    this.entities.add(Train.spawn(this.nextSpawnFrac() < 0.5));
  }

  /** 06 §7.3 — new in Session 9. A boater drifting along the day's river. */
  trySpawnBoater() {
    const S = CONFIG.spawnDirector;
    const river = this.day && this.day.features.riverway;
    if (!river) return;
    const active = this.entities.ofType(Boater).filter(function (b) { return b.alive; });
    if (active.length >= S.maxBoaters) return;
    this.entities.add(Boater.spawn(river, this.nextSpawnFrac() < 0.5));
  }

  /**
   * 06 §7.3 — the level-feature entity a punch connects with, if any. Same
   * shape as humanTargetFor/enemyTargetFor: tested against the drawn fist
   * (getPunchBox), best overlap wins. Train and Boater aren't Enemies (they
   * never attack) or Humans (they're not food), so they need their own
