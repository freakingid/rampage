   Session 2 scope: Building entity (grid of destructible cells), a hardcoded

   ========================================================================== */

/* ==========================================================================
   10-architecture — utilities
   ========================================================================== */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }


/* ==========================================================================
   10-architecture §11.3 — Entity base class

   Position anchor: x = horizontal centre, y = feet (bottom edge). That makes
   ground contact and, later, building-cell alignment a single comparison.

   prevX/prevY are captured at the top of every fixed step so render() can
   interpolate between the last two simulation states (§11.1).

   This is THE Phase 2 extension seam: Building, Human, Enemy, Projectile,
   Vehicle and Pickup all subclass this. Don't fork a parallel hierarchy.
   ========================================================================== */
class Entity {
  constructor(x, y, w, h) {
    this.x = x; this.y = y;
    this.prevX = x; this.prevY = y;
    this.vx = 0; this.vy = 0;
    this.w = w; this.h = h;
    this.alive = true;
  }

  get left()   { return this.x - this.w / 2; }
  get right()  { return this.x + this.w / 2; }
  get top()    { return this.y - this.h; }
  get bottom() { return this.y; }

  /** Snapshot the current position as "previous" before a fixed step runs. */
  beginStep() { this.prevX = this.x; this.prevY = this.y; }

  /** Interpolated render position. */
  renderX(alpha) { return lerp(this.prevX, this.x, alpha); }
  renderY(alpha) { return lerp(this.prevY, this.y, alpha); }

  update(dt, game) {}          // eslint-disable-line no-unused-vars
  draw(ctx, alpha) {}          // eslint-disable-line no-unused-vars
}


/* ==========================================================================
   10-architecture §11.3 — EntityManager
   Spawn / update / despawn plus simple typed lookup. Spatial queries arrive
   when a system needs them (buildings, Session 2) — not before.
   ========================================================================== */
class EntityManager {
  constructor() { this.entities = []; }

  add(entity) { this.entities.push(entity); return entity; }
  clear() { this.entities.length = 0; }

  ofType(Type) { return this.entities.filter(function (e) { return e instanceof Type; }); }

  update(dt, game) {
    for (let i = 0; i < this.entities.length; i++) {
      const e = this.entities[i];
      e.beginStep();
      e.update(dt, game);
    }
    // Despawn pass.
    let write = 0;
    for (let i = 0; i < this.entities.length; i++) {
      if (this.entities[i].alive) this.entities[write++] = this.entities[i];
    }
    this.entities.length = write;
  }

  draw(ctx, alpha) {
    for (let i = 0; i < this.entities.length; i++) this.entities[i].draw(ctx, alpha);
  }
}


/* ==========================================================================
   10-architecture §11.3 — InputManager

   Per-player key sets, sized for CONFIG.players.maxPlayers (3). Slot 0 is
   wired for Session 1; the other slots' maps are already data above.

   Control model is 02-movement-destruction.md §3: 8-way direction + Punch +
   Jump. Held state drives movement; edge ("...Pressed") state drives punch,
   jump and menu confirms, and is consumed by exactly one fixed step so a tap
   never fires twice and never gets lost between frames.
   ========================================================================== */
const INPUT_ACTIONS = ['left', 'right', 'up', 'down', 'punch', 'jump', 'start'];

class InputManager {
  constructor(slots) {
    this.slots = slots;
    this.held = Object.create(null);      // keyCode -> true while physically down
    this.pendingPress = Object.create(null); // keyCode -> true if pressed since last poll
    this.watched = Object.create(null);   // keyCode -> true if any slot uses it

    this.players = [];
    for (let i = 0; i < slots.length; i++) {
      const state = {};
      for (const action of INPUT_ACTIONS) {
        state[action] = false;
        state[action + 'Pressed'] = false;
      }
      this.players.push(state);
      for (const action of INPUT_ACTIONS) {
        for (const code of (slots[i].keys[action] || [])) this.watched[code] = true;
      }
    }
  }

  attach(target) {
    const self = this;
    target.addEventListener('keydown', function (e) {
      if (self.watched[e.code]) e.preventDefault();
      if (e.repeat) return;                 // auto-repeat must not re-trigger edges
      self.held[e.code] = true;
      self.pendingPress[e.code] = true;
    });
    target.addEventListener('keyup', function (e) {
      if (self.watched[e.code]) e.preventDefault();
      self.held[e.code] = false;
    });
    // A lost focus with keys down would otherwise leave the monster walking.
    target.addEventListener('blur', function () { self.releaseAll(); });
  }

  releaseAll() {
    this.held = Object.create(null);
    this.pendingPress = Object.create(null);
    for (const state of this.players) {
      for (const action of INPUT_ACTIONS) {
        state[action] = false;
        state[action + 'Pressed'] = false;
      }
    }
  }

  /** Called once at the top of every fixed step, before anything reads input. */
  poll() {
    for (let i = 0; i < this.slots.length; i++) {
      const keys = this.slots[i].keys;
      const state = this.players[i];
      for (const action of INPUT_ACTIONS) {
        const codes = keys[action] || [];
        let down = false, pressed = false;
        for (const code of codes) {
          if (this.held[code]) down = true;
          if (this.pendingPress[code]) pressed = true;
        }
        state[action] = down;
        state[action + 'Pressed'] = pressed;
      }
    }
    this.pendingPress = Object.create(null);  // edges are consumed by this step
  }

  getPlayer(index) { return this.players[index]; }

  anyPressed(action) {
    for (const state of this.players) if (state[action + 'Pressed']) return true;
    return false;
  }
}


/* ==========================================================================
   02-movement-destruction §3.2 — Building

   "A building is a vertical stack of destructible cells (a grid of
   windows/wall sections)." Each cell holds a state and HP.

   Session 3 (§3.2/§3.3) adds the whole destruction path on top of that grid:
   punches drive a cell INTACT → CRACKED → HOLE → GONE, and a building runs
   STANDING → SHAKING → RUBBLE. A building is *solid to traversal* while it is
   STANDING or SHAKING (`standing` is true for both) — the shaking window is a
   warning, not a removal — and stops being climbable the instant it is RUBBLE.

   Anchor matches Entity: x = horizontal centre, y = base (feet line) — which
   is the street, so a building's base y is always CONFIG.world.groundY and
   `top` is its roof line. Cell (0,0) is the TOP-LEFT cell.

   Traversal note: the monster walks the street *in front of* the buildings
   (the 1986 original does the same — the street is a lane, not a corridor),
   so a building never blocks ground movement. It is only solid in the sense
   that a clinging monster is pinned flush to its face and a monster on the
   roof stands on its top. [INFERRED] — 13-inferred-items.md #15.
   ========================================================================== */
const CellState = {
  INTACT:  'INTACT',
  CRACKED: 'CRACKED',   // partial break (§3.2) — scores differently in §6
  HOLE:    'HOLE',      // full break, section opened
  GONE:    'GONE',      // section removed entirely
};

/* Whole-building lifecycle (§3.3). SHAKING is the tell that gives a monster
   on the building a chance to jump clear before the fall damage lands. */
const BuildingState = {
  STANDING: 'STANDING',
  SHAKING:  'SHAKING',
  RUBBLE:   'RUBBLE',
};

/* The non-GONE damage states in order. A cell's HP is spread evenly across
   them so CONFIG.buildings.cellHp stays a free tunable: at cellHp 3 that's one
   punch per state, at cellHp 6 it's two, and nothing else has to change. */
const CELL_DAMAGE_ORDER = [CellState.INTACT, CellState.CRACKED, CellState.HOLE];

function cellStateForHp(hp, maxHp) {
  if (hp <= 0) return CellState.GONE;
  const perStage = maxHp / CELL_DAMAGE_ORDER.length;
  const stagesLeft = clamp(Math.ceil(hp / perStage), 1, CELL_DAMAGE_ORDER.length);
  return CELL_DAMAGE_ORDER[CELL_DAMAGE_ORDER.length - stagesLeft];
}

class Building extends Entity {
  constructor(leftX, cols, rows, paletteIndex, index) {
    const B = CONFIG.buildings;
    const w = cols * B.cellWidth;
    const h = rows * B.cellHeight;
    super(leftX + w / 2, CONFIG.world.groundY, w, h);

    this.index = index;                 // stable id, used in collapse records
    this.cols = cols;
    this.rows = rows;
    this.palette = B.palettes[paletteIndex % B.palettes.length];

    // Grid of destructible cells (§3.2).
    this.cells = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) row.push({ state: CellState.INTACT, hp: B.cellHp });
      this.cells.push(row);
    }

    /* Collapse bookkeeping (§3.3). structureHp is maintained incrementally
       rather than re-summed, so the threshold test is O(1) per punch. */
    this.structureState = BuildingState.STANDING;
    this.shakeTimer = 0;
    this.structureHpMax = rows * cols * B.cellHp;
    this.structureHp = this.structureHpMax;

    /* Attribution (§6): the 2,500-point "building destroyed" bonus is paid
       only to the monster that actually brought it down. Set when the building
       starts shaking, so whatever landed the last blow owns the collapse.
       `causedBy` is null for a third-party collapse (demolition charges,
       helicopter bombs, dynamite — Session 6), which pays nobody. */
    this.causedBy = null;
    this.causeKind = null;              // 'punch' | 'roofDrop' | 'thirdParty'
  }

  /** The roof line the monster stands on. Same as Entity.top; named for clarity. */
  get roofY() { return this.top; }

  /** Solid to traversal — true while STANDING *and* while SHAKING. */
  get standing() { return this.structureState !== BuildingState.RUBBLE; }
  get isRubble() { return this.structureState === BuildingState.RUBBLE; }
  get isShaking() { return this.structureState === BuildingState.SHAKING; }

  /** Remaining structure as a fraction of the intact building, 1 → 0. */
  get structureFraction() {
    return this.structureHpMax > 0 ? this.structureHp / this.structureHpMax : 0;
  }

  cellAt(col, row) {
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return null;
    return this.cells[row][col];
  }

  /** World-space rect of one cell. */
  cellRect(col, row) {
    const B = CONFIG.buildings;
    return {
      x: this.left + col * B.cellWidth,
      y: this.top + row * B.cellHeight,
      w: B.cellWidth,
      h: B.cellHeight,
    };
  }

  /** Grid coords for a world point, or null if the point is off the building. */
  cellIndexAt(x, y) {
    const B = CONFIG.buildings;
    const col = Math.floor((x - this.left) / B.cellWidth);
    const row = Math.floor((y - this.top) / B.cellHeight);
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return null;
    return { col, row };
  }

  /** How many px of [left,right] lie over this building's frontage. */
  overlapWidth(left, right) {
    return Math.min(right, this.right) - Math.max(left, this.left);
  }

  /** Deterministic lit/dark window pattern — no RNG, so reloads look the same. */
  windowLit(col, row) {
    return ((col * 7 + row * 13 + this.index * 5) % CONFIG.buildings.litWindowEvery) === 0;
  }

  /* ---- §3.2 destruction ------------------------------------------------ */

  /**
   * "Punch a wall section ... to rip out that section. Repeated hits destroy
   * successive sections."
   *
   * Returns the break kind for the scorer, or null if this hit didn't change
   * the section's state: 'partial' when the section first cracks (§6: 25 pts),
   * 'full' when the punch opens a hole (§6: 225 pts). Removing an
   * already-holed section returns null — §6 has no row for it.
   * [INFERRED — 13-inferred-items.md #18.] Session 8's ScoreSystem consumes
   * this; Session 3 only has to make the damage happen.
   */
  damageCell(col, row, amount, byMonster, causeKind) {
    if (this.isRubble) return null;
    const cell = this.cellAt(col, row);
    if (!cell || cell.state === CellState.GONE) return null;

    const applied = Math.min(amount, cell.hp);
    cell.hp -= applied;
    this.structureHp -= applied;

    const before = cell.state;
    cell.state = cellStateForHp(cell.hp, CONFIG.buildings.cellHp);

    // Damage can be the blow that starts the collapse, so test before
    // returning — the break kind is scored either way.
    this.checkCollapseTriggers(byMonster, causeKind);

    if (cell.state === before) return null;
    if (cell.state === CellState.CRACKED) return 'partial';
    if (cell.state === CellState.HOLE) return 'full';
    return null;                                   // → GONE, no §6 row
  }

  /* ---- §3.3 collapse trigger & consequences ---------------------------- */

  /** Every cell of the bottom row removed — "loss of lower support". */
  bottomRowGone() {
    const row = this.cells[this.rows - 1];
    for (let c = 0; c < this.cols; c++) {
      if (row[c].state !== CellState.GONE) return false;
    }
    return true;
  }

  /**
   * §3.3: "a building collapses once enough of its structure is gone (a
   * critical amount of cell damage / loss of lower support)."
   *
   * [INFERRED] The exact trigger is undocumented — this is the Phase 1 model
   * the GDD itself proposes, with the two thresholds picked in CONFIG. See the
   * rationale block at CONFIG.buildings.collapseStructureFraction.
   */
  checkCollapseTriggers(byMonster, causeKind) {
    if (this.structureState !== BuildingState.STANDING) return;
    const B = CONFIG.buildings;
    if (this.structureFraction <= B.collapseStructureFraction ||
        (B.collapseOnBottomRowGone && this.bottomRowGone())) {
      this.beginShaking(byMonster, causeKind);
    }
  }

  /**
   * Enter the SHAKING window. Whoever triggered this owns the collapse for
   * §6 attribution, even if the building takes another hit before it falls —
   * the blow that doomed it is the one that counts.
   *
   * `byMonster` is null for a third-party collapse (Session 6's demolition
   * charges and bombs), which is exactly what makes that collapse pay nobody.
   */
  beginShaking(byMonster, causeKind) {
    if (this.structureState !== BuildingState.STANDING) return;
    this.structureState = BuildingState.SHAKING;
    this.shakeTimer = CONFIG.buildings.shakeDuration;
    this.causedBy = byMonster || null;
    this.causeKind = causeKind || 'thirdParty';
  }

  /**
   * Collapse: rubble on the street, a dust puff, and fall damage for anyone
   * who didn't take the hint. §3.3: "if a monster is still clinging to (or
   * standing on) a building when it collapses, it takes a large chunk of
   * damage from the fall. The shaking state is the tell."
   */
  collapse(game) {
    if (this.isRubble) return;
    this.structureState = BuildingState.RUBBLE;
    this.shakeTimer = 0;

    const monsters = game.entities.ofType(Monster);
    for (let i = 0; i < monsters.length; i++) {
      const m = monsters[i];
      if (m.attached !== this) continue;         // airborne monsters ride it out
      m.detach(null, false);                     // → AIR, falls to the street
      m.vy = 0;
      m.applyDamage(CONFIG.monster.fallDamage, 'FALL');
    }

    spawnDustPuffs(game, this);

    // The attribution record §6 needs. Session 8's ScoreSystem reads these and
    // pays 2,500 only when causedBy is one of its own monsters.
    game.collapseEvents.push({
      building: this,
      buildingIndex: this.index,
      causedBy: this.causedBy,
      causeKind: this.causeKind,
      simTime: game.simTime,
    });
  }

  update(dt, game) {
    if (this.structureState !== BuildingState.SHAKING) return;
    this.shakeTimer -= dt;
    if (this.shakeTimer <= 0) {
      this.shakeTimer = 0;
      this.collapse(game);
    }
  }

  /**
   * Horizontal judder while SHAKING. Driven off the render alpha as well as
   * the timer so an 18 Hz shake doesn't alias against the 60 Hz simulation.
   */
  shakeOffset(alpha) {
    if (!this.isShaking) return 0;
    const B = CONFIG.buildings;
    const elapsed = B.shakeDuration - this.shakeTimer + (alpha || 0) * CONFIG.loop.fixedDt;
    return Math.sin(elapsed * B.shakeFrequency * Math.PI * 2) * B.shakeAmplitude;
  }

  /* ---- 09-art-audio: placeholder window-grid art ---------------------- */
  draw(ctx, alpha) {
    if (this.isRubble) { this.drawRubble(ctx); return; }

    const B = CONFIG.buildings;
    const left = Math.round(this.left + this.shakeOffset(alpha));
    const top = Math.round(this.top);

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) this.drawCell(ctx, c, r, left, top);
    }

    // Roof cap sits *inside* the top of the building so the roof line the
    // monster stands on is the true `top`, with no floating gap.
    ctx.fillStyle = this.palette.roof;
    ctx.fillRect(left - B.roofCapOverhang, top,
      this.w + B.roofCapOverhang * 2, B.roofCapHeight);
  }

  drawCell(ctx, col, row, left, top) {
    const B = CONFIG.buildings;
    const p = this.palette;
    const cell = this.cells[row][col];
    if (cell.state === CellState.GONE) return;        // sky shows through

    const x = left + col * B.cellWidth;
    const y = top + row * B.cellHeight;
    const w = B.cellWidth;
    const h = B.cellHeight;

    if (cell.state === CellState.HOLE) {
      ctx.fillStyle = p.wallShade;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = B.holeColor;
      ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      return;
    }

    ctx.fillStyle = p.wall;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.wallShade;
    ctx.fillRect(x, y + h - 1, w, 1);               // floor seam
    ctx.fillRect(x + w - 1, y, 1, h);               // column seam

    ctx.fillStyle = this.windowLit(col, row) ? p.windowLit : p.windowDark;
    ctx.fillRect(x + B.windowInsetX, y + B.windowInsetY,
      w - B.windowInsetX * 2, h - B.windowInsetY * 2);

    if (cell.state === CellState.CRACKED) {
      ctx.fillStyle = B.crackColor;
      ctx.fillRect(x + 3, y + 3, 2, h - 6);
      ctx.fillRect(x + 3, y + Math.round(h / 2), w - 8, 2);
    }
  }

  /**
   * §3.3 rubble mound. Scenery only in Phase 1 — it neither blocks the street
   * nor supports anything, so nothing in traversal has to know it exists (see
   * `standing`). The ragged top is a fixed pattern, not RNG, so a reload draws
   * the same street.
   */
  drawRubble(ctx) {
    const B = CONFIG.buildings;
    const left = Math.round(this.left);
    const base = Math.round(CONFIG.world.groundY);

    ctx.fillStyle = B.rubbleColor;
    ctx.fillRect(left, base - B.rubbleHeight, this.w, B.rubbleHeight);

    ctx.fillStyle = B.rubbleShadeColor;
    for (let c = 0; c < this.cols; c++) {
      const bump = ((c * 5 + this.index * 3) % 3) + 1;
      ctx.fillRect(left + c * B.cellWidth, base - B.rubbleHeight - bump, B.cellWidth, bump);
    }

    // A couple of surviving slabs so the mound reads as a wrecked building
    // rather than a kerb.
    ctx.fillStyle = this.palette.wallShade;
    for (let c = 0; c < this.cols; c += 2) {
      const slabW = Math.round(B.cellWidth / 2);
      ctx.fillRect(left + c * B.cellWidth + 3, base - B.rubbleHeight + 2, slabW, 3);
    }
  }
}


/* ==========================================================================
   09-art-audio — dust puff (02-movement-destruction §3.3)

   "collapses into a rubble pile with a dust puff." Purely cosmetic: no
   collision, no gameplay effect, despawns on its own. Spread and rise are a
   fixed pattern rather than RNG so a collapse looks identical on every run,
   which also keeps the headless tests deterministic.
   ========================================================================== */
class DustPuff extends Entity {
  constructor(x, y, vx, vy) {
    super(x, y, 0, 0);
    this.vx = vx;
    this.vy = vy;
    this.age = 0;
  }

  update(dt) {
    const D = CONFIG.buildings.dust;
    this.age += dt;
    if (this.age >= D.life) { this.alive = false; return; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  draw(ctx, alpha) {
    const D = CONFIG.buildings.dust;
    const t = clamp(this.age / D.life, 0, 1);
    const size = Math.round(D.startSize + D.growth * t);
    ctx.fillStyle = 'rgba(' + D.color + ',' + (D.maxAlpha * (1 - t)).toFixed(3) + ')';
    ctx.fillRect(
      Math.round(this.renderX(alpha) - size / 2),
      Math.round(this.renderY(alpha) - size / 2),
      size, size
    );
  }
}

function spawnDustPuffs(game, building) {
  const D = CONFIG.buildings.dust;
  for (let i = 0; i < D.count; i++) {
    const t = (i + 0.5) / D.count;                  // 0..1 across the frontage
    const jitter = (((i * 37 + building.index * 11) % 17) / 16) - 0.5;
    game.entities.add(new DustPuff(
      building.left + building.w * t,
      CONFIG.world.groundY,
      (t - 0.5) * 2 * D.spreadSpeed,                // blows outward from centre
      -D.riseSpeed * (1 + jitter)
    ));
  }
}


/* ==========================================================================
   01-monsters — Monster
   02-movement-destruction §3.1 — movement & traversal

   ONE class for all three monsters (01-monsters.md §2.1). `monsterType` picks
   art, punch-animation flavour and designated-victim id — nothing else. Every
   number below comes from CONFIG.monster, which has no per-type variants.

   Stances (§3.1): GROUND (street), AIR (jumping/falling), CLING (attached to
   a building face) and ROOF (standing on a building top). One state machine —
   `update` dispatches to exactly one per-stance handler per tick, and every
   handler is responsible for leaving the monster at a legal position.

   The transition graph, and why none of it can strand the monster:

     GROUND --up (in front of a face)--> CLING      same y (groundY) on both sides
     GROUND --jump-------------------->  AIR
     CLING  --down at the street------>  GROUND     same y (groundY) on both sides
     CLING  --up at the roof line----->  ROOF       same y (building.top) on both
     CLING  --jump-------------------->  AIR        + short re-grab lockout
     ROOF   --down-------------------->  CLING      same y (building.top)
     ROOF   --walk past the edge------>  AIR
     ROOF   --jump-------------------->  AIR
     AIR    --up + face overlap------->  CLING      (jump-to-grab)
     AIR    --falling across a roof--->  ROOF       swept test, no tunnelling
     AIR    --reach the street-------->  GROUND

   Every paired transition happens at an identical y on both sides, so no
   transition ever moves the monster — nothing to clip through and nothing to
   pop out of. The "same y" pairs are also why each one needs a directional
   guard (vdir) to stop the two states flip-flopping on the boundary; see the
   comments in updateCling / updateRoof.
   ========================================================================== */
const Stance = { GROUND: 'GROUND', AIR: 'AIR', CLING: 'CLING', ROOF: 'ROOF' };

class Monster extends Entity {
  constructor(monsterTypeId, playerIndex, x) {
    super(x, CONFIG.world.groundY, CONFIG.monster.width, CONFIG.monster.height);
    this.monsterTypeId = monsterTypeId;
    this.type = CONFIG.monsterTypes[monsterTypeId];
    this.playerIndex = playerIndex;

    this.facing = 1;                 // 1 = right, -1 = left
    this.stance = Stance.GROUND;
    this.punchTimer = 0;             // counts down through the punch animation
    this.punchCooldown = 0;
    this.punchHasHit = false;        // one connection per punch, at full reach
    this.walkPhase = 0;              // 0..1 through the walk cycle
    this.climbPhase = 0;             // 0..1 through the climb cycle
    this.animState = 'idle';

    // Traversal (§3.1). `attached` is the Building this monster is on or
    // clinging to; null in GROUND and AIR. grabIgnore/grabLockTimer stop a
    // jump off a face from instantly re-grabbing that same face.
    this.attached = null;
    this.grabIgnore = null;
    this.grabLockTimer = 0;

    /* 03-eating-health §4.1 — Session 4 replaces this with a real energy bar.
       Session 3 needs somewhere for fall damage to land so the §3.3 path is
       observable and testable; see applyDamage. */
    this.damageTaken = 0;
    this.lastDamageSource = null;
  }

  get isPunching() { return this.punchTimer > 0; }

  /** 0..1 through the punch animation, 0 when not punching. */
  get punchProgress() {
    if (!this.isPunching) return 0;
    return 1 - (this.punchTimer / CONFIG.monster.punchDuration);
  }

  /** How far the fist is extended, 0..1. Out fast, back slower. */
  get punchExtension() {
    if (!this.isPunching) return 0;
    const p = this.punchProgress;
    const e = CONFIG.monster.punchExtendFraction;
    return p < e ? (p / e) : (1 - (p - e) / (1 - e));
  }

  /**
   * The area a punch covers. Session 1 computes it and draws it in debug —
   * it hits nothing yet. Buildings (Session 3), humans (Session 5), enemies
   * (Session 6) and other monsters (Session 10) all test against this box.
   */
  getPunchBox() {
    if (!this.isPunching) return null;
    const M = CONFIG.monster;
    const reach = M.punchReach * this.punchExtension;
    return {
      x: this.facing > 0 ? this.right : this.left - reach,
      y: this.top + M.punchBoxOffsetY,
      w: reach,
      h: M.punchBoxHeight,
    };
  }

  /**
   * 02-movement-destruction §3.2 — the area a punch can rip a wall section
   * out of. Same vertical band as getPunchBox, but it starts at the monster's
   * own centre rather than at its leading edge.
   *
   * [INFERRED — 13-inferred-items.md #17] The GDD doesn't say which cell a
   * punch lands on. Reaching back to the centre is what makes the outermost
   * column of a building breakable from a face: a clinging monster is pinned
   * flush inside the frontage (Session 2), so at the right-hand edge a purely
   * forward reach would punch past the building entirely and the edge column
   * could never be destroyed by climbing. Facing still decides which way the
   * punch chews.
   */
  punchTargetRect() {
    const M = CONFIG.monster;
    const front = this.w / 2 + M.punchReach * this.punchExtension;
    return {
      x: this.facing > 0 ? this.x : this.x - front,
      y: this.top + M.punchBoxOffsetY,
      w: front,
      h: M.punchBoxHeight,
    };
  }

  /**
   * §3.2 — land one punch on one wall section. Works from the street and from
   * a face; from a roof the band sits entirely above the roof line and hits
   * nothing, which needs no special case.
   */
  resolvePunch(game) {
    const target = game.cellTargetFor(this.punchTargetRect(), this.facing);
    if (!target) return;
    // The return value is the §6 break kind ('partial' / 'full'). Nothing
    // reads it until Session 8 wires up the ScoreSystem.
    return target.building.damageCell(
      target.col, target.row, CONFIG.monster.punchDamage, this, 'punch');
  }

  /**
   * 03-eating-health §4.1 — the single funnel every damage source routes
   * through. Session 4 replaces the body with real energy bookkeeping and the
   * defeat check; the signature is the part that has to stay put. Session 3
   * calls it from exactly one place: collapse fall damage (§3.3).
   */
  applyDamage(amount, source) {
    this.damageTaken += amount;
    this.lastDamageSource = source;
  }

  update(dt, game) {
    const M = CONFIG.monster;
    const input = game.input.getPlayer(this.playerIndex);

    /* --- punch timers ------------------------------------------------- */
    if (this.punchCooldown > 0) this.punchCooldown = Math.max(0, this.punchCooldown - dt);
    if (this.punchTimer > 0) {
      this.punchTimer -= dt;
      if (this.punchTimer <= 0) {
        this.punchTimer = 0;
        this.punchCooldown = M.punchCooldown;
      }
    }
    if (this.grabLockTimer > 0) {
      this.grabLockTimer = Math.max(0, this.grabLockTimer - dt);
      if (this.grabLockTimer === 0) this.grabIgnore = null;
    }

    /* --- direction (§3: 8-way stick; punch goes the way you're holding,
           straight ahead if neutral) --------------------------------------- */
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    const vdir = (input.down ? 1 : 0) - (input.up ? 1 : 0);   // +1 down, -1 up

    /* --- start a punch ------------------------------------------------- */
    if (input.punchPressed && !this.isPunching && this.punchCooldown <= 0) {
      if (dir !== 0) this.facing = dir;
      this.punchTimer = M.punchDuration;
      this.punchHasHit = false;
    }

    /* [INFERRED] Punching roots the monster on any surface — street, face or
       roof; airborne momentum is kept. Session 1 set this rule for the ground
       and Session 2 extends it to cling/roof. 13-inferred-items.md #11.      */
    const rooted = this.isPunching && this.stance !== Stance.AIR;

    /* --- one handler per stance; each leaves a legal position ----------- */
    switch (this.stance) {
      case Stance.GROUND: this.updateGround(dt, game, input, dir, rooted); break;
      case Stance.AIR:    this.updateAir(dt, game, input, dir); break;
      case Stance.CLING:  this.updateCling(dt, game, input, dir, vdir, rooted); break;
      case Stance.ROOF:   this.updateRoof(dt, game, input, dir, rooted); break;
    }

    /* --- §3.2 the fist connects ----------------------------------------
       Resolved after the stance handler so the punch lands from the position
       the monster actually ends the tick at. Contact is the moment the fist is
       fully out (punchExtendFraction), and punchHasHit makes it exactly once
       per punch however many ticks the animation spans.                    */
    if (this.isPunching && !this.punchHasHit &&
        this.punchProgress >= M.punchExtendFraction) {
      this.punchHasHit = true;
      this.resolvePunch(game);
    }

    /* --- animation ------------------------------------------------------ */
    if (this.stance === Stance.AIR) this.animState = 'jump';
    else if (this.isPunching) this.animState = 'punch';
    else if (this.stance === Stance.CLING) this.animState = 'climb';
    else if (this.vx !== 0) this.animState = 'walk';
    else this.animState = 'idle';

    if (this.animState === 'walk') {
      this.walkPhase = (this.walkPhase + dt / M.walkCycleTime) % 1;
    } else if (this.animState !== 'jump') {
      this.walkPhase = 0;
    }
    if (this.stance === Stance.CLING && (this.vx !== 0 || this.vy !== 0)) {
      this.climbPhase = (this.climbPhase + dt / M.climbCycleTime) % 1;
    }
  }

  /** Keep the monster inside the playfield. Buildings never block the street. */
  clampToStreet() {
    const W = CONFIG.world;
    this.x = clamp(this.x, W.leftBound + this.w / 2, W.rightBound - this.w / 2);
  }

  /** Leave the current surface for a jump/fall. */
  detach(building, lockout) {
    this.stance = Stance.AIR;
    this.attached = null;
    if (lockout) {
      this.grabIgnore = building;
      this.grabLockTimer = CONFIG.monster.grabLockout;
    }
  }

  /**
   * Attach to a building face (§3.1 "the monster clings to the wall").
   * Pins the body flush inside the frontage and between the roof line and the
   * street, so a cling position is always legal however it was entered.
   */
  attachToFace(building, feetY) {
    this.attached = building;
    this.stance = Stance.CLING;
    this.vx = 0;
    this.vy = 0;
    this.x = clamp(this.x, building.left + this.w / 2, building.right - this.w / 2);
    this.y = clamp(feetY, building.top, CONFIG.world.groundY);
    this.grabIgnore = null;
    this.grabLockTimer = 0;
  }

  /* ---- GROUND: walk the street, jump, or start a climb ----------------- */
  updateGround(dt, game, input, dir, rooted) {
    const M = CONFIG.monster;
    this.y = CONFIG.world.groundY;
    this.vy = 0;

    if (dir !== 0 && !rooted) this.facing = dir;
    this.vx = rooted ? 0 : dir * M.walkSpeed;
    this.x += this.vx * dt;
    this.clampToStreet();

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.detach(null, false);
      return;
    }

    // §3.1: "when adjacent to a building face, up/down climbs it".
    if (input.up && !this.isPunching) {
      const target = game.faceTargetFor(this);
      if (target) this.attachToFace(target, CONFIG.world.groundY);
    }
  }

  /* ---- AIR: ballistic, with jump-to-grab and roof landing -------------- */
  updateAir(dt, game, input, dir) {
    const M = CONFIG.monster;
    const W = CONFIG.world;

    if (dir !== 0) this.facing = dir;
    this.vx = dir * M.walkSpeed * M.airControl;
    this.vy += M.gravity * dt;

    const prevFeet = this.y;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.clampToStreet();

    /* §3.1 jump-to-grab: "Jump toward a building and hold up to grab it."
       Checked before the landing test so holding up near a roof edge grabs
       the face rather than sliding past it.                                 */
    if (input.up) {
      const target = game.faceTargetFor(this, this.grabIgnore);
      if (target) { this.attachToFace(target, this.y); return; }
    }

    /* Roof landing. Swept (prev→now crossed the roof line) so a fast fall
       can never tunnel through a roof, and only while descending so a jump
       from a roof passes back up through its own roof line cleanly.

       A monster on the street can't land on a roof by jumping: every building
       is taller than the jump apex (see CONFIG.buildings), so the feet never
       get above a roof line to begin with. That's what keeps the street a
       lane in front of the buildings instead of a set of ramps.             */
    if (this.vy > 0) {
      const roof = game.roofLandingAt(this.x, prevFeet, this.y);
      if (roof) {
        this.y = roof.top;
        this.vy = 0;
        this.stance = Stance.ROOF;
        this.attached = roof;

        /* §3.2 roof-drop collapse: "weaken a building, then jump onto its
           roof — the monster's weight finishes it off and it collapses."
           Only a *landing* does it, so walking onto a roof off a face is
           safe; and it leaves the monster standing on a shaking building,
           which is the intended skill check — jump again or eat the fall.
           [INFERRED] threshold — CONFIG.buildings.roofDropStructureFraction. */
        if (roof.structureFraction <= CONFIG.buildings.roofDropStructureFraction) {
          roof.beginShaking(this, 'roofDrop');
        }
        return;
      }
    }

    if (this.y >= W.groundY) {
      this.y = W.groundY;
      this.vy = 0;
      this.stance = Stance.GROUND;
      this.attached = null;
    }
  }

  /* ---- CLING: on a building face -------------------------------------- */
  updateCling(dt, game, input, dir, vdir, rooted) {
    const M = CONFIG.monster;
    const W = CONFIG.world;
    const b = this.attached;

    // A building that has come down drops whoever was on it. Building.collapse
    // already detaches and applies fall damage (§3.3); this is the safety net
    // for any other path that could turn a building to rubble mid-tick.
    if (!b || !b.standing) { this.detach(null, false); return; }

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.vx = dir * M.walkSpeed * M.airControl;
      this.detach(b, true);
      return;
    }

    if (rooted) {
      this.vx = 0;
      this.vy = 0;
    } else {
      if (dir !== 0) this.facing = dir;
      this.vx = dir * M.climbSideSpeed;
      this.vy = vdir * M.climbSpeed;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }

    // Pinned to the frontage: you can traverse the face sideways but never
    // slide off its edge into thin air.
    this.x = clamp(this.x, b.left + this.w / 2, b.right - this.w / 2);
    this.clampToStreet();

    /* Roof line. Same y as ROOF, so the guard is what separates them: only an
       explicit "up" pulls you over the parapet. Coming the other way (ROOF +
       down) hands over at this exact y with down held, so vdir > 0 and this
       branch declines to hand it straight back. */
    if (this.y <= b.top) {
      this.y = b.top;
      this.vy = 0;
      if (vdir <= 0) { this.stance = Stance.ROOF; return; }
    }

    /* Street line. Mirror image: the same y as GROUND, and anything other
       than actively climbing up drops you onto the street — so a stray tap of
       up while walking past a building can't leave you stuck to its base. */
    if (this.y >= W.groundY) {
      this.y = W.groundY;
      this.vy = 0;
      if (vdir >= 0) {
        this.stance = Stance.GROUND;
        this.attached = null;
      }
    }
  }

  /* ---- ROOF: walking the top of a building (§3.1) ---------------------- */
  updateRoof(dt, game, input, dir, rooted) {
    const M = CONFIG.monster;
    const b = this.attached;

    if (!b || !b.standing) { this.detach(null, false); return; }

    this.y = b.top;
    this.vy = 0;

    if (dir !== 0 && !rooted) this.facing = dir;
    this.vx = rooted ? 0 : dir * M.walkSpeed;
    this.x += this.vx * dt;
    this.clampToStreet();

    if (input.jumpPressed && !this.isPunching) {
      this.vy = -M.jumpSpeed;
      this.detach(null, false);
      return;
    }

    /* Down at the roof line starts the climb back down the face, at the same
       y — the CLING handler's vdir > 0 keeps it from bouncing straight back.
       Goes through attachToFace because a roof lets the centre reach the very
       edge, which is half a body further out than a face allows; without the
       re-clamp the monster would hang off the side of the wall for a tick. */
    if (input.down && !this.isPunching) {
      this.attachToFace(b, this.y);
      return;
    }

    // Walked off the edge. The centre leaving the frontage is the trigger, so
    // the monster can stand half over the edge before it steps off.
    if (this.x < b.left || this.x > b.right) this.detach(null, false);
  }

  /* ---- 09-art-audio: placeholder rectangle art ------------------------
     Rectangles only until the Session 11 sprite pass. All three types draw
     from the same rig with a palette swap — which is what the original did
     for George and Ralph anyway (01-monsters.md §2.1).                     */
  draw(ctx, alpha) {
    const A = CONFIG.art;
    const cx = Math.round(this.renderX(alpha));
    const feet = Math.round(this.renderY(alpha));
    const w = this.w, h = this.h;
    const left = cx - w / 2;

    const legH = Math.round(h * A.legHeightFrac);
    const legW = Math.round(w * A.legWidthFrac);
    const headH = Math.round(h * A.headHeightFrac);
    const headW = Math.round(w * A.headWidthFrac);
    const bodyTop = feet - h + headH;
    const bodyH = h - headH - legH;

    // Ground shadow, only while on the street.
    if (this.stance === Stance.GROUND) {
      ctx.fillStyle = A.shadowColor;
      ctx.fillRect(left, feet - A.shadowHeight / 2, w, A.shadowHeight);
    }

    // Legs — swing while walking, tuck while airborne, alternate while climbing.
    let legOffsetA = 0, legOffsetB = 0, legLift = 0;
    if (this.animState === 'walk') {
      const swing = Math.sin(this.walkPhase * Math.PI * 2) * A.legSwingPx;
      legOffsetA = swing;
      legOffsetB = -swing;
    } else if (this.animState === 'jump') {
      legLift = A.legTuckPx;
    } else if (this.animState === 'climb') {
      legLift = Math.abs(Math.sin(this.climbPhase * Math.PI * 2)) * A.legTuckPx;
    }
    ctx.fillStyle = this.type.trimColor;
    ctx.fillRect(left + 1 + legOffsetA, feet - legH - legLift, legW, legH);
    ctx.fillRect(left + w - 1 - legW + legOffsetB, feet - legH - legLift, legW, legH);

    // Body.
    ctx.fillStyle = this.type.bodyColor;
    ctx.fillRect(left, bodyTop, w, bodyH);

    // Climbing grip — both arms out on the wall, offset out of phase so the
    // cling reads as a climb and not as a monster stuck to a poster.
    if (this.stance === Stance.CLING && !this.isPunching) {
      const armH = Math.max(2, Math.round(h * A.armThicknessFrac));
      const reach = Math.round(CONFIG.monster.punchReach * 0.45);
      const grip = Math.sin(this.climbPhase * Math.PI * 2) * A.legSwingPx;
      const armY = feet - h + CONFIG.monster.punchBoxOffsetY;
      ctx.fillStyle = this.type.headColor;
      ctx.fillRect(left - reach, armY + grip, reach, armH);
      ctx.fillRect(left + w, armY - grip, reach, armH);
    }

    // Punching arm — reaches out in the facing direction.
    if (this.isPunching) {
      const armH = Math.max(2, Math.round(h * A.armThicknessFrac));
      const reach = CONFIG.monster.punchReach * this.punchExtension;
      const armY = feet - h + CONFIG.monster.punchBoxOffsetY;
      const armX = this.facing > 0 ? cx + w / 2 : cx - w / 2 - reach;
      ctx.fillStyle = this.type.headColor;
      ctx.fillRect(armX, armY, reach, armH);
    }

    // Head + eyes.
    ctx.fillStyle = this.type.headColor;
    ctx.fillRect(cx - headW / 2, feet - h, headW, headH);
    ctx.fillStyle = A.outlineColor;
    const eyeY = feet - h + Math.round(headH / 2) - A.eyeSize / 2;
    const eyeX = this.facing > 0
      ? cx - headW / 2 + headW - A.eyeInset - A.eyeSize * 2 - 1
      : cx - headW / 2 + A.eyeInset;
    ctx.fillRect(eyeX, eyeY, A.eyeSize, A.eyeSize);
    ctx.fillRect(eyeX + A.eyeSize + 1, eyeY, A.eyeSize, A.eyeSize);

    // Initial, so the three types are identifiable before there's art.
    ctx.fillStyle = A.outlineColor;
    ctx.font = CONFIG.ui.smallFontSize + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.type.initial, cx, bodyTop + bodyH / 2);
  }
}


/* ==========================================================================
   09-art-audio — street backdrop (placeholder)
   AudioManager lands in Session 11; nothing makes noise yet.
   ========================================================================== */
function drawStreet(ctx) {
  const V = CONFIG.view;
  const W = CONFIG.world;

  ctx.fillStyle = V.skyColor;
  ctx.fillRect(0, 0, V.width, V.height);
  ctx.fillStyle = V.horizonColor;
  ctx.fillRect(0, V.horizonY, V.width, W.groundY - V.horizonY);

  ctx.fillStyle = V.streetColor;
  ctx.fillRect(0, W.groundY, V.width, V.height - W.groundY);
  ctx.fillStyle = V.curbColor;
  ctx.fillRect(0, W.groundY, V.width, V.curbHeight);

  ctx.fillStyle = V.laneColor;
  for (let x = 0; x < V.width; x += V.laneDashWidth + V.laneDashGap) {
    ctx.fillRect(x, V.laneY, V.laneDashWidth, V.laneDashHeight);
  }
}


/* ==========================================================================
   08-hud-ui — screens and HUD

   Laid out as CONFIG.ui.hudColumns (3) columns from the start; a slot with no
   player is reserved and drawn empty, never collapsed. Score and energy bars
   arrive in Sessions 8 and 4 — Session 1 shows names only, plus the debug
   readout below.
   ========================================================================== */
function textAt(ctx, str, x, y, size, color, align) {
  ctx.font = size + 'px monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function blinkOn(time) {
  return (time % CONFIG.ui.blinkPeriod) < CONFIG.ui.blinkPeriod / 2;
}

function drawHudStrip(game) {
  const ctx = game.ctx;
  const U = CONFIG.ui;
  const colWidth = CONFIG.view.width / U.hudColumns;
  for (let i = 0; i < U.hudColumns; i++) {
    const x = i * colWidth + U.hudPadX;
    const player = game.players[i];
    if (player && player.joined) {
      const type = CONFIG.monsterTypes[player.monsterTypeId];
      textAt(ctx, player.label + '  ' + type.name, x, U.hudTop, U.bodyFontSize, U.textColor);
    } else {
      textAt(ctx, CONFIG.players.slots[i].label + '  ----', x, U.hudTop, U.bodyFontSize, U.dimTextColor);
    }
  }
}

/* ---- Session 1 debug readout (temporary; the real HUD is Session 8) ---- */
function drawDebug(game) {
  if (!CONFIG.debug.enabled) return;
  const D = CONFIG.debug;
  const ctx = game.ctx;
  const lines = [
    'STATE ' + game.state + '   FPS ' + game.fps.toFixed(0) +
      '   TICK ' + game.tickCount + '   SIM ' + game.simTime.toFixed(1) + 's',
  ];
  const monster = game.entities.ofType(Monster)[0];
  if (monster) {
    lines.push(
      monster.type.name + '  x ' + monster.x.toFixed(1) + '  y ' + monster.y.toFixed(1) +
      '  vx ' + monster.vx.toFixed(0) + '  vy ' + monster.vy.toFixed(0) +
      '  ' + monster.stance + '/' + monster.animState + '  face ' + (monster.facing > 0 ? 'R' : 'L') +
      '  ON ' + (monster.attached ? 'BLDG' + monster.attached.index : '—') +
      '  DMG ' + monster.damageTaken + (monster.lastDamageSource ? '/' + monster.lastDamageSource : '')
    );
    lines.push(game.crossing.readout);
  }
  // Session 3 readout: per-building structure %, state, and who owns the
  // collapse. Goes away with the rest of the debug strip in Session 8.
  if (game.buildings.length) {
    const parts = [];
    for (const b of game.buildings) {
      const tag = b.isRubble ? 'RUB' : (b.isShaking ? 'SHK' : Math.round(b.structureFraction * 100) + '%');
      parts.push('B' + b.index + ' ' + tag);
    }
    const owned = game.collapseEvents.map(function (e) {
      return 'B' + e.buildingIndex + '←' + (e.causedBy ? e.causedBy.type.initial + '/' + e.causeKind : 'NONE');
    });
    lines.push(parts.join('  ') + (game.dayCleared() ? '   DAY CLEAR' : ''));
    if (owned.length) lines.push('COLLAPSE ' + owned.join('  '));
  }
  lines.push('MOVE A/D  CLIMB W/S  JUMP G  PUNCH F   (P2 arrows + . /)');
  for (let i = 0; i < lines.length; i++) {
    textAt(ctx, lines[i], D.x, D.y + i * D.lineHeight, D.fontSize, D.color);
  }
}

/**
 * Frame-rate-independence check (SESSION-PLAN Session 1 success criteria):
 * times how long P1 takes to walk from the left bound to the right bound.
 * The number must be identical at 60 Hz and 144 Hz.
 */
function updateCrossingTimer(game, dt) {
  const c = game.crossing;
  const monster = game.entities.ofType(Monster)[0];
  if (!monster) return;
  const W = CONFIG.world;
  const atLeft = monster.x <= W.leftBound + monster.w / 2 + 0.5;
  const atRight = monster.x >= W.rightBound - monster.w / 2 - 0.5;

  if (atLeft) { c.running = true; c.time = 0; }
  else if (c.running) {
    c.time += dt;
    if (atRight) {
      c.running = false;
      c.last = c.time;
    }
  }
  c.readout = 'CROSS ' + (c.running ? c.time.toFixed(3) + ' (running)'
    : (c.last === null ? '— hold A to the left wall, then D' : c.last.toFixed(3) + 's'));
}


/* ==========================================================================
   00-core-loop — game state machine (10-architecture §11.2)

   BOOT → TITLE → CHARACTER_SELECT → PLAY, with the later states stubbed.
   Every transition goes through Game.setState so there's exactly one place
   that knows the flow. Run-level data (players, scores, day index) lives on
   Game and survives state changes.
   ========================================================================== */
const GameState = {
  BOOT: 'BOOT',
  TITLE: 'TITLE',
  CHARACTER_SELECT: 'CHARACTER_SELECT',
  DAY_INTRO: 'DAY_INTRO',        // stub — Session 9
  PLAY: 'PLAY',
  DAY_CLEAR: 'DAY_CLEAR',        // stub — Session 9
  GAME_OVER: 'GAME_OVER',        // stub — Session 9 (continue window)
};

const MONSTER_TYPE_IDS = Object.keys(CONFIG.monsterTypes);

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.input = new InputManager(CONFIG.players.slots);
    this.entities = new EntityManager();
    this.buildings = [];          // query list for traversal; see spawnBuildings

    /* 02 §3.3 / 05-scoring §6 — one record per collapse, in the order they
       happened, each carrying the monster that caused it (or null for a
       third-party collapse). This is the attribution the 2,500-point bonus
       depends on; Session 8's ScoreSystem is what drains it. Reset per day. */
    this.collapseEvents = [];

    // Run-level data, persisted across state transitions (§11.2).
    this.players = [];
    for (let i = 0; i < CONFIG.players.maxPlayers; i++) {
      this.players.push({
        index: i,
        label: CONFIG.players.slots[i].label,
        joined: i < CONFIG.players.activeAtStart,
        monsterTypeId: MONSTER_TYPE_IDS[i % MONSTER_TYPE_IDS.length],
        confirmed: false,
        score: 0,                 // ScoreSystem takes this over in Session 8
      });
    }
    this.dayIndex = 0;            // LevelData drives this from Session 9

    this.state = null;
    this.stateTime = 0;
    this.simTime = 0;
    this.tickCount = 0;
    this.fps = 0;

    this.crossing = { running: false, time: 0, last: null, readout: '' };

    this.setState(GameState.BOOT);
  }

  setState(next) {
    this.state = next;
    this.stateTime = 0;
    const handler = this.handlers[next];
    if (handler && handler.enter) handler.enter(this);
  }

  update(dt) {
    this.input.poll();
    this.stateTime += dt;
    this.simTime += dt;
    this.tickCount++;
    const handler = this.handlers[this.state];
    if (handler && handler.update) handler.update(this, dt);
  }

  render(alpha) {
    const handler = this.handlers[this.state];
    if (handler && handler.draw) handler.draw(this, alpha);
    drawDebug(this);
  }

  /** Players who are in the run right now. Never assumes 1, 2 or 3. */
  activePlayers() {
    return this.players.filter(function (p) { return p.joined; });
  }

  /** Spawn one monster per confirmed player (02 §3.1: they start on the street). */
  spawnMonsters() {
    const active = this.activePlayers();
    for (let i = 0; i < active.length; i++) {
      const p = active[i];
      const x = CONFIG.monster.spawnX + i * CONFIG.monster.spawnSpacing;
      this.entities.add(new Monster(p.monsterTypeId, p.index, x));
    }
  }

  /**
   * 02 §3.2 — lay the day's buildings across the street. Hardcoded from
   * CONFIG.buildings.dayLayout; Session 9 swaps this for LevelData.
   * `this.buildings` is the query list traversal reads every tick — cheaper
   * than filtering the whole entity list per monster per stance check.
   */
  spawnBuildings() {
    const B = CONFIG.buildings;
    this.buildings = [];
    let x = B.startX;
    for (let i = 0; i < B.dayLayout.length; i++) {
      const spec = B.dayLayout[i];
      const building = new Building(x, spec.cols, spec.rows, spec.palette, i);
      this.buildings.push(building);
      this.entities.add(building);
      x += spec.cols * B.cellWidth + spec.gapAfter;
    }
  }

  /** Buildings first so monsters draw in front of them (the street is a lane). */
  startDay() {
    this.entities.clear();
    this.collapseEvents = [];
    this.spawnBuildings();
    this.spawnMonsters();
  }

  /** §7 day clear: every building on the board is rubble. Session 9 acts on it. */
  dayCleared() {
    return this.buildings.length > 0 && this.buildings.every(function (b) { return b.isRubble; });
  }

  /**
   * 10-architecture §11.3 — the spatial queries buildings needed, and no more.
   * Linear scans over ~5 buildings; a grid would be premature.
   */

  /**
   * The building face `monster` could grab right now: enough of its body is
   * over the frontage, and its feet are below that building's roof line (at
   * or above the roof line it belongs on the roof, not on the face).
   * Returns the best overlap so a monster straddling two buildings grabs the
   * one it is most over. `ignore` skips a face just jumped off.
   */
  faceTargetFor(monster, ignore) {
    let best = null;
    let bestOverlap = CONFIG.monster.grabMinOverlap;
    for (let i = 0; i < this.buildings.length; i++) {
      const b = this.buildings[i];
      if (!b.standing || b === ignore) continue;
      if (monster.y <= b.top) continue;
      const overlap = b.overlapWidth(monster.left, monster.right);
      if (overlap >= bestOverlap) { best = b; bestOverlap = overlap; }
    }
    return best;
  }

  /**
   * The roof a falling monster crossed this step, if any. Swept against the
   * feet's previous and current y so no fall speed can tunnel through a roof.
   * Buildings never overlap horizontally, so at most one can match.
   */
  roofLandingAt(x, prevFeetY, feetY) {
    for (let i = 0; i < this.buildings.length; i++) {
      const b = this.buildings[i];
      if (!b.standing) continue;
      if (x < b.left || x > b.right) continue;
      if (prevFeetY <= b.top && feetY >= b.top) return b;
    }
    return null;
  }

  /**
   * 02 §3.2 — the wall section a punch rips out. Takes the punch's target rect
   * (Monster.punchTargetRect) and returns { building, col, row } or null.
   *
   * The cell picked is the still-standing cell the rect covers the most of,
   * tie-broken toward `facing`. Already-GONE sections are skipped rather than
   * absorbing the punch, which is what makes "repeated hits destroy successive
   * sections" (§3.2) work — a punch thrown at a hole chews into the section
   * behind it instead of hitting air. Buildings never overlap horizontally, so
   * at most one is ever a candidate.
   */
  cellTargetFor(rect, facing) {
    const B = CONFIG.buildings;
    const dir = facing >= 0 ? 1 : -1;
    let best = null, bestArea = 0, bestX = 0;

    for (let i = 0; i < this.buildings.length; i++) {
      const b = this.buildings[i];
      if (!b.standing) continue;
      if (rect.x + rect.w <= b.left || rect.x >= b.right) continue;
      if (rect.y + rect.h <= b.top || rect.y >= b.bottom) continue;

      const c0 = clamp(Math.floor((rect.x - b.left) / B.cellWidth), 0, b.cols - 1);
      const c1 = clamp(Math.floor((rect.x + rect.w - b.left) / B.cellWidth), 0, b.cols - 1);
      const r0 = clamp(Math.floor((rect.y - b.top) / B.cellHeight), 0, b.rows - 1);
      const r1 = clamp(Math.floor((rect.y + rect.h - b.top) / B.cellHeight), 0, b.rows - 1);

      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (b.cells[r][c].state === CellState.GONE) continue;
          const cr = b.cellRect(c, r);
          const ox = Math.min(rect.x + rect.w, cr.x + cr.w) - Math.max(rect.x, cr.x);
          const oy = Math.min(rect.y + rect.h, cr.y + cr.h) - Math.max(rect.y, cr.y);
          if (ox <= 0 || oy <= 0) continue;

          const area = ox * oy;
          const cx = cr.x + cr.w / 2;
          const better = area > bestArea + 1e-6 ||
            (best !== null && Math.abs(area - bestArea) <= 1e-6 && cx * dir > bestX * dir);
          if (better) { best = { building: b, col: c, row: r }; bestArea = area; bestX = cx; }
        }
      }
    }
    return best;
  }
}

/* ---- State handlers -------------------------------------------------- */
Game.prototype.handlers = {

  [GameState.BOOT]: {
    update(game, dt) {                                   // eslint-disable-line no-unused-vars
      if (game.stateTime >= CONFIG.ui.bootDuration) game.setState(GameState.TITLE);
    },
    draw(game) {
      const ctx = game.ctx;
      ctx.fillStyle = CONFIG.view.skyColor;
      ctx.fillRect(0, 0, CONFIG.view.width, CONFIG.view.height);
      textAt(ctx, 'BOOT', CONFIG.view.width / 2, CONFIG.view.height / 2,
        CONFIG.ui.headingFontSize, CONFIG.ui.dimTextColor, 'center');
    },
  },

  /* 08-hud-ui: minimal title / attract screen for Phase 1. */
  [GameState.TITLE]: {
    update(game) {
      if (game.input.anyPressed('start')) game.setState(GameState.CHARACTER_SELECT);
    },
    draw(game) {
      const ctx = game.ctx;
      const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
      drawStreet(ctx);
      textAt(ctx, 'RAMPAGE', V.width / 2, L.titleY, U.titleFontSize, U.accentColor, 'center');
      textAt(ctx, 'PHASE 1 — FAITHFUL REPLICA', V.width / 2, L.subtitleY, U.bodyFontSize, U.textColor, 'center');
      if (blinkOn(game.stateTime)) {
        textAt(ctx, 'PRESS START  —  P1: F / G / ENTER', V.width / 2, L.startPromptY,
          U.headingFontSize, U.textColor, 'center');
      }
      textAt(ctx, 'GEORGE   LIZZIE   RALPH', V.width / 2, L.rosterY, U.bodyFontSize, U.dimTextColor, 'center');
    },
  },

  /* 08-hud-ui: character select. One column per player slot, up to 3;
     unjoined slots stay visible and reserved. */
  [GameState.CHARACTER_SELECT]: {
    enter(game) {
      for (const p of game.players) {
        p.confirmed = false;
        p.cursor = MONSTER_TYPE_IDS.indexOf(p.monsterTypeId);
      }
    },
    update(game) {
      const active = game.activePlayers();
      for (const p of active) {
        const input = game.input.getPlayer(p.index);
        if (p.confirmed) continue;
        if (input.leftPressed)  p.cursor = (p.cursor + MONSTER_TYPE_IDS.length - 1) % MONSTER_TYPE_IDS.length;
        if (input.rightPressed) p.cursor = (p.cursor + 1) % MONSTER_TYPE_IDS.length;
        p.monsterTypeId = MONSTER_TYPE_IDS[p.cursor];
        if (input.punchPressed || input.jumpPressed) p.confirmed = true;
      }
      const allReady = active.length > 0 && active.every(function (p) { return p.confirmed; });
      if (allReady) game.setState(GameState.PLAY);
    },
    draw(game) {
      const ctx = game.ctx;
      const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
      drawStreet(ctx);
      textAt(ctx, 'SELECT YOUR MONSTER', V.width / 2, L.selectHeadingY, U.headingFontSize, U.accentColor, 'center');
      textAt(ctx, 'ALL THREE PLAY IDENTICALLY — 1986 ARCADE', V.width / 2, L.selectNoteY,
        U.smallFontSize, U.dimTextColor, 'center');

      const totalW = MONSTER_TYPE_IDS.length * U.cardWidth + (MONSTER_TYPE_IDS.length - 1) * U.cardGap;
      const startX = (V.width - totalW) / 2;
      for (let i = 0; i < MONSTER_TYPE_IDS.length; i++) {
        const type = CONFIG.monsterTypes[MONSTER_TYPE_IDS[i]];
        const x = startX + i * (U.cardWidth + U.cardGap);
        const selectedBy = game.activePlayers().filter(function (p) { return p.cursor === i; });

        ctx.fillStyle = CONFIG.view.horizonColor;
        ctx.fillRect(x, U.cardTop, U.cardWidth, U.cardHeight);
        if (selectedBy.length) {
          ctx.strokeStyle = selectedBy.some(function (p) { return p.confirmed; }) ? U.accentColor : U.textColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, U.cardTop + 0.5, U.cardWidth - 1, U.cardHeight - 1);
        }

        // Placeholder portrait: the same rig every monster uses in-game.
        const bw = CONFIG.monster.width, bh = CONFIG.monster.height;
        const portraitY = U.cardTop + L.cardPortraitOffsetY;
        ctx.fillStyle = type.bodyColor;
        ctx.fillRect(x + U.cardWidth / 2 - bw / 2, portraitY, bw, bh);
        ctx.fillStyle = type.headColor;
        ctx.fillRect(x + U.cardWidth / 2 - bw / 2, portraitY, bw, bh * CONFIG.art.headHeightFrac);

        textAt(ctx, type.name, x + U.cardWidth / 2, U.cardTop + L.cardNameOffsetY,
          U.bodyFontSize, U.textColor, 'center');
        textAt(ctx, type.blurb, x + U.cardWidth / 2, U.cardTop + L.cardBlurbOffsetY,
          U.smallFontSize, U.dimTextColor, 'center');
        textAt(ctx, type.punchFlavor, x + U.cardWidth / 2, U.cardTop + L.cardFlavorOffsetY,
          U.smallFontSize, U.dimTextColor, 'center');
        const tag = selectedBy.map(function (p) { return p.label + (p.confirmed ? '*' : ''); }).join(' ');
        textAt(ctx, tag, x + U.cardWidth / 2, U.cardTop + L.cardTagOffsetY,
          U.smallFontSize, U.accentColor, 'center');
      }

      if (blinkOn(game.stateTime)) {
        textAt(ctx, 'A / D TO CHOOSE   F OR G TO CONFIRM', V.width / 2, L.selectHintY,
          U.bodyFontSize, U.textColor, 'center');
      }
      drawHudStrip(game);
    },
  },

  /* Stub — Session 9 (day headline interstitial). */
  [GameState.DAY_INTRO]: {
    update(game) { game.setState(GameState.PLAY); },
    draw(game) { drawStubScreen(game, 'DAY INTRO', 'SESSION 9'); },
  },

  [GameState.PLAY]: {
    enter(game) {
      game.startDay();
      game.crossing = { running: false, time: 0, last: null, readout: '' };
    },
    update(game, dt) {
      /* Update order per 10-architecture §11.1. Sessions 2–9 fill in the
         missing steps in place: monsters → enemies/hazards → projectiles →
         buildings → collisions → eating/pickups → score/health → day-clear. */
      game.entities.update(dt, game);
      updateCrossingTimer(game, dt);
    },
    draw(game, alpha) {
      const ctx = game.ctx;
      drawStreet(ctx);
      game.entities.draw(ctx, alpha);

      if (CONFIG.debug.showPunchBox) {
        for (const monster of game.entities.ofType(Monster)) {
          if (!monster.isPunching) continue;
          // The wider rect is what actually picks the cell (§3.2); the yellow
          // box is just the fist the art draws.
          const target = monster.punchTargetRect();
          ctx.fillStyle = CONFIG.debug.punchTargetColor;
          ctx.fillRect(target.x, target.y, target.w, target.h);
          const box = monster.getPunchBox();
          ctx.fillStyle = CONFIG.debug.punchBoxColor;
          if (box) ctx.fillRect(box.x, box.y, box.w, box.h);
        }
      }
      drawHudStrip(game);
    },
  },

  /* Stub — Session 9 (all buildings rubble → headline → next day). */
  [GameState.DAY_CLEAR]: {
    draw(game) { drawStubScreen(game, 'DAY CLEAR', 'SESSION 9'); },
  },

  /* Stub — Session 9 (defeat walk-off + continue prompt). */
  [GameState.GAME_OVER]: {
    draw(game) { drawStubScreen(game, 'GAME OVER', 'SESSION 9'); },
  },
};

function drawStubScreen(game, title, session) {
  const ctx = game.ctx;
  const V = CONFIG.view, U = CONFIG.ui, L = CONFIG.ui.layout;
  drawStreet(ctx);
  textAt(ctx, title, V.width / 2, V.height / 2 + L.stubTitleOffsetY,
    U.headingFontSize, U.textColor, 'center');
  textAt(ctx, 'NOT IMPLEMENTED — ' + session, V.width / 2, V.height / 2 + L.stubNoteOffsetY,
    U.bodyFontSize, U.dimTextColor, 'center');
}


/* ==========================================================================
   10-architecture §11.1 — main loop

     accumulate elapsed time
     while accumulator >= FIXED_DT:  update(FIXED_DT); accumulator -= FIXED_DT
     render(interpolationAlpha)

   Simulation advances in fixed CONFIG.loop.fixedDt steps regardless of the
   display refresh rate, so a 144 Hz tab runs the exact same simulation as a
   60 Hz one; only the number of interpolated render passes differs.
   ========================================================================== */
function resizeCanvas(canvas) {
  const V = CONFIG.view;
  const scale = clamp(
    Math.floor(Math.min(window.innerWidth / V.width, window.innerHeight / V.height)),
    1, V.maxScale
  );
  canvas.style.width = (V.width * scale) + 'px';
  canvas.style.height = (V.height * scale) + 'px';
}

function boot() {
  const canvas = document.getElementById('game');
  canvas.width = CONFIG.view.width;
  canvas.height = CONFIG.view.height;

  const game = new Game(canvas);
  game.input.attach(window);

  resizeCanvas(canvas);
  window.addEventListener('resize', function () { resizeCanvas(canvas); });

  let accumulator = 0;
  let lastTime = performance.now() / 1000;

  function frame(nowMs) {
    const now = nowMs / 1000;
    const frameTime = Math.min(now - lastTime, CONFIG.loop.maxFrameTime);
    lastTime = now;

    if (frameTime > 0) {
      game.fps = lerp(1 / frameTime, game.fps, CONFIG.debug.fpsSmoothing);
    }

    accumulator += frameTime;
    while (accumulator >= CONFIG.loop.fixedDt) {
      game.update(CONFIG.loop.fixedDt);
      accumulator -= CONFIG.loop.fixedDt;
    }

    game.render(accumulator / CONFIG.loop.fixedDt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Debug handle — inspect state from the console, and drive headless tests.
  window.RAMPAGE = {
    CONFIG, game, GameState, Entity, EntityManager, Monster, InputManager, Stance,
    Building, CellState, BuildingState, DustPuff, cellStateForHp,
  };
  return game;
}

boot();
</script>
