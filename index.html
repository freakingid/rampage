<div id="wrap"><canvas id="game"></canvas></div>
<script>
'use strict';

/* ==========================================================================
   RAMPAGE — Phase 1 clone (1986 Bally Midway arcade original)
   Single self-contained file. Sections below mirror docs/design/*.md 1:1.

     CONFIG .......................... 10-architecture.md §11.4
     10-architecture — utilities
     10-architecture — Entity base class            §11.3
     10-architecture — EntityManager                §11.3
     10-architecture — InputManager                 §11.3
     02-movement-destruction ......... Building + cell grid, damage & collapse
                                       (§3.2, §3.3)
     09-art-audio .................... DustPuff (collapse particle)
     03-eating-health ................ Pickup (food & hazards revealed by
                                       punching cells)                    §4.2, §4.3
     01-monsters ..................... Human (civilians, designated victims)
                                       §2.3, §4.2
     04-military-hazards ............. Enemy base, Guardsman, Helicopter,
                                       Projectile (bullets/dynamite/bombs/
                                       demolition charges)              §5.1
     01-monsters ..................... Monster class (all three types identical)
     02-movement-destruction ......... movement/traversal (§3.1) — inside Monster
     03-eating-health ................ energy bar, applyDamage/heal, defeat &
                                       walk-off, knock-off — inside Monster §4.1
     07-multiplayer .................. monster-vs-monster punch, cannibalism —
                                       inside Monster (§8.2); join-in-progress
                                       and the shared roster — inside Game (§8.1)
     09-art-audio .................... placeholder rectangle art
     08-hud-ui ....................... title, character select, HUD strip
     00-core-loop .................... game state machine                §11.2
     10-architecture — main loop (fixed timestep + interpolated render)  §11.1

   Session 1 scope: loop, state machine, entity model, input, one controllable
   monster on an empty street.
   Session 2 scope: Building entity (grid of destructible cells), a hardcoded
   row of buildings, climbing/cling, rooftop walking, jump-to-grab. Cells carry
   damage state but nothing damages them yet — that's Session 3.
   Session 3 scope: destruction & collapse. Punches damage cells INTACT →
   CRACKED → HOLE → GONE from the ground and from a face; buildings enter
   SHAKING and then collapse to rubble with a dust puff; roof-drop collapse;
   fall damage for anyone still on the building; collapse attribution
   (`causedBy`) for the §6 2,500-point rule.
   Session 4 scope: the health economy. A per-monster energy bar, every
   damage source routed through Monster.applyDamage(source); defeat at zero
   energy reverts to a human placeholder and walks off screen; Pickup
   entities (food, bad items, live electrical, wall dynamite with its fuse,
   photographer/bather knock-off hazards) revealed when a punch opens a cell.
   Session 5 scope: civilians and designated victims. A Human entity with a
   role flag (civilian / designated victim) appears in windows (sharing the
   punch-reveals-an-occupant mechanism Session 4 built for Pickup) and flees
   across the street. Punching one eats it for health, same single grab/eat
   action Pickup already uses — except a monster's own designated victim
   (woman/George, middle-aged man/Lizzie, businessman/Ralph) is grabbed and
   held instead, struggles free after a random time, and can then be eaten
   like any civilian. While held, `Monster.isHoldingVictim` is the hook
   Session 6's Guardsmen read to stop firing.
   Session 6 scope: the two military threats present every day. `Enemy`
   base class (a `behavior` field, nothing else shared) plus `Guardsman`
   (window variant pops out to shoot/throw dynamite, edible for health;
   street variant runs to a building's base and plants a demolition charge)
   and `Helicopter` (early strafing-dive behavior and later bombing-run
   behavior, both implemented, picked per-instance by a CONFIG difficulty
   flag). One `Projectile` class covers bullets, thrown dynamite, dropped
   bombs and planted demolition charges. Charges and bombs damage buildings
   with `byMonster` null, so any collapse they cause is never credited to a
   player (`Building.causedBy` stays null — Session 3's seam). A
   `SpawnDirector` (three cadence timers on `Game`) keeps a steady trickle
   of both threats going. Session 5's `HumanRole.WINDOW_SOLDIER` placeholder
   is removed — the window Guardsman is an `Enemy` subclass instead, per
   10-architecture.md §11.3.
   Session 10 scope: local multiplayer (07-multiplayer §8). A second player
   on its own key set, sharing one screen and one camera; monster-vs-monster
   punches that deal real damage and force the target to drop a held victim;
   competition for every pickup (first punch wins, which already fell out of
   the per-entity consume guards); cannibalism of a defeated rival's human
   form for points and health; and join-in-progress for any slot that isn't
   in the run yet. Nothing in this session counts to two: `activeAtStart` is
   the only number that decides how many players a run opens with, and every
   system that had a "the monster" assumption left in it (the debug readout,
   the crossing timer, the continue window's "the monster walked off" exit)
   became "each monster" instead of gaining a second branch.
   ========================================================================== */


/* ==========================================================================
   CONFIG — every tunable number in the game lives here.
   (10-architecture.md §11.4: "Centralize the [INFERRED] tuning values ...
   into one CONFIG/balance object.")

   [INFERRED] warning: the GDD documents no numeric values for movement,
   jump arc, or punch cadence (13-inferred-items.md #3). Everything in
   `monster` below is a first-pass guess tuned to feel, not a measured
   arcade value. Session 12 dials these in.
   ========================================================================== */
const CONFIG = {

  /* ---- Display (09-art-audio.md, 08-hud-ui.md) ------------------------- */
  view: {
    width: 512,               // logical playfield px (MCR-3-ish proportions)
    height: 384,
    maxScale: 4,              // cap on integer upscale to the window
    skyColor: '#141b2e',
    horizonColor: '#1e2740',
    horizonY: 300,            // where the backdrop meets the street
    streetColor: '#33384a',
    curbColor: '#4d5468',
    curbHeight: 4,
    laneColor: '#3d4358',
    laneY: 362,
    laneDashWidth: 18,
    laneDashGap: 14,
    laneDashHeight: 2,
  },

  /* ---- Main loop (10-architecture.md §11.1) ---------------------------- */
  loop: {
    fixedDt: 1 / 60,          // simulation step, seconds
    maxFrameTime: 0.25,       // clamp after a tab-out; prevents death spiral
  },

  /* ---- World / street (02-movement-destruction.md §3.1) ---------------- */
  world: {
    groundY: 344,             // y of the street surface (monster feet rest here)
    leftBound: 6,             // monsters cannot walk past these
    rightBound: 506,
  },

  /* ---- Monster (01-monsters.md §2.1) -----------------------------------
     ONE set of values for ALL THREE monsters. The 1986 original gives George,
     Lizzie and Ralph identical speed, jump, punch and health; per-monster
     stats are a Rampage: World Tour (1997) thing and are out of scope.
     Do not add per-type stat overrides here.                               */
  monster: {
    width: 26,
    height: 46,
    walkSpeed: 84,            // px/sec, ground and rooftop
    airControl: 0.9,          // fraction of walkSpeed usable while airborne [INFERRED]
    jumpSpeed: 270,           // initial upward px/sec
    gravity: 900,             // px/sec^2
    punchDuration: 0.20,      // s, full punch animation
    punchCooldown: 0.08,      // s, before another punch may start
    punchExtendFraction: 0.4, // portion of the punch spent extending
    punchReach: 18,           // px in front of the body the fist covers
    punchBoxHeight: 22,
    punchBoxOffsetY: 10,      // px down from the top of the monster
    punchDamage: 1,           // cell HP a connecting punch removes [INFERRED]
                              // 1 per punch against cellHp 3 = one damage
                              // state per punch. See Monster.resolvePunch.
    walkCycleTime: 0.36,      // s per full two-step walk cycle at walkSpeed
    spawnX: 120,              // P1 spawn; later slots offset by spawnSpacing
    spawnSpacing: 60,

    /* -- Climbing / cling (02-movement-destruction.md §3.1) --------------
       [INFERRED] The GDD says "up/down climbs it; the monster clings to the
       wall" and nothing about speed or about moving sideways on a face.
       Everything below is a first-pass guess (13-inferred-items.md #13/#14). */
    climbSpeed: 60,           // px/s up or down a building face
    climbSideSpeed: 60,       // px/s sideways along a face [INFERRED — see #14]
    climbCycleTime: 0.5,      // s per full climb animation cycle
    grabMinOverlap: 10,       // px of body-over-face needed to grab a face
    grabLockout: 0.18,        // s after jumping off a face before it re-grabs
  },

  /* ---- Health / energy (03-eating-health.md §4.1) -----------------------
     "Each monster has a single energy bar. Enemy attacks and hazards drain
     it; eating refills it. When the bar empties, the monster reverts to its
     (naked) human form and walks off the side of the screen."

     Every source is routed through Monster.applyDamage(amount, source) /
     Monster.heal(amount, source) — see those methods. `damage` below covers
     the §4.1 sources that have no Pickup/item of their own: nothing calls
     most of these yet, but the name and the number are ready for the
     session that adds the thing that fires them, the same way Session 3
     left `causedBy: null` ready for Session 6's demolition charges.
     [INFERRED] every value here — 13-inferred-items.md #2.                 */
  health: {
    maxEnergy: 100,
    walkOffSpeed: 70,        // px/s during the post-defeat walk-off
    knockOffSpeedX: 130,     // px/s outward pop — dynamite blast / flash / splash
    knockOffSpeedY: -230,    // px/s upward pop, same three sources

    damage: {
      fall: 30,              // §3.3 collapse fall damage — wired since Session 3
      bullet: 10,             // Session 6 — Guardsman rifle, wired this session
      dynamiteThrown: 20,     // Session 6 — Guardsman-thrown dynamite, wired this session
      bomb: 25,               // Session 6 — helicopter bombing run, wired this session
                              // [INFERRED — new this session, 13-inferred-items.md #33]
      shell: 15,              // Session 7 — police car shell, wired this session
      tankShell: 25,          // Session 7 — tank shell, wired this session
      lightning: 20,          // Session 7 — lightning cloud bolt, wired this session
                              // [INFERRED — new this session, 13-inferred-items.md #36]
      underwaterPerSecond: 8, // Session 9 — river/pier levels, not called yet
      monsterPunch: 8,        // Session 10 — 07-multiplayer §8.2 "monsters can punch
                              // each other, dealing real damage", wired this session.
                              // At maxEnergy 100 that is ~13 connecting punches to
                              // down a full-health rival — deliberately slower than
                              // any military source, so griefing another player is a
                              // real investment rather than a quick kill. [INFERRED
                              // — §8.2 confirms "real damage", never an amount.]
    },

    /* -- 07-multiplayer §8.2 cannibalism ---------------------------------
       "When a monster's energy is depleted and it reverts to human form,
       another player can eat that human before it walks off screen (points
       + heal)." The points side has a CONFIG.scoring row; this is the heal
       side. [INFERRED — §8.2 confirms a heal, never an amount. Set above
       CONFIG.humans.civilianHeal (15) because a whole rival monster is a
       bigger meal than a fleeing pedestrian, and because the act costs the
       eater a trip across the street into someone else's walk-off.]        */
    cannibalHeal: 25,

    /* -- Knockback (§5.1: tank/police "large knockback ... can knock a
       monster off a building or across the screen") — new in Session 7.
       Generalizes Session 4's fixed knockOff pop into a directional shove:
       Monster.applyKnockback pushes away from wherever the shell came from
       rather than away from a building, so a shell can clear a monster off
       a roof/face regardless of which side it was fired from. `duration`
       is Monster.launchAir's knockbackTimer — long enough for the shove to
       actually carry the monster clear of a building before normal
       input-driven air control resumes; also now backs knockOff's existing
       dynamite/photographer/bather pop, which had the same gap (a forced
       vx was being overwritten by air control the very next tick and never
       travelled anywhere — 13-inferred-items.md #37 covers both).
       [INFERRED — no speed/duration is documented for either.]             */
    knockback: {
      shellSpeedX: 260,       // px/s outward — comparable to jumpSpeed (270),
      shellSpeedY: -260,      // enough to clear a building's footprint
      duration: 0.35,         // s before air control resumes
    },
  },

  /* ---- Pickups (03-eating-health.md §4.2, §4.3) -------------------------
     Food, bad items and timed hazards revealed when a punch opens a cell to
     HOLE. `spawnCycle` is a deterministic round-robin keyed off cell
     position (same trick as Building.windowLit) rather than RNG, so a
     reload reveals the same items in the same windows — every opened cell
     gets exactly one entry. [INFERRED] both the "every window has something"
     density and the cycle order — 13-inferred-items.md #21.

     `heal` (food) and `damage` (bad/electrical/dynamite) apply the moment a
     monster punches an already-open cell — see Monster.resolvePunch and
     Building.pickupAt. `fuse` items (dynamite, photographer, bather) also
     carry `fuseDamage`/`fuseKnockOff`, applied instead if nobody eats them
     in time — see Pickup.trigger. `category: 'hazard'` items do nothing if
     eaten first, which is the whole point of eating them fast.            */
  pickups: {
    spawnCycle: [
      'TURKEY', 'POISON', 'HAMBURGER', 'CACTUS', 'MILK', 'LIT_BULB', 'FRUIT',
      'DYNAMITE', 'TOAST', 'TV_ON', 'PHOTOGRAPHER', 'TOASTER_NO_TOAST',
      'BATHER', 'NEON_SIGN', 'TOILET', 'EMPTY_BATHTUB',
      'MANHOLE_COVER', 'FLOWER_POT', 'SAFE',
    ],
    definitions: [
      // -- Food (§4.2): heals on eating. --------------------------------
      { id: 'TURKEY',          category: 'food', heal: 25, color: '#c9863f' },
      { id: 'HAMBURGER',       category: 'food', heal: 20, color: '#a5652f' },
      { id: 'MILK',            category: 'food', heal: 15, color: '#eef1f5' },
      { id: 'FRUIT',           category: 'food', heal: 12, color: '#7fae3a' },
      { id: 'TOAST',           category: 'food', heal: 10, color: '#d1a24a' },
      // -- Bad items (§4.3): hurt on eating. ------------------------------
      { id: 'POISON',          category: 'bad', damage: 30, color: '#5a2f6b' },
      { id: 'CACTUS',          category: 'bad', damage: 12, color: '#3f7a3f' },
      // -- Live electrical (§4.3): shock on grab. -------------------------
      { id: 'LIT_BULB',         category: 'electrical', damage: 18, color: '#e8d97a' },
      { id: 'TV_ON',            category: 'electrical', damage: 18, color: '#8aa0c0' },
      { id: 'TOASTER_NO_TOAST', category: 'electrical', damage: 18, color: '#9a9a9a' },
      { id: 'NEON_SIGN',        category: 'electrical', damage: 18, color: '#e0508a' },
      // -- Wall dynamite (§4.3): "~2-3 seconds to leave before it blasts
      //    you off the building; eating it just hurts you."
      { id: 'DYNAMITE', category: 'dynamite', damage: 16, fuse: 2.5,
        fuseDamage: 26, fuseKnockOff: true, color: '#c0392b' },
      // -- Timed hazards (§4.3): eat them before the flash/splash, or it
      //    knocks the monster off the building. [INFERRED] no health cost
      //    either way, fuse timing — 13-inferred-items.md #21/#22.
      { id: 'PHOTOGRAPHER', category: 'hazard', fuse: 2.0,
        fuseDamage: 10, fuseKnockOff: true, color: '#2c3e50' },
      { id: 'BATHER', category: 'hazard', fuse: 2.0,
        fuseDamage: 10, fuseKnockOff: true, color: '#3498db' },
      // -- Junk (§4.3): "no benefit if eaten" — no health effect either way.
      { id: 'TOILET', category: 'neutral', color: '#dfe6ee' },
      { id: 'EMPTY_BATHTUB', category: 'neutral', color: '#d8dee6' },
      // -- Environmental weapons (§4.3/§5.1/§6) — new in Session 7. "Can be
      //    knocked loose and dropped onto ground and air units." A connecting
      //    punch doesn't eat these (no heal/damage); Pickup.consume hands a
      //    'weapon'-category item off to Projectile.spawnDroppedObject
      //    instead, which falls straight down and destroys the first Tank/
      //    Police/Helicopter it reaches. [INFERRED throughout — the GDD names
      //    the three items and the "knocked loose and dropped" mechanic but
      //    gives no kinematics; 13-inferred-items.md #40.]
      { id: 'MANHOLE_COVER', category: 'weapon', color: '#5a5a5a' },
      { id: 'FLOWER_POT',    category: 'weapon', color: '#b5651d' },
      { id: 'SAFE',          category: 'weapon', color: '#2e3440' },
    ],
  },

  /* ---- Humans (01-monsters.md §2.3, 03-eating-health.md §4.2) -----------
     "Punching buildings exposes food and civilians inside" (00-core-loop
     §1), and eating one heals like any other food item. Each monster also
     has one "designated victim" (§2.3) it can pluck from a window and
     hold — while held, the victim struggles free after a random time and
     can then be eaten like any other civilian.

     [INFERRED] The GDD already gives punch a single grab/eat action for
     Pickup (§4.3, 13-inferred-items.md #24); Human reuses that same rule
     rather than inventing a separate "swat for nothing" outcome the GDD
     never describes. See 13-inferred-items.md #27.                      */
  humans: {
    width: 12,
    height: 20,        // fits inside one 22px building cell without spilling
                       // into the row above (CONFIG.buildings.cellHeight)
    civilianHeal: 15,          // eating any plain civilian, window or street
                              // [INFERRED — 13-inferred-items.md #28]
    holdOffsetX: 16,           // px in front of the monster while HELD
    holdOffsetY: 30,           // px above the monster's feet while HELD
    holdTimeMin: 3.0,          // s — random hold duration before the victim
    holdTimeMax: 6.0,          // struggles free [INFERRED — #30]

    /* Window occupancy — extends the Session 4 reveal-on-HOLE mechanism
       (CONFIG.pickups.spawnCycle) rather than replacing it. Deterministic
       cycle keyed the same way (13-inferred-items.md #21): 'ITEM' defers to
       the existing Pickup cycle, anything else names a Human type instead.
       Majority stays 'ITEM' so Session 4's pickup density still dominates.
       [INFERRED — 13-inferred-items.md #31.]                              */
    windowOccupancyCycle: [
      'ITEM', 'ITEM', 'CIVILIAN', 'ITEM', 'WOMAN', 'ITEM',
      'ITEM', 'MIDDLE_AGED_MAN', 'CIVILIAN', 'ITEM', 'BUSINESSMAN',
    ],

    /* Fleeing street civilians (00-core-loop §1: "civilians ... flee on
       the street"). [INFERRED] No proximity/AI behavior is documented, so
       Phase 1 spawns them already in flight, crossing the street once and
       despawning off the far edge — 13-inferred-items.md #28.            */
    street: {
      spawnInterval: 5.0,      // s between spawn attempts
      maxActive: 2,            // concurrent fleeing civilians
      fleeSpeed: 70,           // px/s
    },

    types: {
      CIVILIAN:        { id: 'CIVILIAN', role: 'CIVILIAN', color: '#c9a876' },
      WOMAN:           { id: 'WOMAN', role: 'DESIGNATED_VICTIM', victimOf: 'GEORGE', color: '#c9506f' },
      MIDDLE_AGED_MAN: { id: 'MIDDLE_AGED_MAN', role: 'DESIGNATED_VICTIM', victimOf: 'LIZZIE', color: '#d8c452' },
      BUSINESSMAN:     { id: 'BUSINESSMAN', role: 'DESIGNATED_VICTIM', victimOf: 'RALPH', color: '#3a3f52' },
      // Session 5 left a WINDOW_SOLDIER placeholder here for "the window
      // Guardsman might just be a Human with a role flag." Session 6
      // resolved that per 10-architecture.md §11.3: Guardsman is an Enemy
      // subclass instead (see the Guardsman class), so the placeholder is
      // removed rather than left dead — nothing ever spawned one.
    },
  },

  /* ---- Buildings (02-movement-destruction.md §3.2) ---------------------
     "A building is a vertical stack of destructible cells (a grid of
     windows/wall sections)." Cells carry state + HP from Session 2 onward so
     Session 3 only has to add the damage path, not the data model.

     Session 9 moved the day's *building list* out of here and into
     CONFIG.levels (06-levels-progression §7): a city's cols/rows/palette are
     now one data row in `CONFIG.levels.days`, and LevelData.layoutRow works
     out the x positions and inter-building gaps from the street span, so
     adding a city is content-only and never needs a code change. What stays
     here is the cell geometry every day shares.

     HEIGHT CONSTRAINT (unchanged, now enforced in code rather than by hand):
     every building must be taller than the monster's jump apex (~40 px at the
     Session 1 values) or a monster could jump off the street straight onto a
     roof — see the note in Monster.updateAir. `minRows` is that floor, and
     LevelData.layoutRow clamps every authored row up to it so a bad data row
     can't silently break traversal.                                          */
  buildings: {
    cellWidth: 22,
    cellHeight: 22,
    cellHp: 3,                // hits to take a cell INTACT→CRACKED→HOLE→GONE
                              // [INFERRED] — the damage curve is spread evenly
                              // across the states, so this stays tunable
    minRows: 3,               // 3 × 22 = 66 px, comfortably over the jump apex
    /* -- Collapse (02-movement-destruction.md §3.3) ----------------------
       [INFERRED — 13-inferred-items.md #5] The GDD is explicit that the exact
       trigger is undocumented and gives the Phase 1 model: "when total
       remaining structure drops below a threshold OR the bottom row is
       destroyed". Both numbers below are judgement calls, not measurements.

       collapseStructureFraction 0.5 — half the building's total cell HP gone
         brings it down. That's the "punch it apart anywhere" route: ~32
         connecting punches on the smallest building in the day layout.
       collapseOnBottomRowGone — the "loss of lower support" route, and
         deliberately the faster one (~18 punches on a 3-wide building, all
         reachable from the street). It is the same route the National Guard's
         demolition charges at the base take in §3.2, which is why the base
         being critical is the reading chosen here.
       roofDropStructureFraction 0.8 — §3.2 roof-drop: "weaken a building,
         then jump onto its roof". A fresh building (1.0) is never brought
         down by a landing; 20% of its structure gone is "weakened".
       shakeDuration 1.2 s — the §3.3 tell. Long enough to react and jump
         clear (a jump leaves the surface on the frame it is pressed), short
         enough that climbing down a tall face is not an escape.            */
    collapseStructureFraction: 0.5,
    collapseOnBottomRowGone: true,
    roofDropStructureFraction: 0.8,
    shakeDuration: 1.2,
    shakeAmplitude: 2,        // px of horizontal judder while SHAKING
    shakeFrequency: 18,       // judder cycles per second

    /* -- Rubble (§3.3) — a mound on the street. Phase 1 rubble is scenery:
       it does not block the street (the street is a lane, 13-inferred #15),
       cannot be climbed and cannot be landed on. Session 4 hangs exposed
       food/items off it.                                                    */
    rubbleHeight: 12,
    rubbleColor: '#4a4048',
    rubbleShadeColor: '#332c33',

    /* -- Dust puff thrown up by a collapse (§3.3, 09-art-audio) ---------- */
    dust: {
      count: 16,
      life: 1.0,              // s before a puff fades out entirely
      startSize: 5,           // px square, grows as it fades
      growth: 18,
      riseSpeed: 55,          // px/s upward
      spreadSpeed: 46,        // px/s sideways at the building's edges
      color: '206,200,186',   // rgb triple; alpha is animated
      maxAlpha: 0.55,
    },

    roofCapHeight: 4,         // drawn *below* the roof line, so feet rest on top
    roofCapOverhang: 1,
    windowInsetX: 5,
    windowInsetY: 5,
    litWindowEvery: 5,        // 1-in-N cells show a lit window (deterministic)
    crackColor: '#20242f',
    holeColor: '#0b0e16',
    debrisColor: '#161a24',   // 09-art-audio §10 — HOLE-cell rubble bits and
    scorchColor: '#211c1e',   // rubble-mound scorch flecks, new in Session 11
    palettes: [
      { wall: '#5a4a44', wallShade: '#483a35', roof: '#6d5b52', windowLit: '#e8c452', windowDark: '#2a2530' },
      { wall: '#44525a', wallShade: '#35414a', roof: '#566670', windowLit: '#d8e08a', windowDark: '#232b33' },
      { wall: '#53485e', wallShade: '#41384a', roof: '#665a73', windowLit: '#e0a86a', windowDark: '#282232' },
    ],
  },

  /* ---- Military — Guardsmen, helicopters, munitions (04-military-hazards
     §5.1) --------------------------------------------------------------
     "The military attacks continuously. Present every day: National
     Guardsmen and helicopters." Neither fire rates, projectile speeds, nor
     spawn cadences are documented anywhere in the GDD — every number below
     is a first-pass guess, same as CONFIG.monster was in Session 1.
     [INFERRED — 13-inferred-items.md #10, and see #33 below for what's new
     this session.]                                                        */
  enemies: {
    guardsman: {
      width: 12,
      height: 20,          // same footprint as CONFIG.humans — fits one cell
      color: '#4a5c3a',

  /* ---- Days, cities and progression (06-levels-progression.md §7) -------

     (2-6). Clear all buildings → the day ends → a brief newspaper-headline
     interstitial → next day." 128 unique days, run six times over for 768,

     data array — adding a city is one more row and nothing else: no code
     change, no new branch, no layout arithmetic by hand. `LevelData` (the
     06-levels-progression section further down) resolves a row into a
     playable day, filling in anything the row leaves out from `defaults`.

     A row's fields, all optional except `day`:
       day        1-128, the day's slot in the pass. Rows may be sparse and
                  in any order; LevelData indexes them by this number.
       city       display name for the interstitial.
       buildings  [{ cols, rows, palette }] — 2-6 of them. x positions and
                  gaps are computed (LevelData.layoutRow), never authored.
                  Omit it and the day gets a deterministic procedural layout
                  (LevelData.proceduralBuildings) so an un-authored city is
                  still playable. Fit rule for an author: total cols × 22 px
                  must be under the street span (500 px, less the river on a
                  riverway day) — `rows` is clamped up to buildings.minRows.
       features   { riverway, bridge, pier, train, boater } — §7.3 level
                  dressing. riverway/bridge/pier are { x, w } spans in px;
                  train/boater are booleans. A riverway shortens the span
                  the buildings are laid out across (LevelData.spanFor).
       enemies    which of the §5.1 roster the SpawnDirector may spawn today.
       difficulty explicit §5.2 scalar override; omitted, it ramps with the
                  day number (CONFIG.difficulty.dayScalarStep).

     [INFERRED — 13-inferred-items.md #9] Only two entries in the arcade's
     128-city list are confirmed by our sources: Peoria IL is day 1 and Plano
     IL is day 128 (the 2-building in-joke). Every other city name below is a

    passes: 6,                // §7.2 — six passes = 768 days, then reset [FAITHFUL]

       [INFERRED] — no duration is documented. Both screens can be skipped
       with a start press, so these are a ceiling, not a wait.              */
    clearHold: 4.0,           // s the headline interstitial holds
    introHold: 2.4,           // s the "next city" card holds
    maxGap: 60,               // px — cap on the computed gap between two
                              // buildings, so a 2-building day doesn't put
                              // one at each screen edge (LevelData.layoutRow)
    riverMargin: 8,           // px of dry street between the last building
                              // and the near bank of a riverway

       arcade's spirit rather than its (copyrighted) copy — the GDD asks for

    headlines: [

      'CITY COUNCIL VOTES 7-0 TO STOP HAVING BUILDINGS',
      'GIANT LIZARD EATS LANDMARK, ASKS FOR SECONDS',
      'LOCAL SKYLINE IS NOW A LOCAL FLATLINE',
      'ARMY DEPLOYS EVERYTHING; MONSTER DEPLOYS FIST',
      'INSURANCE ADJUSTER RESIGNS MID-SENTENCE',
      'FORECAST: CLOUDY, WITH A CHANCE OF RUBBLE',
      'TOURISM BOARD CALLS PANIC "RECORD FOOT TRAFFIC"',
      'APE SEEN LEAVING TOWN; TOWN SEEN LEAVING TOWN',
      'CHAMBER OF COMMERCE UNVEILS BOLD NEW VACANT LOT',
    ],

       override just `enemies.lightning` and inherit the rest. */
    defaults: {
      buildings: null,        // null → LevelData.proceduralBuildings(day)
      difficulty: null,       // null → day-number ramp

      enemies: {

       Fill them in as content, one row at a time.                         */
    days: [
      // Day 1 — Peoria, the confirmed arcade opener. Deliberately the
      // gentlest board: five buildings, no level features, and only the two

      { day: 1, city: 'PEORIA, IL',
        buildings: [
          { cols: 3, rows: 7, palette: 0 },
          { cols: 4, rows: 5, palette: 1 },
          { cols: 3, rows: 9, palette: 2 },
          { cols: 5, rows: 6, palette: 0 },

        buildings: [
          { cols: 4, rows: 6, palette: 1 },
          { cols: 3, rows: 8, palette: 2 },
          { cols: 5, rows: 5, palette: 0 },

          { cols: 3, rows: 6, palette: 0 },

      { day: 4, city: 'GALESBURG, IL',
        buildings: [

          { cols: 5, rows: 9, palette: 2 },

  /* ---- Level features (06-levels-progression.md §7.3) -------------------
     "Days can include set-piece features: bridge, riverway (water hazard —
     going under drains health), piers + boater, and train/trolley."

     [INFERRED throughout — 13-inferred-items.md #44] §7.3 names the features
     and one rule about them (water drains health) and nothing else: no
     geometry, no speeds, no interaction rules. What's below is the cheapest
     reading that makes each one a real, reachable mechanic:
       riverway — a band of water across the street. A monster standing in
         it takes CONFIG.health.damage.underwaterPerSecond continuously (the
         Session 4 placeholder that has been waiting for this feature). The
         street is drawn side-on, so "in the river" is the same feet line as
         the street — an art-pass wade overlay is Session 11's problem.
       bridge — a deck over part of the riverway. Standing on the deck's
         span is dry: the bridge is the safe way across.
       pier — scenery at the near bank, so the boater has somewhere to be.

/* ==========================================================================
   10-architecture — utilities
   ========================================================================== */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }

/** A filled triangle, apex-and-base rather than three points — the shape
 * every pointed-accent glyph in this file wants (monster ears/spikes/tail,
 * pickup/enemy icon details). `dir` is which way the apex points. */
function fillTriangle(ctx, apexX, apexY, baseWidth, height, dir) {
  ctx.beginPath();
  if (dir === 'up') {
    ctx.moveTo(apexX, apexY - height);
    ctx.lineTo(apexX - baseWidth / 2, apexY);
    ctx.lineTo(apexX + baseWidth / 2, apexY);
  } else if (dir === 'down') {
    ctx.moveTo(apexX, apexY + height);
    ctx.lineTo(apexX - baseWidth / 2, apexY);
    ctx.lineTo(apexX + baseWidth / 2, apexY);
  } else if (dir === 'left') {
    ctx.moveTo(apexX - height, apexY);
    ctx.lineTo(apexX, apexY - baseWidth / 2);
    ctx.lineTo(apexX, apexY + baseWidth / 2);
  } else {
    ctx.moveTo(apexX + height, apexY);
    ctx.lineTo(apexX, apexY - baseWidth / 2);
    ctx.lineTo(apexX, apexY + baseWidth / 2);
  }
  ctx.closePath();
  ctx.fill();
}


/* ==========================================================================
   09-art-audio §10 — AudioManager

   "Audio (keep minimal in Phase 1): monster roars, punch/impact, building-
   collapse rumble, explosion, eat/heal blip, damage/shock zap, and a short
   day-clear sting ... Synthesized via WebAudio is fine — no external asset
   files." All seven SFX are built from plain oscillator/noise nodes below;
   nothing here loads a sound file.

   `SFX` is a module-level singleton rather than a `Game` field. Nearly every
   class in this file needs to fire a sound from deep inside a method that
   has no `game` reference to thread one through (Pickup.consume, Human.
   consume, Building.collapse, every Enemy subclass's consume, Projectile.
   explode) — the same reason CONFIG itself is a bare global rather than
   something threaded everywhere. One AudioContext for the page, created (and
   resumed) on the first real keydown — see InputManager.attach — never at
   page load, since browsers gate audio behind a user gesture and the game
   loop itself never runs from inside one.

   [INFERRED — 13-inferred-items.md #51] The GDD names the seven SFX and
   nothing about *when* each one fires; every trigger below (Monster.update,
   Building.collapse, Pickup.consume/trigger, Human.consume, every Enemy's
   consume, Projectile.explode/updateCharge, GameState.DAY_CLEAR) is this
   session's own reading, documented at each call site.
   ========================================================================== */
class AudioManager {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
  }

  /** Created and resumed on the first real keydown. Safe to call repeatedly —
   * every later keydown just re-resumes a context a tab-switch may have
   * suspended. */
  unlock() {
    if (!CONFIG.audio.enabled) return;
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;                    // no WebAudio support — SFX stays silent
      this.ctx = new Ctx();
      this.master = this.ctx.createGain();
      this.master.gain.value = CONFIG.audio.masterVolume;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  toggleMute() { this.muted = !this.muted; }

  /** Fire-and-forget: every call site plays a sound without checking
   * readiness itself. Silently a no-op before unlock(), while muted, with
   * `CONFIG.audio.enabled` false, or (headless tests) with no WebAudio at
   * all — none of those are errors worth guarding at 30+ call sites. */
  play(name) {
    if (!CONFIG.audio.enabled || this.muted || !this.ctx) return;
    const vol = (CONFIG.audio.volumes[name] || 0.5) * CONFIG.audio.masterVolume;
    switch (name) {
      case 'roar': this.roar(vol); break;
      case 'punch': this.punch(vol); break;
      case 'collapse': this.collapse(vol); break;
      case 'explosion': this.explosion(vol); break;
      case 'eat': this.eat(vol); break;
      case 'zap': this.zap(vol); break;
      case 'dayClearSting': this.dayClearSting(vol); break;
    }
  }

  /* ---- building blocks: every SFX below is one or two of these ---------- */

  /** A tone with a linear frequency sweep and an exponential decay. */
  tone(freqFrom, freqTo, duration, gainPeak, type, startAt) {
    const ctx = this.ctx, t0 = startAt || ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, freqFrom), t0);
    osc.frequency.linearRampToValueAtTime(Math.max(1, freqTo), t0 + duration);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gainPeak, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(g).connect(this.master);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  /** Filtered white noise — the shared basis for punch/collapse/explosion. */
  noise(duration, gainPeak, filterFreq) {
    const ctx = this.ctx, t0 = ctx.currentTime;
    const buffer = ctx.createBuffer(1, Math.max(1, Math.ceil(ctx.sampleRate * duration)), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gainPeak, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    src.connect(filter).connect(g).connect(this.master);
    src.start(t0);
    src.stop(t0 + duration);
  }

  /* ---- the seven SFX (CONFIG.audio.volumes names each) ------------------ */

  roar(vol) {
    this.tone(160, 70, 0.45, vol, 'sawtooth');
    this.noise(0.3, vol * 0.3, 500);
  }
  punch(vol) {
    this.noise(0.08, vol, 1800);
    this.tone(160, 60, 0.09, vol * 0.8, 'square');
  }
  collapse(vol) {
    this.noise(0.7, vol, 350);
    this.tone(90, 40, 0.6, vol * 0.6, 'sine');
  }
  explosion(vol) {
    this.noise(0.5, vol, 900);
    this.tone(120, 30, 0.5, vol * 0.8, 'sawtooth');
  }
  eat(vol) {
    this.tone(380, 700, 0.12, vol, 'triangle');
  }
  zap(vol) {
    this.tone(900, 140, 0.16, vol, 'square');
  }
  /** Short major-key fanfare — 06-levels-progression §7.1's day-clear
   * interstitial. Four notes scheduled up front rather than one-per-tick, so
   * it plays cleanly even if the interstitial's own frame rate stutters. */
  dayClearSting(vol) {
    const notes = [392.00, 523.25, 659.25, 783.99]; // G4 C5 E5 G5
    const start = this.ctx.currentTime;
    for (let i = 0; i < notes.length; i++) {
      this.tone(notes[i], notes[i], 0.2, vol, 'square', start + i * 0.11);
    }
  }
}

const SFX = new AudioManager();


/* ==========================================================================
   10-architecture §11.3 — Entity base class

   Position anchor: x = horizontal centre, y = feet (bottom edge). That makes
   ground contact and, later, building-cell alignment a single comparison.

   prevX/prevY are captured at the top of every fixed step so render() can
   interpolate between the last two simulation states (§11.1).

   This is THE Phase 2 extension seam: Building, Human, Enemy, Projectile,
   Vehicle and Pickup all subclass this. Don't fork a parallel hierarchy.
   ========================================================================== */
class Entity {
  constructor(x, y, w, h) {
    this.x = x; this.y = y;
    this.prevX = x; this.prevY = y;
    this.vx = 0; this.vy = 0;
    this.w = w; this.h = h;
    this.alive = true;
  }

  get left()   { return this.x - this.w / 2; }
  get right()  { return this.x + this.w / 2; }
  get top()    { return this.y - this.h; }
  get bottom() { return this.y; }

  /** Snapshot the current position as "previous" before a fixed step runs. */
  beginStep() { this.prevX = this.x; this.prevY = this.y; }

  /** Interpolated render position. */
  renderX(alpha) { return lerp(this.prevX, this.x, alpha); }
  renderY(alpha) { return lerp(this.prevY, this.y, alpha); }

  update(dt, game) {}          // eslint-disable-line no-unused-vars
  draw(ctx, alpha) {}          // eslint-disable-line no-unused-vars
}


/* ==========================================================================
   10-architecture §11.3 — EntityManager
   Spawn / update / despawn plus simple typed lookup. Spatial queries arrive
   when a system needs them (buildings, Session 2) — not before.
   ========================================================================== */
class EntityManager {
  constructor() { this.entities = []; }

  add(entity) { this.entities.push(entity); return entity; }
  clear() { this.entities.length = 0; }

  ofType(Type) { return this.entities.filter(function (e) { return e instanceof Type; }); }

  update(dt, game) {
    for (let i = 0; i < this.entities.length; i++) {
      const e = this.entities[i];
      e.beginStep();
      e.update(dt, game);
    }
    // Despawn pass.
    let write = 0;
    for (let i = 0; i < this.entities.length; i++) {
      if (this.entities[i].alive) this.entities[write++] = this.entities[i];
    }
    this.entities.length = write;
  }

  draw(ctx, alpha) {
    for (let i = 0; i < this.entities.length; i++) this.entities[i].draw(ctx, alpha);
  }
}


/* ==========================================================================
   10-architecture §11.3 — InputManager

   Per-player key sets, sized for CONFIG.players.maxPlayers (3). Slot 0 is
   wired for Session 1; the other slots' maps are already data above.

   Control model is 02-movement-destruction.md §3: 8-way direction + Punch +
   Jump. Held state drives movement; edge ("...Pressed") state drives punch,
   jump and menu confirms, and is consumed by exactly one fixed step so a tap
   never fires twice and never gets lost between frames.
   ========================================================================== */
const INPUT_ACTIONS = ['left', 'right', 'up', 'down', 'punch', 'jump', 'start'];

class InputManager {
  constructor(slots) {
    this.slots = slots;
    this.held = Object.create(null);      // keyCode -> true while physically down
    this.pendingPress = Object.create(null); // keyCode -> true if pressed since last poll
    this.lastPressed = Object.create(null);  // the edges the current step owns
    this.watched = Object.create(null);   // keyCode -> true if any slot uses it

    this.players = [];
    for (let i = 0; i < slots.length; i++) {
      const state = {};
      for (const action of INPUT_ACTIONS) {
        state[action] = false;
        state[action + 'Pressed'] = false;
      }
      this.players.push(state);
      for (const action of INPUT_ACTIONS) {
        for (const code of (slots[i].keys[action] || [])) this.watched[code] = true;
      }
    }
  }

  attach(target) {
    const self = this;
    target.addEventListener('keydown', function (e) {
      SFX.unlock();      // 09-art-audio §10 — the page's first real user gesture
      if (self.watched[e.code]) e.preventDefault();
      if (e.repeat) return;                 // auto-repeat must not re-trigger edges
      self.held[e.code] = true;
      self.pendingPress[e.code] = true;
    });
    target.addEventListener('keyup', function (e) {
      if (self.watched[e.code]) e.preventDefault();
      self.held[e.code] = false;
    });
    // A lost focus with keys down would otherwise leave the monster walking.
    target.addEventListener('blur', function () { self.releaseAll(); });
  }

  releaseAll() {
    this.held = Object.create(null);
    this.pendingPress = Object.create(null);
    this.lastPressed = Object.create(null);
    for (const state of this.players) {
      for (const action of INPUT_ACTIONS) {
        state[action] = false;
        state[action + 'Pressed'] = false;
      }
    }
  }

  /** Called once at the top of every fixed step, before anything reads input. */
  poll() {
    for (let i = 0; i < this.slots.length; i++) {
      const keys = this.slots[i].keys;
      const state = this.players[i];
      for (const action of INPUT_ACTIONS) {
        const codes = keys[action] || [];
        let down = false, pressed = false;
        for (const code of codes) {
          if (this.held[code]) down = true;
          if (this.pendingPress[code]) pressed = true;
        }
        state[action] = down;
        state[action + 'Pressed'] = pressed;
      }
    }
    this.lastPressed = this.pendingPress;     // raw edges this step owns
    this.pendingPress = Object.create(null);  // edges are consumed by this step
  }

  getPlayer(index) { return this.players[index]; }

  /**
   * A raw key-code edge for this step, outside the per-player action maps.
   * Only the Session 9 debug day-jump keys (CONFIG.debug.dayKeys) use this —
   * they aren't player actions and shouldn't take a slot in INPUT_ACTIONS,
   * but they still need to be edge-triggered and consumed by exactly one
   * fixed step like everything else.
   */
  wasPressed(code) { return !!this.lastPressed[code]; }

  anyPressed(action) {
    for (const state of this.players) if (state[action + 'Pressed']) return true;
    return false;
  }
}


/* ==========================================================================
   02-movement-destruction §3.2 — Building

   "A building is a vertical stack of destructible cells (a grid of
   windows/wall sections)." Each cell holds a state and HP.

   Session 3 (§3.2/§3.3) adds the whole destruction path on top of that grid:
   punches drive a cell INTACT → CRACKED → HOLE → GONE, and a building runs
   STANDING → SHAKING → RUBBLE. A building is *solid to traversal* while it is
   STANDING or SHAKING (`standing` is true for both) — the shaking window is a
   warning, not a removal — and stops being climbable the instant it is RUBBLE.

   Anchor matches Entity: x = horizontal centre, y = base (feet line) — which
   is the street, so a building's base y is always CONFIG.world.groundY and
   `top` is its roof line. Cell (0,0) is the TOP-LEFT cell.

   Traversal note: the monster walks the street *in front of* the buildings
   (the 1986 original does the same — the street is a lane, not a corridor),
   so a building never blocks ground movement. It is only solid in the sense
   that a clinging monster is pinned flush to its face and a monster on the
   roof stands on its top. [INFERRED] — 13-inferred-items.md #15.
   ========================================================================== */
const CellState = {
  INTACT:  'INTACT',
  CRACKED: 'CRACKED',   // partial break (§3.2) — scores differently in §6
  HOLE:    'HOLE',      // full break, section opened
  GONE:    'GONE',      // section removed entirely
};

/* Whole-building lifecycle (§3.3). SHAKING is the tell that gives a monster
   on the building a chance to jump clear before the fall damage lands. */
const BuildingState = {
  STANDING: 'STANDING',
  SHAKING:  'SHAKING',
  RUBBLE:   'RUBBLE',
};

/* The non-GONE damage states in order. A cell's HP is spread evenly across
   them so CONFIG.buildings.cellHp stays a free tunable: at cellHp 3 that's one
   punch per state, at cellHp 6 it's two, and nothing else has to change. */
const CELL_DAMAGE_ORDER = [CellState.INTACT, CellState.CRACKED, CellState.HOLE];

function cellStateForHp(hp, maxHp) {
  if (hp <= 0) return CellState.GONE;
  const perStage = maxHp / CELL_DAMAGE_ORDER.length;
  const stagesLeft = clamp(Math.ceil(hp / perStage), 1, CELL_DAMAGE_ORDER.length);
  return CELL_DAMAGE_ORDER[CELL_DAMAGE_ORDER.length - stagesLeft];
}

class Building extends Entity {
  constructor(leftX, cols, rows, paletteIndex, index) {
    const B = CONFIG.buildings;
    const w = cols * B.cellWidth;
    const h = rows * B.cellHeight;
    super(leftX + w / 2, CONFIG.world.groundY, w, h);

    this.index = index;                 // stable id, used in collapse records
    this.cols = cols;
    this.rows = rows;
    this.palette = B.palettes[paletteIndex % B.palettes.length];

    // Grid of destructible cells (§3.2).
    this.cells = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) row.push({ state: CellState.INTACT, hp: B.cellHp, pickup: null, human: null, enemy: null });
      this.cells.push(row);
    }

    /* Collapse bookkeeping (§3.3). structureHp is maintained incrementally
       rather than re-summed, so the threshold test is O(1) per punch. */
    this.structureState = BuildingState.STANDING;
    this.shakeTimer = 0;
    this.structureHpMax = rows * cols * B.cellHp;
    this.structureHp = this.structureHpMax;

    /* Attribution (§6): the 2,500-point "building destroyed" bonus is paid
       only to the monster that actually brought it down. Set when the building
       starts shaking, so whatever landed the last blow owns the collapse.
       `causedBy` is null for a third-party collapse (demolition charges,
       helicopter bombs, dynamite — Session 6), which pays nobody. */
    this.causedBy = null;
    this.causeKind = null;              // 'punch' | 'roofDrop' | 'thirdParty'
  }

  /** The roof line the monster stands on. Same as Entity.top; named for clarity. */
  get roofY() { return this.top; }

  /** Solid to traversal — true while STANDING *and* while SHAKING. */
  get standing() { return this.structureState !== BuildingState.RUBBLE; }
  get isRubble() { return this.structureState === BuildingState.RUBBLE; }
  get isShaking() { return this.structureState === BuildingState.SHAKING; }

  /** Remaining structure as a fraction of the intact building, 1 → 0. */
  get structureFraction() {
    return this.structureHpMax > 0 ? this.structureHp / this.structureHpMax : 0;
  }

  cellAt(col, row) {
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return null;
    return this.cells[row][col];
  }

  /** World-space rect of one cell. */
  cellRect(col, row) {
    const B = CONFIG.buildings;
    return {
      x: this.left + col * B.cellWidth,
      y: this.top + row * B.cellHeight,
      w: B.cellWidth,
      h: B.cellHeight,
    };
  }

  /** Grid coords for a world point, or null if the point is off the building. */
  cellIndexAt(x, y) {
    const B = CONFIG.buildings;
    const col = Math.floor((x - this.left) / B.cellWidth);
    const row = Math.floor((y - this.top) / B.cellHeight);
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return null;
    return { col, row };
  }

  /** How many px of [left,right] lie over this building's frontage. */
  overlapWidth(left, right) {
    return Math.min(right, this.right) - Math.max(left, this.left);
  }

  /** Deterministic lit/dark window pattern — no RNG, so reloads look the same. */
  windowLit(col, row) {
    return ((col * 7 + row * 13 + this.index * 5) % CONFIG.buildings.litWindowEvery) === 0;
  }

  /* ---- §3.2 destruction ------------------------------------------------ */

  /**
   * "Punch a wall section ... to rip out that section. Repeated hits destroy
   * successive sections."
   *
   * Returns the break kind for the scorer, or null if this hit didn't change
   * the section's state: 'partial' when the section first cracks (§6: 25 pts),
   * 'full' when the punch opens a hole (§6: 225 pts). Removing an
   * already-holed section returns null — §6 has no row for it.
   * [INFERRED — 13-inferred-items.md #18.] `ScoreSystem` consumes this
   * return value (see Monster.resolvePunch); Session 3 only had to make the
   * damage happen.
   *
   * `game` is optional so Session 3's call sites (and the headless tests)
   * keep working unchanged; pass it to get item reveals on the HOLE
   * transition (03-eating-health.md §4.2/§4.3) — see Monster.resolvePunch,
   * which is the only real caller and always has one.
   */
  damageCell(col, row, amount, byMonster, causeKind, game) {
    if (this.isRubble) return null;
    const cell = this.cellAt(col, row);
    if (!cell || cell.state === CellState.GONE) return null;

    const applied = Math.min(amount, cell.hp);
    cell.hp -= applied;
    this.structureHp -= applied;

    const before = cell.state;
    cell.state = cellStateForHp(cell.hp, CONFIG.buildings.cellHp);

    // Damage can be the blow that starts the collapse, so test before
    // returning — the break kind is scored either way.
    this.checkCollapseTriggers(byMonster, causeKind);

    if (cell.state === before) return null;
    if (cell.state === CellState.CRACKED) return 'partial';
    if (cell.state === CellState.HOLE) {
      if (game) this.spawnOccupant(col, row, game);
      return 'full';
    }
    // → GONE. §6 has no row for it, and anything still sitting exposed goes
    // with the wall — this shouldn't normally happen (Monster.resolvePunch
    // eats/grabs whatever occupies a cell instead of damaging it further)
    // but it's a safety net for any other future caller of damageCell.
    if (cell.pickup) { cell.pickup.alive = false; cell.pickup = null; }
    if (cell.human) { cell.human.alive = false; cell.human = null; }
    if (cell.enemy) { cell.enemy.alive = false; cell.enemy = null; }
    return null;
  }

  /** Is there an uneaten item sitting in this cell right now? */
  pickupAt(col, row) {
    const cell = this.cellAt(col, row);
    return cell ? cell.pickup : null;
  }

  clearPickupCell(col, row) {
    const cell = this.cellAt(col, row);
    if (cell) cell.pickup = null;
  }

  /** 01-monsters §2.3 — is there a civilian/victim sitting in this cell right now? */
  humanAt(col, row) {
    const cell = this.cellAt(col, row);
    return cell ? cell.human : null;
  }

  clearHumanCell(col, row) {
    const cell = this.cellAt(col, row);
    if (cell) cell.human = null;
  }

  /** 04-military-hazards §5.1 — is a window Guardsman occupying this cell? */
  enemyAt(col, row) {
    const cell = this.cellAt(col, row);
    return cell ? cell.enemy : null;
  }

  clearEnemyCell(col, row) {
    const cell = this.cellAt(col, row);
    if (cell) cell.enemy = null;
  }

  /**
   * 04-military-hazards §5.1 — SpawnDirector's hook: pop a Guardsman out of
   * this cell, if it's free and still has a wall to pop out of (INTACT or
   * CRACKED — a HOLE/GONE cell has nothing left to lean out of).
   * [INFERRED — not documented either way, but it's the same "needs a wall"
   * reading `resolvePunch` already uses when it stops chewing at GONE.]
   * Returns the new Guardsman, or null if the cell doesn't qualify.
   */
  spawnEnemyWindow(col, row, game) {
    const cell = this.cellAt(col, row);
    if (!cell || cell.pickup || cell.human || cell.enemy) return null;
    if (cell.state !== CellState.INTACT && cell.state !== CellState.CRACKED) return null;
    const enemy = Guardsman.spawnInWindow(this, col, row);
    cell.enemy = enemy;
    game.entities.add(enemy);
    return enemy;
  }

  /**
   * 03-eating-health §4.2/§4.3 — a punch just opened this cell to HOLE;
   * reveal whatever CONFIG.pickups.spawnCycle says lives there. Deterministic
   * per position (same trick as windowLit), so a reload reveals the same
   * items in the same windows. [INFERRED — 13-inferred-items.md #21.]
   */
  spawnPickup(col, row, game) {
    const cell = this.cellAt(col, row);
    if (!cell || cell.pickup) return;
    const P = CONFIG.pickups;
    const idx = (col * 7 + row * 13 + this.index * 5 + 1) % P.spawnCycle.length;
    const def = P.definitions.find(function (d) { return d.id === P.spawnCycle[idx]; });
    if (!def) return;
    const pickup = new Pickup(def, this, col, row);
    cell.pickup = pickup;
    game.entities.add(pickup);
  }

  /**
   * 01-monsters §2.3 — reveal a civilian or designated victim in this cell
   * instead of a Pickup.
   */
  spawnHuman(typeId, col, row, game) {
    const cell = this.cellAt(col, row);
    if (!cell || cell.human) return;
    const human = Human.spawnInWindow(typeId, this, col, row);
    cell.human = human;
    game.entities.add(human);
  }

  /**
   * 01-monsters §2.3 — decide what this newly opened cell reveals: an item
   * (deferring to spawnPickup's own cycle) or a civilian/victim. A separate
   * deterministic cycle keyed the same way as spawnPickup's, so the two
   * choices don't have to share an index space. [INFERRED — #31.]
   */
  spawnOccupant(col, row, game) {
    const cell = this.cellAt(col, row);
    if (!cell || cell.pickup || cell.human) return;
    const H = CONFIG.humans;
    const idx = (col * 7 + row * 13 + this.index * 5 + 1) % H.windowOccupancyCycle.length;
    const token = H.windowOccupancyCycle[idx];
    if (token === 'ITEM') { this.spawnPickup(col, row, game); return; }
    this.spawnHuman(token, col, row, game);
  }

  /* ---- §3.3 collapse trigger & consequences ---------------------------- */

  /** Every cell of the bottom row removed — "loss of lower support". */
  bottomRowGone() {
    const row = this.cells[this.rows - 1];
    for (let c = 0; c < this.cols; c++) {
      if (row[c].state !== CellState.GONE) return false;
    }
    return true;
  }

  /**
   * §3.3: "a building collapses once enough of its structure is gone (a
   * critical amount of cell damage / loss of lower support)."
   *
   * [INFERRED] The exact trigger is undocumented — this is the Phase 1 model
   * the GDD itself proposes, with the two thresholds picked in CONFIG. See the
   * rationale block at CONFIG.buildings.collapseStructureFraction.
   */
  checkCollapseTriggers(byMonster, causeKind) {
    if (this.structureState !== BuildingState.STANDING) return;
    const B = CONFIG.buildings;
    if (this.structureFraction <= B.collapseStructureFraction ||
        (B.collapseOnBottomRowGone && this.bottomRowGone())) {
      this.beginShaking(byMonster, causeKind);
    }
  }

  /**
   * Enter the SHAKING window. Whoever triggered this owns the collapse for
   * §6 attribution, even if the building takes another hit before it falls —
   * the blow that doomed it is the one that counts.
   *
   * `byMonster` is null for a third-party collapse (Session 6's demolition
   * charges and bombs), which is exactly what makes that collapse pay nobody.
   */
  beginShaking(byMonster, causeKind) {
    if (this.structureState !== BuildingState.STANDING) return;
    this.structureState = BuildingState.SHAKING;
    this.shakeTimer = CONFIG.buildings.shakeDuration;
    this.causedBy = byMonster || null;
    this.causeKind = causeKind || 'thirdParty';
  }

  /**
   * Collapse: rubble on the street, a dust puff, and fall damage for anyone
   * who didn't take the hint. §3.3: "if a monster is still clinging to (or
   * standing on) a building when it collapses, it takes a large chunk of
   * damage from the fall. The shaking state is the tell."
   */
  collapse(game) {
    if (this.isRubble) return;
    this.structureState = BuildingState.RUBBLE;
    this.shakeTimer = 0;
    // 09-art-audio §10 — the collapse rumble plays for every collapse,
    // player-caused or not; the roar is the punching monster's, so it's
    // silent for a third-party (demolition charge/bomb) collapse.
    SFX.play('collapse');
    if (this.causedBy) SFX.play('roar');

    const monsters = game.entities.ofType(Monster);
    for (let i = 0; i < monsters.length; i++) {
      const m = monsters[i];
      if (m.attached !== this) continue;         // airborne monsters ride it out
      m.detach(null, false);                     // → AIR, falls to the street
      m.vy = 0;
      m.applyDamage(CONFIG.health.damage.fall, 'FALL');
    }

    spawnDustPuffs(game, this);

    // §6: "the 2,500-point building bonus is only credited to the monster
    // that actually caused the collapse." `causedBy` is null for a
    // third-party collapse (demolition charge, bomb — Session 6), so
    // ScoreSystem.award's own falsy-monster guard pays nobody, no branch
    // needed here.
    game.scoreSystem.award(this.causedBy, CONFIG.scoring.buildingDestroyed, 'buildingDestroyed');

    // The attribution record, kept for the debug readout's collapse list.
    game.collapseEvents.push({
      building: this,
      buildingIndex: this.index,
      causedBy: this.causedBy,
      causeKind: this.causeKind,
      simTime: game.simTime,
    });
  }

  update(dt, game) {
    if (this.structureState !== BuildingState.SHAKING) return;
    this.shakeTimer -= dt;
    if (this.shakeTimer <= 0) {
      this.shakeTimer = 0;
      this.collapse(game);
    }
  }

  /**
   * Horizontal judder while SHAKING. Driven off the render alpha as well as
   * the timer so an 18 Hz shake doesn't alias against the 60 Hz simulation.
   */
  shakeOffset(alpha) {
    if (!this.isShaking) return 0;
    const B = CONFIG.buildings;
    const elapsed = B.shakeDuration - this.shakeTimer + (alpha || 0) * CONFIG.loop.fixedDt;
    return Math.sin(elapsed * B.shakeFrequency * Math.PI * 2) * B.shakeAmplitude;
  }

  /* ---- 09-art-audio: placeholder window-grid art ---------------------- */
  draw(ctx, alpha) {
    if (this.isRubble) { this.drawRubble(ctx); return; }

    const B = CONFIG.buildings;
    const left = Math.round(this.left + this.shakeOffset(alpha));
    const top = Math.round(this.top);

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) this.drawCell(ctx, c, r, left, top);
    }

    // Roof cap sits *inside* the top of the building so the roof line the
    // monster stands on is the true `top`, with no floating gap.
    ctx.fillStyle = this.palette.roof;
    ctx.fillRect(left - B.roofCapOverhang, top,
      this.w + B.roofCapOverhang * 2, B.roofCapHeight);
  }

  drawCell(ctx, col, row, left, top) {
    const B = CONFIG.buildings;
    const p = this.palette;
    const cell = this.cells[row][col];
    if (cell.state === CellState.GONE) return;        // sky shows through

    const x = left + col * B.cellWidth;
    const y = top + row * B.cellHeight;
    const w = B.cellWidth;
    const h = B.cellHeight;

    if (cell.state === CellState.HOLE) {
      ctx.fillStyle = p.wallShade;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = B.holeColor;
      ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
      // 09-art-audio §10 — a ragged edge and a couple of debris chips, so a
      // punched-through wall reads as a hole torn in it rather than a flat
      // dark rectangle. Deterministic per cell (same no-RNG convention as
      // windowLit) so a reload tears the same holes.
      const jag = (col * 7 + row * 3 + this.index) % 3;
      ctx.fillStyle = p.wallShade;
      ctx.fillRect(x + 2, y + 2, w - 4, 1 + jag);
      ctx.fillStyle = B.debrisColor;
      ctx.fillRect(x + 4 + jag, y + h - 6, 3, 3);
      ctx.fillRect(x + w - 8, y + h - 5 - jag, 3, 2);
      return;
    }

    ctx.fillStyle = p.wall;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = p.wallShade;
    ctx.fillRect(x, y + h - 1, w, 1);               // floor seam
    ctx.fillRect(x + w - 1, y, 1, h);               // column seam

    ctx.fillStyle = this.windowLit(col, row) ? p.windowLit : p.windowDark;
    ctx.fillRect(x + B.windowInsetX, y + B.windowInsetY,
      w - B.windowInsetX * 2, h - B.windowInsetY * 2);

    if (cell.state === CellState.CRACKED) {
      // Two hairline cracks plus a corner chip — a bit more "cracked glass"
      // than a single straight line reads as.
      const jog = (col + row) % 2 === 0 ? 1 : -1;
      ctx.fillStyle = B.crackColor;
      ctx.fillRect(x + 3, y + 3, 2, h - 6);
      ctx.fillRect(x + 3, y + Math.round(h / 2), w - 8, 2);
      ctx.fillRect(x + w - 6 - jog, y + 3, 2, Math.round(h / 3));
      ctx.fillRect(x + 3, y + 3, 3, 2);
    }
  }

  /**
   * §3.3 rubble mound. Scenery only in Phase 1 — it neither blocks the street
   * nor supports anything, so nothing in traversal has to know it exists (see
   * `standing`). The ragged top is a fixed pattern, not RNG, so a reload draws
   * the same street.
   */
  drawRubble(ctx) {
    const B = CONFIG.buildings;
    const left = Math.round(this.left);
    const base = Math.round(CONFIG.world.groundY);

    ctx.fillStyle = B.rubbleColor;
    ctx.fillRect(left, base - B.rubbleHeight, this.w, B.rubbleHeight);

    ctx.fillStyle = B.rubbleShadeColor;
    for (let c = 0; c < this.cols; c++) {
      const bump = ((c * 5 + this.index * 3) % 3) + 1;
      ctx.fillRect(left + c * B.cellWidth, base - B.rubbleHeight - bump, B.cellWidth, bump);
    }

    // A couple of surviving slabs so the mound reads as a wrecked building
    // rather than a kerb.
    ctx.fillStyle = this.palette.wallShade;
    for (let c = 0; c < this.cols; c += 2) {
      const slabW = Math.round(B.cellWidth / 2);
      ctx.fillRect(left + c * B.cellWidth + 3, base - B.rubbleHeight + 2, slabW, 3);
    }

    // 09-art-audio §10 — scorch flecks and loose debris scattered across the
    // mound, new in Session 11. Same fixed-pattern convention as the bumps
    // above, keyed off building index + cell so every reload draws the
    // identical mound.
    ctx.fillStyle = B.scorchColor;
    for (let c = 0; c < this.cols; c++) {
      if ((c * 11 + this.index * 7) % 4 !== 0) continue;
      ctx.fillRect(left + c * B.cellWidth + 5, base - 3, 2, 2);
    }
    ctx.fillStyle = B.debrisColor;
    for (let c = 1; c < this.cols; c += 2) {
      ctx.fillRect(left + c * B.cellWidth - 2, base - B.rubbleHeight + 4, 3, 2);
    }
  }
}


/* ==========================================================================
   09-art-audio — dust puff (02-movement-destruction §3.3)

   "collapses into a rubble pile with a dust puff." Purely cosmetic: no
   collision, no gameplay effect, despawns on its own. Spread and rise are a
   fixed pattern rather than RNG so a collapse looks identical on every run,
   which also keeps the headless tests deterministic.
   ========================================================================== */
class DustPuff extends Entity {
  constructor(x, y, vx, vy) {
    super(x, y, 0, 0);
    this.vx = vx;
    this.vy = vy;
    this.age = 0;
  }

  update(dt) {
    const D = CONFIG.buildings.dust;
    this.age += dt;
    if (this.age >= D.life) { this.alive = false; return; }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  draw(ctx, alpha) {
    const D = CONFIG.buildings.dust;
    const t = clamp(this.age / D.life, 0, 1);
    const size = Math.round(D.startSize + D.growth * t);
    ctx.fillStyle = 'rgba(' + D.color + ',' + (D.maxAlpha * (1 - t)).toFixed(3) + ')';
    ctx.fillRect(
      Math.round(this.renderX(alpha) - size / 2),
      Math.round(this.renderY(alpha) - size / 2),
      size, size
    );
  }
}

function spawnDustPuffs(game, building) {
  const D = CONFIG.buildings.dust;
  for (let i = 0; i < D.count; i++) {
    const t = (i + 0.5) / D.count;                  // 0..1 across the frontage
    const jitter = (((i * 37 + building.index * 11) % 17) / 16) - 0.5;
    game.entities.add(new DustPuff(
      building.left + building.w * t,
      CONFIG.world.groundY,
      (t - 0.5) * 2 * D.spreadSpeed,                // blows outward from centre
      -D.riseSpeed * (1 + jitter)
    ));
  }
}


/* ==========================================================================
   03-eating-health §4.2, §4.3 — Pickup

   Food, bad items, live electrical, wall dynamite and the two knock-off
   hazards (photographer, bather) — everything a punch can reveal inside a
   building. One class for all of them; CONFIG.pickups.definitions is the
   only place the flavor differs (see the CONFIG block for the full list and
   its rationale).

   A Pickup is anchored to a specific building cell and lives until either
   `consume()` (a monster punches the open cell — Monster.resolvePunch routes
   here instead of damaging the cell further) or, for `fuse` items, `trigger()`
   (nobody ate it in time). Both remove it from the building's cell and the
   entity list. If the building it's attached to comes down first, it goes
   with it — Phase 1 doesn't carry items over into rubble (§3.3 says rubble
   "can still contain exposed food/items"; deferred, 13-inferred-items.md #21).
   ========================================================================== */

/**
 * 09-art-audio §10 — one small readable icon per pickup category, in place
 * of the flat color square Sessions 4-7 drew. `def.color` still does most of
 * the identification work (unchanged from before this session); the shape
 * on top is what makes a category readable at a glance without checking the
 * color legend. Electrical items pulse — the "on" (live/dangerous) half of
 * §10's "on/off variants for electrical items so the hazard read is
 * instant." The "off" (safe-to-grab) variant is a different, unbuilt Pickup
 * category (13-inferred-items.md #42) — Phase 1 has nothing to draw an off
 * state *for* yet, so only the live read is new here. `age` is a per-entity
 * cosmetic clock (Pickup.age/Projectile — seconds since spawn), not a game
 * clock, so the glow phase stays deterministic per item rather than reading
 * a wall-clock timer. [INFERRED shapes throughout — 13-inferred-items.md #50.]
 */
function drawPickupIcon(ctx, def, cx, cy, size, age) {
  const half = size / 2;
  switch (def.category) {
    case 'food':
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.arc(cx, cy, half, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillRect(cx - half * 0.4, cy - half * 0.5, Math.max(1, half * 0.4), Math.max(1, half * 0.3));
      break;
    case 'bad':
      ctx.fillStyle = def.color;
      ctx.fillRect(cx - half, cy - half, size, size);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      fillTriangle(ctx, cx, cy - half, size * 0.3, size * 0.3, 'up');
      fillTriangle(ctx, cx - half * 0.5, cy + half * 0.6, size * 0.2, size * 0.2, 'down');
      break;
    case 'electrical': {
      const pulse = 0.55 + 0.45 * Math.sin(age * 6);
      ctx.fillStyle = 'rgba(255, 244, 190, ' + (pulse * 0.5).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, half + 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = def.color;
      ctx.fillRect(cx - half, cy - half, size, size);
      ctx.fillStyle = '#fff8dc';
      fillTriangle(ctx, cx, cy - half * 0.6, size * 0.35, size * 0.5, 'down');
      fillTriangle(ctx, cx, cy + half * 0.6, size * 0.35, size * 0.5, 'up');
      break;
    }
    case 'dynamite':
      ctx.fillStyle = def.color;
      ctx.fillRect(cx - half * 0.6, cy - half, size * 0.6, size);
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(cx - 1, cy - half - 3, 2, 3);   // fuse stub
      break;
    case 'hazard':
      ctx.fillStyle = def.color;
      ctx.beginPath();
      ctx.arc(cx, cy, half, 0, Math.PI * 2);
      ctx.fill();
      if (def.id === 'PHOTOGRAPHER') {
        ctx.fillStyle = '#cfd6e4';
        ctx.beginPath();
        ctx.arc(cx, cy, half * 0.45, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(cx - half, cy - 1, size, 1);
        ctx.fillRect(cx - half, cy + 2, size, 1);
      }
      break;
    case 'weapon':
      ctx.fillStyle = def.color;
      if (def.id === 'SAFE') {
        ctx.fillRect(cx - half, cy - half, size, size);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx, cy, half * 0.4, 0, Math.PI * 2); ctx.stroke();
      } else if (def.id === 'FLOWER_POT') {
        ctx.fillRect(cx - half * 0.7, cy - half * 0.2, size * 0.7, size * 0.6);
        fillTriangle(ctx, cx, cy - half * 0.2, size * 0.9, half * 0.5, 'up');
      } else {
        ctx.beginPath();
        ctx.arc(cx, cy, half, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.moveTo(cx - half, cy); ctx.lineTo(cx + half, cy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, cy - half); ctx.lineTo(cx, cy + half); ctx.stroke();
      }
      break;
    default:   // 'neutral'
      ctx.fillStyle = def.color;
      ctx.fillRect(cx - half, cy - half, size, size);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx - half + 0.5, cy - half + 0.5, size - 1, size - 1);
  }
}

class Pickup extends Entity {
  constructor(def, building, col, row) {
    const r = building.cellRect(col, row);
    super(r.x + r.w / 2, r.y + r.h, r.w, r.h);
    this.def = def;
    this.building = building;
    this.col = col;
    this.row = row;
    this.fuseTimer = def.fuse || 0;
    this.age = 0;   // 09-art-audio §10 — cosmetic clock for the electrical glow
  }

  update(dt, game) {
    if (!this.alive) return;
    if (!this.building.standing) { this.despawn(); return; }
    this.age += dt;
    if (this.fuseTimer > 0) {
      this.fuseTimer -= dt;
      if (this.fuseTimer <= 0) { this.fuseTimer = 0; this.trigger(game); }
    }
  }

  /**
   * §4.3 — the fuse ran out unconsumed: the wall dynamite blasts, the
   * photographer's camera flashes, the bather splashes. Whoever is still
   * on this building (face or roof) takes the consequences; a monster that
   * already climbed away is untouched — leaving in time is the point.
   */
  trigger(game) {
    if (!this.alive) return;
    // 09-art-audio §10 — the dynamite blast is an 'explosion'; the
    // photographer's flash and the bather's splash are a startled 'zap'
    // (the closest of the seven CONFIG.audio SFX to "hit by a surprise").
    // [INFERRED — 13-inferred-items.md #51.]
    SFX.play(this.def.id === 'DYNAMITE' ? 'explosion' : 'zap');
    const monsters = game.entities.ofType(Monster);
    for (let i = 0; i < monsters.length; i++) {
      const m = monsters[i];
      if (m.attached !== this.building || m.defeated) continue;
      if (this.def.fuseDamage) m.applyDamage(this.def.fuseDamage, this.def.id);
      if (this.def.fuseKnockOff) m.knockOff();
    }
    this.despawn();
  }

  /**
   * §4.2/§4.3 — punched/grabbed before any fuse ran out. A `category:
   * 'weapon'` item (§5.1, new in Session 7) is the one exception: the punch
   * doesn't eat it at all, it knocks it loose — see Projectile.
   * spawnDroppedObject. `game` is optional so any other call site (there
   * currently is none besides Monster.resolvePunch) doesn't break if it
   * can't reach one; a weapon item simply can't be knocked loose without it.
   */
  consume(monster, game) {
    if (!this.alive) return;
    if (this.def.category === 'weapon') {
      if (game) game.entities.add(Projectile.spawnDroppedObject(this.x, this.y, this.def, monster));
      SFX.play('punch');   // 09-art-audio §10 — knocked loose, not eaten
      this.despawn();
      return;
    }
    // 09-art-audio §10 — the mouth-open eat overlay (Monster.draw), plus
    // 'eat' for anything healthy/neutral or 'zap' for anything that hurts —
    // [INFERRED, 13-inferred-items.md #51].
    monster.eatTimer = CONFIG.art.eatDuration;
    SFX.play(this.def.damage ? 'zap' : 'eat');
    if (this.def.heal) monster.heal(this.def.heal, this.def.id);
    if (this.def.damage) monster.applyDamage(this.def.damage, this.def.id);
    if (game) this.awardScore(monster, game);
    this.despawn();
  }

  /**
   * §6 — the two Pickup categories that score on a successful eat: `food`
   * (flat 175 regardless of which specific item — the table gives one
   * number for the whole turkey/hamburger/milk/fruit/toast group, distinct
   * from each item's own `heal` amount) and the Photographer, eaten before
   * its flash (the table's only fuse-hazard row — BATHER has no row and
   * scores nothing, the same "no row = no score" convention
   * Building.damageCell already uses for the final GONE punch). `bad`/
   * `electrical`/`dynamite`/`neutral` categories have no §6 row either.
   */
  awardScore(monster, game) {
    if (this.def.category === 'food') {
      game.scoreSystem.award(monster, CONFIG.scoring.foodItem, this.def.id);
    } else if (this.def.id === 'PHOTOGRAPHER') {
      game.scoreSystem.award(monster, CONFIG.scoring.photographer, 'PHOTOGRAPHER');
    }
  }

  despawn() {
    this.alive = false;
    this.building.clearPickupCell(this.col, this.row);
  }

  /* ---- 09-art-audio §10 — per-category icon ---------------------------- */
  draw(ctx) {
    if (!this.alive) return;
    const r = this.building.cellRect(this.col, this.row);
    const size = Math.max(6, Math.round(Math.min(r.w, r.h) * 0.4));
    const cx = Math.round(r.x + r.w / 2);
    const cy = Math.round(r.y + r.h / 2);
    // Warn just before a fuse item goes off — takes over from the icon
    // entirely, since urgency matters more here than shape.
    const warn = this.fuseTimer > 0 && this.fuseTimer < 0.5 &&
      Math.floor(this.fuseTimer * 10) % 2 === 0;
    if (warn) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - size / 2, cy - size / 2, size, size);
      return;
    }
    drawPickupIcon(ctx, this.def, cx, cy, size, this.age);
  }
}


/* ==========================================================================
   01-monsters §2.3, 03-eating-health §4.2 — Human

   Civilians, designated victims and the window-soldier placeholder all share
   this one class with a `role` flag, per 10-architecture.md §11.3. Two
   spawn shapes, picked by the static factories below:

   - `spawnInWindow` — anchored to a building cell exactly like Pickup
     (revealed the moment a punch opens that cell to HOLE, via
     Building.spawnOccupant); stays put (`WINDOW_IDLE`) until eaten, grabbed,
     or its building comes down under it.
   - `spawnOnStreet` — a free-roaming civilian that spawns already fleeing
     across the street and despawns off the far edge. [INFERRED — no
     proximity/AI behavior is documented; 13-inferred-items.md #28.]

   A punch connecting with a Human (Monster.interactWithHuman) either eats it
   on the spot — the same single grab/eat action Pickup already uses,
   13-inferred-items.md #27 — or, if it's this monster's own *designated
   victim* and this monster isn't already holding someone, grabs and holds it
   instead (§2.3). While HELD the victim tracks the monster; after a random
   `holdTimer` it struggles free, drops onto the street and flees just like
   a plain civilian — `grabbable` latches false so it can only be eaten from
   then on, never re-grabbed.
   ========================================================================== */
const HumanRole = {
  CIVILIAN: 'CIVILIAN',
  DESIGNATED_VICTIM: 'DESIGNATED_VICTIM',
  // WINDOW_SOLDIER removed in Session 6 — the window Guardsman is an Enemy
  // subclass instead (see Guardsman, below Human in this file).
};

const HumanState = {
  WINDOW_IDLE: 'WINDOW_IDLE',   // sitting in a revealed window cell
  FLEEING: 'FLEEING',          // free-roaming on the street (crossing, or post-struggle)
  HELD: 'HELD',                // grabbed by a monster, tracking its position
};

class Human extends Entity {
  constructor(typeId, x, y) {
    const H = CONFIG.humans;
    super(x, y, H.width, H.height);
    this.typeId = typeId;
    this.type = H.types[typeId];
    this.role = this.type.role;

    this.location = null;        // 'WINDOW' | 'STREET' — set by the factory below
    this.state = null;
    this.building = null;
    this.col = -1;
    this.row = -1;

    // §2.3 grab/hold. Only a DESIGNATED_VICTIM is ever grabbable, and only
    // once — struggling free latches it false so it becomes plain-eatable.
    this.grabbable = this.role === HumanRole.DESIGNATED_VICTIM;
